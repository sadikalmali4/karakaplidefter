  <div class="card">
    <h3>101 Kuralları</h3>
    <div class="two">
      <div><label class="fl">Partide el sayısı</label><input type="number" value="${a.yz.elSayisi}" onchange="ayarSet('yz','elSayisi',this.value,1)"></div>
      <div><label class="fl">Çifte çarpanı</label><input type="number" value="${a.yz.cifteCarpan}" onchange="ayarSet('yz','cifteCarpan',this.value,1)"></div>
    </div>
    <div class="two" style="margin-top:10px">
      <div><label class="fl">El bitiren</label><input type="number" value="${a.yz.bitiren}" onchange="ayarSet('yz','bitiren',this.value)"></div>
      <div><label class="fl">Açamayan cezası</label><input type="number" value="${a.yz.acamayan}" onchange="ayarSet('yz','acamayan',this.value)"></div>
    </div>
    <div class="field" style="margin-top:10px"><label class="fl">Varsayılan parti sayısı</label>
      <div class="seg">${[1,2,3].map(n=>`<button class="${a.yz.partiHedef===n?'on':''}" onclick="ayarSet('yz','partiHedef',${n},1);render()">${n===1?'Tek':n+' parti'}</button>`).join('')}</div></div>
    <label style="display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13.5px;cursor:pointer">
      <input type="checkbox" style="width:18px;height:18px" ${a.yz.okeyAktif?'checked':''} onchange="ayarSet('yz','okeyAktif',this.checked);render()">

    <h3>Son İki Sıranın Müeyyidesi</h3>
    <div class="field"><label class="fl">3. sıra</label><input value="${esc(a.yz.muey3)}" onchange="ayarSet('yz','muey3',this.value)" placeholder="Çay ısmarlar"></div>
    <div class="field"><label class="fl">4. sıra</label><input value="${esc(a.yz.muey4)}" onchange="ayarSet('yz','muey4',this.value)" placeholder="Hesabı öder"></div>

  <div class="card">
    <h3>Defter</h3>

      Veriler yalnızca bu tarayıcıda saklanır — düzenli yedek al.</div>
    <div class="two">
      <button onclick="yedekAl()">⬇ Yedek Al</button>

}
function ayarSet(g,k,v,tam){
  if(typeof v==='boolean') DB.ayar[g][k]=v;
  else if(typeof DB.ayar[g][k]==='number') DB.ayar[g][k]=tam?(parseInt(v,10)||0):(Number(v)||0);
  else DB.ayar[g][k]=String(v);
  kaydet(); toast('Kural güncellendi');
}

/* ---------- PROFİL (üyelik + foto) ---------- */
let _foto=null;
function profilAc(id,ilk){
  const o=id?oy(id):null;
  _foto=o?.foto||null;
  acModal(`
    <h2 class="serif" style="margin:0 0 4px">${o?'Üyeyi Düzenle':'Yeni Üye'}</h2>
    <div class="xs dim" style="margin-bottom:14px">${ilk?'Önce sen kaydol; sonra masadakileri ekle.':'Ad ve fotoğraf yeterli.'}</div>
    <div class="row" style="gap:14px;align-items:center">
      <div class="fotoSec" id="fotoBtn" style="${_foto?`background-image:url('${_foto}');border-style:solid`:''}"
        onclick="document.getElementById('fotoInp').click()">${_foto?'':'Fotoğraf<br>ekle'}</div>
      <div class="grow">
        <label class="fl">Ad</label>
        <input id="pAd" value="${esc(o?.ad||'')}" placeholder="Adı" maxlength="24">
        ${_foto?`<button class="btn-xs btn-dn" style="margin-top:8px" onclick="fotoSil()">Fotoğrafı kaldır</button>`:''}
      </div>
    </div>
    <div class="field" style="margin-top:14px"><label class="fl">Doğum günü <span style="text-transform:none;letter-spacing:0">(isteğe bağlı)</span></label>
      <input type="date" id="pDogum" value="${esc(o?.dogum||'')}" max="${bugun()}">
      <div class="xs dim" style="margin-top:5px">Masa unutmasın diye. Doğum gününde oynanan celsede zabta işlenir.</div></div>
    <input type="file" id="fotoInp" accept="image/*" style="display:none" onchange="fotoSec(this)">
    ${ilk?'':`<label style="display:flex;align-items:center;gap:9px;margin-top:14px;font-size:13.5px;cursor:pointer">
      <input type="checkbox" id="pBen" style="width:18px;height:18px" ${(!DB.ben&&!o)||DB.ben===id?'checked':''}> Bu kişi benim (bu cihazın sahibi)</label>`}
    <button class="btn-p btn-full" style="margin-top:16px" onclick="profilKaydet('${id||''}',${!!ilk})">${o?'Kaydet':'Üye Ol'}</button>`);
}
function fotoSec(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const B=200, cv=document.createElement('canvas'); cv.width=B; cv.height=B;
      const g=cv.getContext('2d');
      const k=Math.min(im.width,im.height);
      g.drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,B,B);
      _foto=cv.toDataURL('image/jpeg',.75);
      const b=$('#fotoBtn'); if(b){b.style.backgroundImage=`url('${_foto}')`;b.style.borderStyle='solid';b.innerHTML='';}
    };
    im.src=r.result;
  };
  r.readAsDataURL(f); inp.value='';
}
function fotoSil(){ _foto=null; const b=$('#fotoBtn'); if(b){b.style.backgroundImage='';b.style.borderStyle='dashed';b.innerHTML='Fotoğraf<br>ekle';} }
function profilKaydet(id,ilk){
  const n=$('#pAd').value.trim();
  if(!n) return toast('Ad gerekli');
  const cakisma=DB.oyuncular.some(o=>o.id!==id&&o.ad.toLocaleLowerCase('tr-TR')===n.toLocaleLowerCase('tr-TR'));
  if(cakisma) return toast('Bu isim zaten var');
  const dg=$('#pDogum')?.value||'';
  if(id){ const o=oy(id); o.ad=n; o.foto=_foto||null; o.dogum=dg||null; }
  else{
    const yeni={id:yid(),ad:n,foto:_foto||null,dogum:dg||null,renk:RENKLER[DB.oyuncular.length%RENKLER.length]};
    DB.oyuncular.push(yeni); id=yeni.id;
    if(ilk||!DB.ben) DB.ben=id;
    if(DB.aktifGrup){ const g=aktifGrup(); if(g&&!g.uyeler.includes(id)) g.uyeler.push(id); }
  }
  const ben=$('#pBen');
  if(ben){ if(ben.checked) DB.ben=id; else if(DB.ben===id) DB.ben=null; }
  _foto=null; kaydet(); kapatModal(); render();
  toast(ilk?`Hoş geldin ${n}. Şimdi masayı kur.`:'Kaydedildi');
}
function oyuncuSil(id){
  const k=DB.celseler.filter(c=>c.oyun==='batak'
    ? c.takimlar.some(t=>t.oyuncular.includes(id)) : (c.oyuncular||[]).includes(id)).length;
  if(k&&!confirm(`${ad(id)} ${k} celsede geçiyor. Silinirse o kayıtlarda "?" görünür. Devam?`)) return;
  if(!k&&!confirm(`${ad(id)} silinsin mi?`)) return;
  DB.oyuncular=DB.oyuncular.filter(o=>o.id!==id);
  DB.gruplar.forEach(g=>g.uyeler=g.uyeler.filter(x=>x!==id));
  if(DB.ben===id) DB.ben=null;
  kaydet(); render();
}

/* ---------- GRUPLAR ---------- */
function grupAc(id){
  const g=id?grup(id):null;
  acModal(`
    <h2 class="serif" style="margin:0 0 4px">${g?'Masayı Düzenle':'Yeni Masa'}</h2>
    <div class="xs dim" style="margin-bottom:14px">Perşembe akşamı kimlerle oynuyorsan o. Tabela bu masaya özel tutulur.</div>
    <div class="field"><label class="fl">Masa adı</label>
      <input id="gAd" value="${esc(g?.ad||'')}" placeholder="Perşembe Masası, Ofis Batakçıları..." maxlength="28"></div>
    <div class="field"><label class="fl">Simge</label>
      <div class="row wrap" id="gEmoji">${GRUP_EMOJI.map(e=>
        `<div class="chip ${((g?.emoji)||GRUP_EMOJI[0])===e?'on':''}" data-e="${e}" style="font-size:19px;padding:7px 11px" onclick="tekSec(this)">${e}</div>`).join('')}</div></div>
    <div class="field"><label class="fl">Üyeler</label>
      <div class="row wrap" id="gUye">${DB.oyuncular.map(o=>
        `<div class="chip ${(g?g.uyeler.includes(o.id):true)?'on':''}" data-id="${o.id}" onclick="this.classList.toggle('on')">${avatar(o.id,20)}${esc(o.ad)}</div>`).join('')}</div>
      ${DB.oyuncular.length?'':'<div class="sm dim">Önce üye ekle.</div>'}</div>
    <button class="btn-p btn-full" style="margin-top:16px" onclick="grupKaydet('${id||''}')">${g?'Kaydet':'Masayı Kur'}</button>`);
}
function grupKaydet(id){
  const ad2=$('#gAd').value.trim();
  if(!ad2) return toast('Masa adı gerekli');
  const emoji=document.querySelector('#gEmoji .chip.on')?.dataset.e||GRUP_EMOJI[0];
  const uyeler=[...document.querySelectorAll('#gUye .chip.on')].map(e=>e.dataset.id);
  if(uyeler.length<3) return toast('Masada en az 3 kişi olmalı');
  if(id){ const g=grup(id); g.ad=ad2; g.emoji=emoji; g.uyeler=uyeler; }
  else{
    const yeni={id:yid(),ad:ad2,emoji,uyeler,kuran:DB.ben,kod:Math.random().toString(36).slice(2,8).toUpperCase()};
    DB.gruplar.push(yeni); DB.aktifGrup=yeni.id;
  }
  kaydet(); kapatModal(); render(); toast(id?'Masa güncellendi':'Masa kuruldu');
}
function grupSil(id){
  const n=DB.celseler.filter(c=>c.grupId===id).length;
  if(!confirm(`Masa silinsin mi?${n?` ${n} maç masasız kalacak (silinmez).`:''}`)) return;
  DB.celseler.forEach(c=>{ if(c.grupId===id) c.grupId=null; });
  DB.gruplar=DB.gruplar.filter(g=>g.id!==id);
  if(DB.aktifGrup===id) DB.aktifGrup=null;
  kaydet(); render();
}
function grupSecici(){
  acModal(`<h2 class="serif" style="margin:0 0 12px">Masa Değiştir</h2>
    <div class="stack">
      <div class="chip ${!DB.aktifGrup?'on':''}" style="width:100%;justify-content:flex-start" onclick="grupGec(null)">
        📚 Bütün masalar <span class="xs dim">· birleşik sicil</span></div>
      ${DB.gruplar.map(g=>`<div class="chip ${DB.aktifGrup===g.id?'on':''}" style="width:100%;justify-content:flex-start" onclick="grupGec('${g.id}')">
        <span style="font-size:18px">${g.emoji}</span> ${esc(g.ad)}
        <span class="xs dim">· ${g.uyeler.length} üye</span></div>`).join('')}
    </div>
    <button class="btn-b btn-full" style="margin-top:14px" onclick="kapatModal();grupAc(null)">+ Yeni Masa Kur</button>`);
}
function grupGec(id){ DB.aktifGrup=id; SABIKA_ID=null; kaydet(); kapatModal(); render(); }

/* ---------- yedek ---------- */
function yedekAl(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));
  a.download=`kara-kapli-defter-${bugun()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); toast('Yedek indirildi');
}
function yedekYukle(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.oyuncular||!d.celseler) throw 0;
      if(!confirm(`Yedekte ${d.oyuncular.length} üye, ${d.celseler.length} celse var. Mevcut defterin üzerine yazılsın mı?`)) return;
      DB=d; DB.gruplar=DB.gruplar||[]; DB.ayar=DB.ayar||{};
      DB.ayar.batak=Object.assign({},VARSAYILAN.ayar.batak,DB.ayar.batak||{});
      DB.ayar.yz   =Object.assign({},VARSAYILAN.ayar.yz,   DB.ayar.yz||{});
      DB.celseler.forEach(norm); if(DB.aktif) norm(DB.aktif);
      kaydet(); render(); toast('Yedek yüklendi');
    }catch(e){ toast('Dosya okunamadı'); }
  };
  r.readAsText(f); inp.value='';
}
function hepsiniSil(){
  if(!confirm('BÜTÜN defter silinecek. Emin misin?')) return;
  if(!confirm('Gerçekten? Bu geri alınamaz. Önce yedek almak istemez misin?')) return;
  localStorage.removeItem(KEY); DB=JSON.parse(JSON.stringify(VARSAYILAN)); render(); toast('Defter silindi');
}

/* ---------- modal ---------- */
function acModal(html){
  $('#modalHost').innerHTML=`<div class="modal" onclick="if(event.target===this)kapatModal()">
    <div class="sheet"><div class="grip"></div>${html}</div></div>`;
}
function kapatModal(){ $('#modalHost').innerHTML=''; }

/* ---------- başlat ---------- */
document.querySelectorAll('nav.tabbar button').forEach(b=>b.onclick=()=>{ if(b.dataset.t!=='sicil') SABIKA_ID=null; git(b.dataset.t); });
render();
</script>
