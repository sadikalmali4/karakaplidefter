<style>
:root{
  --bg:#12100F; --panel:#1C1917; --panel2:#262220; --panel3:#2F2A27;
  --line:#39322D; --ink:#EDE6DC; --ink2:#A2968A; --ink3:#6E635A;
  --accent:#2E6B4F; --accent2:#3E8A66; --gold:#C9A227; --green:#4E8B5B; --red:#A8695E; --blue:#4A7A9B;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

header{position:sticky;top:0;z-index:40;background:linear-gradient(#12100F,#12100Fee);

header .brand{display:flex;align-items:center;gap:10px}
header .seal{width:31px;height:31px;border-radius:50%;flex:0 0 31px;border:2px solid var(--gold);

header h1{margin:0;font-size:17px;line-height:1.15}

main{padding:16px;max-width:760px;margin:0 auto}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(7,1fr);
  background:#191614f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar button{background:none;border:0;color:var(--ink3);padding:9px 0 10px;
  font:500 9.5px/1.25 inherit;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabbar button .ic{font-size:16px;line-height:1}
nav.tabbar button.on{color:var(--gold)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:10px 12px}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:0 0 8px;font-size:12.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.1em;font-family:inherit;font-weight:700}

button,.btn{font:600 14px inherit;border-radius:11px;border:1px solid var(--line);

label.fl{display:block;font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:13.5px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;

.pill.gold{background:#3A300E;color:var(--gold)}

.bar{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.dots{display:inline-flex;gap:4px;align-items:center}

.rozet.yeni{border-color:var(--gold);background:#2B2410;animation:parla .9s ease}
@keyframes parla{0%{transform:scale(.94);opacity:.4}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}

.fotoSec{width:76px;height:76px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;
  cursor:pointer;background-size:cover;background-position:center;color:var(--ink3);font-size:11px;text-align:center;flex-shrink:0}
.grupBar{display:flex;gap:7px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:99px;padding:4px 5px 4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;max-width:180px}

/* --- bulut sürümü --- */
.yukleniyor{display:inline-block;width:15px;height:15px;border:2px solid #fff5;border-top-color:#fff;
  border-radius:50%;animation:don .7s linear infinite;vertical-align:-2px}
@keyframes don{to{transform:rotate(360deg)}}
.kod{font:700 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.28em;color:var(--gold)}
.orta{min-height:66vh;display:flex;flex-direction:column;justify-content:center}
.uyari{background:#2B2410;border:1px solid var(--gold);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#E8D9A8}
.toast.hata{background:var(--red);color:#fff}
.canli{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);
  animation:nabiz 1.4s ease-in-out infinite;margin-right:6px;vertical-align:2px}
@keyframes nabiz{0%,100%{opacity:1}50%{opacity:.2}}
.yaziyor{font-size:10px;color:var(--gold);margin-left:5px}
select:disabled,input:disabled,button:disabled{opacity:.55}
/* textarea tarayıcı varsayılanı olan daktilo yazı tipine düşüyordu */
textarea{font-family:inherit;font-size:15px;line-height:1.5}

<script>
/* =========================================================
   KARA KAPLI DEFTER  v3
   Batak : eşli · ihaleli · parti 61 · maç = kaç parti alan
   101   : parti 11 el · ceza puanı · çok puanlı kaybeder
   Üyeler (profil+foto) · Gruplar · Hızlı/Detaylı giriş · Müeyyideler
   ========================================================= */

/* =========================================================
   KARA KAPLI DEFTER  v4 — BULUT
   Batak : eşli · ihaleli · parti 61 · maç = kaç parti alan
   101   : parti 11 el · ceza puanı · çok puanlı kaybeder

   Veri artık cihazda değil, masada. Herkes kendi hesabıyla girer;
   masaya kodla katılır, kurucu onaylar. Tabelayı tabelacı yazar,
   diğerleri canlı izler.
   ========================================================= */

const SB_URL = 'https://dgtgotopmbpuwmuqlkbd.supabase.co';
const SB_KEY = 'sb_publishable_OLcMTIJvS1hA41B-kUdkjw_aRoAAjle';

/* Kullanıcı adı → sahte e-posta. Kimseden e-posta istemiyoruz;
   Supabase e-posta beklediği için içeride bu alana çeviriyoruz. */
const POSTA_ALANI='karakaplidefter.local';
const kadToPosta=k=>`${String(k).toLowerCase()}@${POSTA_ALANI}`;
const postaToKad=e=>String(e||'').split('@')[0];

const RENKLER=['#C9A227','#4A8FA8','#A85C4A','#6E9B5C','#9B6EA8','#C4784A','#5C8A9B','#A89B4A','#8A7BC4','#C45C7B'];
const GRUP_EMOJI=['🍀','🂡','🀄','☕','🔥','🐺','🦅','🎩','⚔️','🧿'];

const VARSAYILAN_AYAR={
  bahis:'Cin', efsaneler:[],
  batak:{hedef:61,minIhale:7,toplamEl:13,tutunca:'alinan',batinca:'alinan',partiHedef:2,slem:'ihale'},
  yz:{elSayisi:11,partiHedef:1,bitiren:-101,acamayan:200,cifteCarpan:2,okeyAktif:false,okeyCarpan:2,silme:-202,
      muey3:'Çay ısmarlar',muey4:'Hesabı öder'}
};

let sb=null, OTURUM=null, PROFIL=null;
let UYELIKLER=[];      // hesabımın bütün masa üyelikleri (bekleyen dahil)
let BEKLEYENLER=[];    // aktif masada onay bekleyen hesaplar (kurucuysam)
let MASA_UYELERI=[];   // aktif masanın onaylı hesapları
let KANAL=null;        // canlı yayın aboneliği
let DURUM='yukleniyor';// yukleniyor | giris | masayok | hazir | hata
let HATA='';

let DB={ ben:null, oyuncular:[], gruplar:[], aktifGrup:null,
         ayar:JSON.parse(JSON.stringify(VARSAYILAN_AYAR)),
         celseler:[], iddialar:[], akis:[],
         acik:[],        // bu grupta AÇIK olan bütün masalar
         aktif:null };   // bunlardan hâlen ekranda olan

let DIVAN='unvan';        // Divan sekmesinin açık alt bölümü
let SECILI_MAC=null;     // hangi masanın tabelası açık
/* Oyuncu seçim sırası: eşleri ve 101 sıralamasını bu belirliyor.
   Date.now() ile damgalamak yetmiyor — aynı milisaniyedeki iki seçim
   eşitlenip sıra bozuluyordu. Artan sayaç kullanılıyor. */
let SEC_NO=0;
let TAB='celse', SABIKA_ID=null, ARSIV_FILTRE='hepsi', SICIL_OYUN='batak', ROZET_OYUN='batak';

const yid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function norm(c){
  if(!c) return c;
  if(!c.partiler) c.partiler=[{eller:c.eller||[],kazanan:null}];
  if(!c.partiHedef) c.partiHedef=1;
  if(!c.giris) c.giris='detay';
  delete c.eller; return c;
}

/* =========================================================
   BULUT KATMANI
   ========================================================= */
function hataMetni(e){
  const m=String(e?.message||e?.error_description||e||'');
  if(/Bu masanın onaylı üyesi değilsin/i.test(m)) return 'Bu grubun onaylı üyesi değilsin';
  if(/Bu masada zaten bir oyuncuya bağlısın/i.test(m)) return 'Bu grupta zaten bir oyuncuya bağlısın';
  if(/Böyle bir masa kodu yok/i.test(m))     return 'Böyle bir grup kodu yok';
  if(/Bunu yalnız masayı kuran yapabilir/i.test(m)) return 'Bunu yalnız grubu kuran yapabilir';
  if(/Masayı kuran taşıyabilir/i.test(m))    return 'Bu oyuncu başka bir hesaba bağlı. Grubu kuran taşıyabilir.';
  if(/Invalid login credentials/i.test(m))   return 'Kullanıcı adı veya şifre yanlış';
  if(/User already registered/i.test(m))     return 'Bu kullanıcı adı alınmış';
  if(/Password should be at least/i.test(m)) return 'Şifre en az 6 karakter olmalı';
  if(/Email logins are disabled/i.test(m))   return 'Supabase panelinde e-posta girişi kapalı (Authentication -> Providers -> Email)';
  if(/Email not confirmed/i.test(m))         return 'Supabase panelinde "Confirm email" hâlâ açık — kapatılmalı';
  if(/duplicate key|unique/i.test(m))        return 'Bu kayıt zaten var';
  if(/row-level security|violates|permission denied/i.test(m)) return 'Yetkin yok — bunu grubu kuran yapabilir';
  if(/Failed to fetch|NetworkError|fetch failed/i.test(m))     return 'İnternete ulaşılamadı';
  if(/JWT|token is expired/i.test(m))        return 'Oturum süresi doldu, yeniden gir';
  return m || 'Bilinmeyen hata';
}
const kurucuMu=()=>UYELIKLER.some(u=>u.masa_id===DB.aktifGrup&&u.rol==='kurucu'&&u.durum==='onayli');
const tabelaciMiyim=()=>!!(DB.aktif&&OTURUM&&DB.aktif._hesap===OTURUM.id);

async function baslat(){
  if(!window.supabase||!window.supabase.createClient){
    DURUM='hata'; HATA='Supabase kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.'; return render();
  }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((olay)=>{
    if(olay==='SIGNED_OUT'){ OTURUM=null; PROFIL=null; DURUM='giris'; render(); }
  });
  davetOku();                       // ?kod=…&oyuncu=… ile gelindiyse yakala
  try{
    const {data:{session}}=await sb.auth.getSession();
    OTURUM=session?.user||null;
    if(OTURUM){
      await verileriGetir();
      if(DAVET) await davetiIsle();
      kanalKur();
    }
    DURUM = !OTURUM ? 'giris' : (DB.gruplar.length ? 'hazir' : 'masayok');
  }catch(e){ DURUM='hata'; HATA=hataMetni(e); }
  render();
}

async function verileriGetir(){
  const {data:pr,error:e1}=await sb.from('profiller').select('*').eq('id',OTURUM.id).maybeSingle();
  if(e1) throw e1;
  PROFIL=pr||{id:OTURUM.id,ad:postaToKad(OTURUM.email),renk:RENKLER[0]};

  const {data:uy,error:e2}=await sb.from('masa_uyeleri')
    .select('rol,durum,masa_id,masalar(id,ad,emoji,kod,kuran_id,ayar)')
    .eq('profil_id',OTURUM.id);
  if(e2) throw e2;
  UYELIKLER=(uy||[]).filter(u=>u.masalar);

  const onayli=UYELIKLER.filter(u=>u.durum==='onayli');
  DB.gruplar=onayli.map(u=>({id:u.masalar.id,ad:u.masalar.ad,emoji:u.masalar.emoji||'🍀',
                             kod:u.masalar.kod,kuran:u.masalar.kuran_id,rol:u.rol,
                             ayar:u.masalar.ayar||{},uyeler:[]}));
  if(!DB.gruplar.length){
    DB.oyuncular=[];DB.celseler=[];DB.iddialar=[];DB.akis=[];
    DB.acik=[];DB.aktif=null;DB.aktifGrup=null;DB.ben=null;SECILI_MAC=null;
    BEKLEYENLER=[];MASA_UYELERI=[];
    return;
  }
  const kayitli=localStorage.getItem('kkd_aktif_masa');
  if(!DB.gruplar.some(g=>g.id===DB.aktifGrup))
    DB.aktifGrup = DB.gruplar.some(g=>g.id===kayitli) ? kayitli : DB.gruplar[0].id;
  localStorage.setItem('kkd_aktif_masa',DB.aktifGrup);

  const masaIds=DB.gruplar.map(g=>g.id);
  const [oyn,mac,idd,akm]=await Promise.all([
    sb.from('oyuncular').select('*').in('masa_id',masaIds),
    sb.from('maclar').select('id,masa_id,bitti,tarih,tabelaci_id,olusturma,celse').in('masa_id',masaIds)
      .order('tarih',{ascending:false}).order('olusturma',{ascending:false}),
    sb.from('iddialar').select('*').in('masa_id',masaIds),
    sb.from('akis').select('id,masa_id,tip,yazan_id,metin,veri,olusturma,yanit_id,akis_tepkileri(profil_id,emoji)')
      .eq('masa_id',DB.aktifGrup).order('olusturma',{ascending:false}).limit(300)
  ]);
  if(oyn.error) throw oyn.error;
  if(mac.error) throw mac.error;
  if(idd.error) throw idd.error;
  /* Akış olmasa da uygulama ayakta kalsın: yama 04 henüz çalıştırılmadıysa
     yanit_id sütunu yoktur, burada patlayıp bütün ekranı düşürmesin. */
  if(akm.error) console.warn('akış okunamadı:', akm.error.message);

  /* Pasif oyuncular da yüklenir — yoksa eski maçlarda adları "?" görünür.
     Yeni maça yalnız aktif olanlar seçilebilir (g.uyeler). */
  DB.oyuncular=(oyn.data||[]).map(o=>({id:o.id,ad:o.ad,foto:o.foto_url||null,dogum:o.dogum||null,
                                       renk:o.renk||'#C9A227',profilId:o.profil_id,masaId:o.masa_id,
                                       aktif:o.aktif!==false}));
  DB.gruplar.forEach(g=>g.uyeler=DB.oyuncular.filter(o=>o.masaId===g.id&&o.aktif).map(o=>o.id));

  DB.celseler=[]; DB.acik=[];
  (mac.data||[]).forEach(m=>{
    /* _sira: aynı gün oynanan maçların gerçek sırası. Sıralamada id (UUID)
       kullanılırsa "üst üste 3 galibiyet" gibi seriler yanlış çıkar. */
    const c=Object.assign({},m.celse||{},
      {id:m.id,grupId:m.masa_id,bitti:!!m.bitti,tarih:m.tarih,_hesap:m.tabelaci_id,
       _sira:m.olusturma||''});
    norm(c);
    if(m.bitti) DB.celseler.push(c);
    else if(m.masa_id===DB.aktifGrup) DB.acik.push(c);
  });
  /* açık masalar açılış sırasına göre: "1. Masa" hep üstte kalsın */
  DB.acik.sort((a,b)=>String(a._sira).localeCompare(String(b._sira)));
  DB.aktif = DB.acik.find(c=>c.id===SECILI_MAC) || null;
  if(!DB.aktif) SECILI_MAC=null;

  DB.iddialar=(idd.data||[]).map(i=>({id:i.id,grupId:i.masa_id,tarih:i.tarih,vade:i.vade||'',
    kim:i.kim_id,kime:i.kime_id,metin:i.metin,bahis:i.bahis||'',durum:i.durum,
    sonucNot:i.sonuc_not||'',kapanis:i.kapanis||''}));

  DB.akis=(akm.error?[]:(akm.data||[])).map(a=>({id:a.id,grupId:a.masa_id,tip:a.tip,yazanId:a.yazan_id,
    metin:a.metin,veri:a.veri||{},olusturma:a.olusturma,yanitId:a.yanit_id,
    tepkiler:(a.akis_tepkileri||[]).map(t=>({profilId:t.profil_id,emoji:t.emoji}))}));

  const g=grup(DB.aktifGrup)||{};
  DB.ayar={ batak:Object.assign({},VARSAYILAN_AYAR.batak,(g.ayar||{}).batak||{}),
            yz:   Object.assign({},VARSAYILAN_AYAR.yz,   (g.ayar||{}).yz   ||{}),
            bahis:(g.ayar||{}).bahis||VARSAYILAN_AYAR.bahis,
            efsaneler:(g.ayar||{}).efsaneler||[] };
  DB.ben = DB.oyuncular.find(o=>o.masaId===DB.aktifGrup&&o.profilId===OTURUM.id)?.id || null;

  BEKLEYENLER=[]; MASA_UYELERI=[];
  const akt=UYELIKLER.find(u=>u.masa_id===DB.aktifGrup);
  if(akt){
    const {data:uyeler}=await sb.from('masa_uyeleri')
      .select('rol,durum,profil_id,profiller(id,ad,foto_url,renk)').eq('masa_id',DB.aktifGrup);
    MASA_UYELERI=(uyeler||[]).filter(u=>u.durum==='onayli');
    if(akt.rol==='kurucu') BEKLEYENLER=(uyeler||[]).filter(u=>u.durum==='bekliyor');
  }
}

/* --------- açık tabelayı buluta yazma ---------
   Prototipte kaydet() localStorage'a yazıyordu; burada AÇIK MAÇI buluta
   yazar. Ayar / oyuncu / iddia gibi kayıtların kendi fonksiyonları var. */
let _yazZaman=null, _yazSira=Promise.resolve(), _bekleyenYazi=false;
function kaydet(){
  if(!DB.aktif) return;
  if(!tabelaciMiyim()) return;          // yazma hakkı yoksa buluta gitmeye çalışma
  _bekleyenYazi=true; yazIsigi();
  clearTimeout(_yazZaman);
  _yazZaman=setTimeout(aktifYaz,450);
}
function aktifBelge(c){
  const g=JSON.parse(JSON.stringify(c));
  ['id','grupId','bitti','_hesap'].forEach(k=>delete g[k]);
  return g;
}
function aktifYaz(){
  const c=DB.aktif;
  if(!c||!tabelaciMiyim()){ _bekleyenYazi=false; yazIsigi(); return _yazSira; }
  _yazSira=_yazSira.then(async()=>{
    const {error}=await sb.from('maclar').update({
      celse:aktifBelge(c), tarih:c.tarih||bugun(),
      parti_hedef:Math.min(5,Math.max(1,c.partiHedef||1)), giris:c.giris, yer:c.yer||null
    }).eq('id',c.id);
    if(error) toast(hataMetni(error),true);
  }).catch(e=>toast(hataMetni(e),true))
    .then(()=>{ _bekleyenYazi=false; yazIsigi(); });
  return _yazSira;
}
function yazIsigi(){
  const n=document.getElementById('yazDurum');
  if(n) n.textContent=_bekleyenYazi?'yazılıyor…':'';
}

async function yenile(sessiz){
  try{
    await verileriGetir();
    DURUM = DB.gruplar.length ? 'hazir' : 'masayok';
    render();
    if(!sessiz) toast('Güncellendi');
  }catch(e){ if(!sessiz) toast(hataMetni(e),true); }
}

/* --------- canlı yayın ---------
   Tabelacıysam kendi yazdığımı geri çekmem; yazarken ekranım sıfırlanmasın. */
let _yenileZaman=null;
function kanalKur(){
  if(!DB.aktifGrup) return;
  if(KANAL){ sb.removeChannel(KANAL); KANAL=null; }
  const f='masa_id=eq.'+DB.aktifGrup;
  const olay=()=>{
    if(_bekleyenYazi||tabelaciMiyim()) return;
    if(document.getElementById('modalHost')?.innerHTML) return;
    clearTimeout(_yenileZaman);
    _yenileZaman=setTimeout(()=>yenile(true),700);
  };
  KANAL=sb.channel('masa_'+DB.aktifGrup)
    .on('postgres_changes',{event:'*',schema:'public',table:'maclar',filter:f},olay)
    .on('postgres_changes',{event:'*',schema:'public',table:'iddialar',filter:f},olay)
    .on('postgres_changes',{event:'*',schema:'public',table:'oyuncular',filter:f},olay)
    .subscribe();
}

/* doğum günü */
function yas(dogum,refIso){
  if(!dogum) return null;
  const d=new Date(dogum+'T00:00:00'); if(isNaN(d)) return null;
  const r=refIso?new Date(refIso+'T00:00:00'):new Date();
  let y=r.getFullYear()-d.getFullYear();
  const m=r.getMonth()-d.getMonth();
  if(m<0||(m===0&&r.getDate()<d.getDate())) y--;
  return (y>=0&&y<130)?y:null;
}
/* bugüne göre kaç gün kaldı; 0 = bugün */
function dgKalan(dogum,refIso){
  if(!dogum) return null;
  const p=dogum.split('-'); if(p.length<3) return null;
  const ay=Number(p[1])-1, gun=Number(p[2]);
  const r=refIso?new Date(refIso+'T00:00:00'):new Date();
  const bugun0=new Date(r.getFullYear(),r.getMonth(),r.getDate());
  let hedef=new Date(r.getFullYear(),ay,gun);
  if(hedef<bugun0) hedef=new Date(r.getFullYear()+1,ay,gun);
  return Math.round((hedef-bugun0)/86400000);
}
const dgBugun=(id,refIso)=>dgKalan(oy(id).dogum,refIso)===0;
function dgMetni(g){
  if(g===0) return 'bugün';
  if(g===1) return 'yarın';
  return `${g} gün sonra`;
}

/* =========================================================
   BATAK MOTORU
   ========================================================= */
/* Bir eli puana çevirir.
   el.alinan = İHALEYİ ALAN takımın çıkardığı el sayısı.

   EV KURALI (02.09.2026, kullanıcı): İhaleyi alan takım 13'ün tamamını
   alırsa (ŞLEM), karşı takım ihaleye girilen sayı kadar BATAR — yani
   -ihale yazar. Önceki hâlde 0 yazıyordu, yanlıştı.

   Şlemi ihaleyi ALMAYAN takım yaparsa (alinan=0) zaten ihale batmış
   olur: alan takım -ihale yazar, karşı takım 13 yazar. O yön doğruydu. */
function batakElPuan(el,a){
  /* HAM SATIR: tabelaya kâğıttaki gibi iki sayı doğrudan yazılmış.
     İhale/koz dökümü yoktur; ne yazıldıysa o geçerlidir (eksi dahil). */
  if(el && Array.isArray(el.ham)) return [Number(el.ham[0])||0, Number(el.ham[1])||0];
  const t=[0,0], alan=el.ihaleTakim, karsi=1-alan;
  const tuttu=el.alinan>=el.ihale, slem=el.alinan===a.toplamEl;

  t[alan]= tuttu ? (a.tutunca==='ihale'?el.ihale:el.alinan) : -el.ihale;

  if(slem)                             t[karsi]=(a.slem==='yok')?0:-el.ihale;
  else if(!tuttu&&a.batinca==='onuc')  t[karsi]=a.toplamEl;
  else if(!tuttu&&a.batinca==='ihale') t[karsi]=el.ihale;
  else                                 t[karsi]=a.toplamEl-el.alinan;
  return t;
}
function batakPartiToplam(p){
  const a=DB.ayar.batak, top=[0,0], seyir=[];
  for(const el of p.eller){const x=batakElPuan(el,a);top[0]+=x[0];top[1]+=x[1];seyir.push([top[0],top[1]]);}
  return {top,seyir};
}
function batakPartiKazanan(p){
  const a=DB.ayar.batak,{top}=batakPartiToplam(p);
  if(top[0]>=a.hedef&&top[1]>=a.hedef){const s=p.eller[p.eller.length-1];return s?s.ihaleTakim:(top[0]>=top[1]?0:1);}
  if(top[0]>=a.hedef)return 0; if(top[1]>=a.hedef)return 1; return null;
}
function batakMac(c){
  norm(c);
  /* Eski özet kayıtlar (devir/arşiv) parti sayısını hizli.partiSkor'da tutar.
     Tabelaya gerçek satır yazılmışsa artık onu kullanırız. */
  if(c.giris==='hizli' && !c.partiler.some(p=>p.eller.length)){
    const ps=c.hizli?.partiSkor||[0,0];
    const mk = ps[0]>=c.partiHedef?0:(ps[1]>=c.partiHedef?1:(ps[0]===ps[1]?null:(ps[0]>ps[1]?0:1)));
    return {partiSkor:ps,gTop:c.hizli?.puan||[0,0],toplamEl:0,macKazanan:mk,aktifIdx:0,aktif:c.partiler[0]};
  }
  const partiSkor=[0,0],gTop=[0,0]; let toplamEl=0;
  c.partiler.forEach(p=>{
    const {top}=batakPartiToplam(p); gTop[0]+=top[0]; gTop[1]+=top[1]; toplamEl+=p.eller.length;
    const k=(p.kazanan!=null)?p.kazanan:batakPartiKazanan(p); if(k!=null) partiSkor[k]++;
  });
  let macKazanan=null;
  if(partiSkor[0]>=c.partiHedef)macKazanan=0; else if(partiSkor[1]>=c.partiHedef)macKazanan=1;
  return {partiSkor,gTop,toplamEl,macKazanan,aktifIdx:c.partiler.length-1,aktif:c.partiler[c.partiler.length-1]};
}
const batakTumEller=c=>{norm(c);return c.partiler.flatMap(p=>p.eller);};

/* =========================================================
   101 MOTORU
   ========================================================= */
/* Bir oyuncunun bir eldeki puanı.
   Normal puanın DIŞINDA iki alan var (02.09.2026, kullanıcı):
     · SİLME  → ödül; toplamdan sabit bir miktar düşer (ayar: yz.silme, eksi değer)
     · CEZA   → elle yazılan ek ceza; normal puanın üstüne biner
   İkisi de her el, her oyuncu için ayrı ayrı tutulur. */
function yzDurumPuan(d){
  const a=DB.ayar.yz; if(!d) return 0;
  let p=0;
  switch(d.tip){
    case 'bitirdi': p=(a.okeyAktif&&d.okey)?a.bitiren*a.okeyCarpan:a.bitiren; break;
    case 'es':      p=0; break;
    case 'acamadi': p=a.acamayan; break;
    case 'kaldi':   p=Number(d.sayi)||0; break;
    case 'cifte':   p=(Number(d.sayi)||0)*a.cifteCarpan; break;
    default:        p=0;
  }
  if(d.silme) p += (Number(a.silme)||0);      // ödül (eksi)
  if(d.ceza)  p += (Number(d.ceza)||0);       // ek ceza (artı)
  return p;
}
/* puanın kırılımı: tabelada ayrı sütun göstermek için */
function yzKirilim(d){
  const a=DB.ayar.yz;
  if(!d) return {normal:0,odul:0,ceza:0,toplam:0};
  let n=0;
  switch(d.tip){
    case 'bitirdi': n=(a.okeyAktif&&d.okey)?a.bitiren*a.okeyCarpan:a.bitiren; break;
    case 'acamadi': n=a.acamayan; break;
    case 'kaldi':   n=Number(d.sayi)||0; break;
    case 'cifte':   n=(Number(d.sayi)||0)*a.cifteCarpan; break;
  }
  const odul=d.silme?(Number(a.silme)||0):0;
  const ceza=d.ceza?(Number(d.ceza)||0):0;
  return {normal:n,odul,ceza,toplam:n+odul+ceza};
}
/* HAM SATIR: 101 tabelasina her oyuncu icin sayi dogrudan yazilmis.
   Bitirdi/acamadi gibi durum dokumu yok; ne yazildiysa o gecerli. */
function yzElPuan(el,id){
  if(el && el.ham) return Number(el.ham[id])||0;
  return yzDurumPuan(el && el.durum && el.durum[id]);
}
function yzPartiToplam(p,c){
  const top={}; c.oyuncular.forEach(id=>top[id]=0);
  for(const el of p.eller) for(const id of c.oyuncular) top[id]+=yzElPuan(el,id);
  return top;
}
function yzPartiSira(p,c){
  const t=yzPartiToplam(p,c);
  return c.oyuncular.slice().sort((x,y)=>t[x]-t[y]||ad(x).localeCompare(ad(y),'tr')).map((id,i)=>({id,puan:t[id],sira:i+1}));
}
function yzPartiKazanan(p,c){
  if(!p.eller.length) return null;
  const t=yzPartiToplam(p,c);
  if(c.mod==='esli'&&c.esler){
    const s=c.esler.map(pr=>pr.reduce((x,id)=>x+t[id],0));
    return c.esler[s[0]<=s[1]?0:1].slice();
  }
  return [yzPartiSira(p,c)[0].id];
}
function yzMac(c){
  norm(c);
  if(c.giris==='hizli'){
    const sira=(c.hizli?.sira||c.oyuncular).map((id,i)=>({id,puan:(c.hizli?.puan||{})[id]??0,parti:0,sira:i+1}));
    return {partiKaz:{},top:{},sira,toplamEl:0,bitmisParti:0,macKazanan:sira[0]?.id??null,aktifIdx:0,aktif:c.partiler[0]};
  }
  const partiKaz={}; c.oyuncular.forEach(id=>partiKaz[id]=0);
  let toplamEl=0;
  c.partiler.forEach(p=>{
    toplamEl+=p.eller.length;
    const bitti = p.kazanan!=null || p.eller.length>=(DB.ayar.yz.elSayisi||11);
    if(!bitti) return;
    (p.kazanan||yzPartiKazanan(p,c)||[]).forEach(id=>{ if(partiKaz[id]!=null) partiKaz[id]++; });
  });
  const top={}; c.oyuncular.forEach(id=>top[id]=0);
  c.partiler.forEach(p=>p.eller.forEach(el=>c.oyuncular.forEach(id=>top[id]+=yzElPuan(el,id))));
  const sira=c.oyuncular.slice().sort((x,y)=>partiKaz[y]-partiKaz[x]||top[x]-top[y]||ad(x).localeCompare(ad(y),'tr'))
    .map((id,i)=>({id,puan:top[id],parti:partiKaz[id],sira:i+1}));
  return {partiKaz,top,sira,toplamEl,macKazanan:sira.find(r=>r.parti>=c.partiHedef)?.id??null,
          aktifIdx:c.partiler.length-1,aktif:c.partiler[c.partiler.length-1]};
}

/* ---- ortak ---- */
function partiAd(c,i){
  if(c.partiHedef>1&&i>0&&i===c.partiler.length-1){
    if(c.oyun==='batak'){
      const sk=[0,0];
      c.partiler.slice(0,i).forEach(p=>{const k=(p.kazanan!=null)?p.kazanan:batakPartiKazanan(p); if(k!=null)sk[k]++;});
      if(sk[0]===sk[1]&&sk[0]===c.partiHedef-1) return 'Çıkıştırma';
    }else{
      const s={}; c.oyuncular.forEach(id=>s[id]=0);
      c.partiler.slice(0,i).forEach(p=>(p.kazanan||yzPartiKazanan(p,c)||[]).forEach(id=>{if(s[id]!=null)s[id]++;}));
      const en=Math.max(...Object.values(s));
      if(en===c.partiHedef-1&&Object.values(s).filter(x=>x===en).length>1) return 'Çıkıştırma';
    }
  }
  return `${i+1}. Parti`;
}
const macDurum=c=>c.oyun==='batak'?batakMac(c):yzMac(c);

/* =========================================================
   İSTATİSTİK
   ========================================================= */
function istatistik(oyun){
  const s={};
  const kur=id=>s[id]=s[id]||{id,celse:0,gal:0,son:0,ikinci:0,parti:0,toplamPuan:0,siraTop:0,
    ihale:0,ihaleBat:0,ihaleTam:0,slem:0,cikisGal:0,cikisKay:0,
    elBitirdi:0,acamadi:0,cifte:0,enAgirCeza:0,enAgirBatak:0,
    enIyi:null,enKotu:null,form:[],seri:0,seriTip:''};
  const list=grupCelseleri().filter(c=>c.oyun===oyun).slice()
    .sort((a,b)=>(a.tarih+(a._sira||'')).localeCompare(b.tarih+(b._sira||'')));

  for(const c of list){
    if(oyun==='batak'){
      const m=batakMac(c); const kz=c.kazanan??m.macKazanan??(m.gTop[0]>=m.gTop[1]?0:1);
      const cikisti = c.giris==='detay' && partiAd(c,c.partiler.length-1)==='Çıkıştırma';
      c.takimlar.forEach((tk,ti)=>tk.oyuncular.forEach(id=>{
        const p=kur(id); p.celse++; p.toplamPuan+=m.gTop[ti]; p.parti+=m.partiSkor[ti];
        const w=ti===kz; if(w)p.gal++; else p.son++;
        if(cikisti){ if(w)p.cikisGal++; else p.cikisKay++; }
        p.form.push(w?'G':'M');
        if(p.enIyi===null||m.gTop[ti]>p.enIyi) p.enIyi=m.gTop[ti];
        if(p.enKotu===null||m.gTop[ti]<p.enKotu) p.enKotu=m.gTop[ti];
      }));
      for(const el of batakTumEller(c)){
        const tk=c.takimlar[el.ihaleTakim]; if(!tk) continue;
        const batti=el.alinan<el.ihale, fark=el.ihale-el.alinan;
        tk.oyuncular.forEach(id=>{const p=kur(id); p.ihale++;
          if(batti){p.ihaleBat++; if(fark>p.enAgirBatak)p.enAgirBatak=fark;} else p.ihaleTam++;
          if(el.alinan===DB.ayar.batak.toplamEl) p.slem++;});
      }
    }else{
      const m=yzMac(c), n=m.sira.length;
      m.sira.forEach(r=>{
        const p=kur(r.id); p.celse++; p.toplamPuan+=r.puan; p.siraTop+=r.sira; p.parti+=r.parti;
        if(r.sira===1)p.gal++; if(r.sira===2)p.ikinci++; if(r.sira===n)p.son++;
        p.form.push(r.sira===1?'G':(r.sira===n?'M':'–'));
        if(p.enIyi===null||r.puan<p.enIyi) p.enIyi=r.puan;
        if(p.enKotu===null||r.puan>p.enKotu) p.enKotu=r.puan;
      });
      c.partiler.forEach(pt=>pt.eller.forEach(el=>c.oyuncular.forEach(id=>{
        const p=kur(id);
        const v=yzElPuan(el,id); if(v>p.enAgirCeza)p.enAgirCeza=v;
        const d=el.durum&&el.durum[id]; if(!d) return;   /* ham satırda durum dökümü yok */
        if(d.tip==='bitirdi')p.elBitirdi++;
        if(d.tip==='acamadi')p.acamadi++;
        if(d.tip==='cifte')p.cifte++;
        if(d.silme) p.silmeSay=(p.silmeSay||0)+1;
        if(d.ceza)  p.ekCeza=(p.ekCeza||0)+Number(d.ceza);
      })));
    }
  }
  Object.values(s).forEach(p=>{
    const f=p.form; let i=f.length-1;
    if(i>=0){
      if(f[i]==='G'){let n=0;while(i>=0&&f[i]==='G'){n++;i--;}p.seri=n;p.seriTip='gal';}
      else{let n=0;while(i>=0&&f[i]!=='G'){n++;i--;}p.seri=n;p.seriTip='hasret';}
    }
    p.ortSira=p.celse?p.siraTop/p.celse:0;
    p.oran   =p.celse?p.gal/p.celse:0;
    p.ortPuan=p.celse?p.toplamPuan/p.celse:0;
    p.batOran=p.ihale?p.ihaleBat/p.ihale:0;
  });
  return s;
}

/* Batak'ta ihale de puan da TAKIMA aittir; eşlerin istatistiği birbirinin
   aynısı çıkar. Bu yüzden unvan artık tek kişi değil, BAŞA BAŞ OLANLARIN
   HEPSİ. Eşler birlikte oynadıkça unvanı paylaşırlar; farklı eşlerle
   oynayıp sayılar ayrıştıkça unvan kendiliğinden tek kişiye döner. */
function muayyideler(oyun){
  const v=Object.values(istatistik(oyun)).filter(p=>p.celse>0);
  const out=[]; if(!v.length) return out;

  /* en yüksek / en düşük — başa baş olanların TAMAMINI döndürür */
  const enb=(l,f)=>{ if(!l.length) return null;
    const en=Math.max(...l.map(f)); return en>0 ? l.filter(p=>f(p)===en) : null; };
  const enk=(l,f)=>{ if(!l.length) return null;
    const en=Math.min(...l.map(f)); return l.filter(p=>f(p)===en); };
  const ek=(k,ad2,kim,acik,tip)=>{
    if(kim&&kim.length) out.push({k,ad:ad2,kim:kim.map(p=>p.id||p),aciklama:acik,tip:tip||'iyi'});
  };
  const b=x=>x[0];                       // başa baş olanların değerleri aynı

  const sampiyon=enb(v,p=>p.gal*1000+p.oran);
  ek('🏆','Emsal Karar',sampiyon,sampiyon&&`${b(sampiyon).gal} maç birinciliği. Artık içtihattır.`);

  if(oyun==='batak'){
    const sp=enk(v,p=>p.toplamPuan);
    ek('💸','Masanın Sponsoru',sp,sp&&`Toplam ${b(sp).toplamPuan} puan. Masayı fiilen finanse etmektedir.`,'kotu');

    const mut=enb(v,p=>p.ihale);
    ek('🏗️','İhale Müteahhidi',mut,mut&&`${b(mut).ihale} ihale. İştahı sabittir, sonuçları değişkendir.`);

    const enkaz=enb(v.filter(p=>p.ihale>=3),p=>p.batOran);
    ek('💥','Enkaz Ustası',enkaz,enkaz&&`${b(enkaz).ihale} ihalenin ${b(enkaz).ihaleBat} tanesini batırdı (%${Math.round(b(enkaz).batOran*100)}). Yıkım ustasıdır.`,'kotu');

    const buz=v.filter(p=>p.ihale>=3&&p.ihaleBat===0);
    ek('🧊','Buzdolabı',buz.length?buz:null,buz.length&&`${b(buz).ihale} ihale, sıfır batak. Soğukkanlılığı rahatsız edicidir.`);

    const nisan=enb(v.filter(p=>p.ihale>=3),p=>p.ihaleTam);
    ek('🎯','Keskin Nişancı',nisan,nisan&&`${b(nisan).ihaleTam} ihale tutturdu. Ağzından çıkanı kulağı duyuyor.`);

    const slem=enb(v,p=>p.slem);
    ek('🧨','Şlemci',slem,slem&&`${b(slem).slem} kez masaya tek el bırakmadı. Kibri kayda geçirilmiştir.`);

    const bey=enk(v.filter(p=>p.celse>=2),p=>p.ihale/Math.max(1,p.celse));
    const mutIds=(mut||[]).map(p=>p.id);
    if(bey&&mut&&!bey.some(p=>mutIds.includes(p.id)))
      ek('🎩','Beyefendi',bey,`Maç başına ${(b(bey).ihale/b(bey).celse).toFixed(1)} ihale. Riski eşine bırakma sanatı.`);

    const cik=enb(v,p=>p.cikisGal);
    ek('🩸','Çıkıştırma Celladı',cik,cik&&`Çıkıştırmada ${b(cik).cikisGal} galibiyet. Soğukkanlı katildir.`);

    const kur=enb(v,p=>p.cikisKay);
    ek('⚰️','Çıkıştırma Kurbanı',kur,kur&&`Çıkıştırmada ${b(kur).cikisKay} yenilgi. Son virajda direksiyon kilitlenmektedir.`,'kotu');
  }else{
    const sp=enb(v,p=>p.toplamPuan);
    ek('💸','Masanın Sponsoru',sp,sp&&`Toplam ${b(sp).toplamPuan} ceza puanı. Kendi rekorunu kendisi kırmaktadır.`,'kotu');

    const bit=enb(v,p=>p.elBitirdi);
    ek('✂️','İnfaz Memuru',bit,bit&&`${b(bit).elBitirdi} el bitirdi. Masaya merhameti yoktur.`);

    const kap=enb(v,p=>p.acamadi);
    ek('🔒','Kapalı Dosya',kap,kap&&`${b(kap).acamadi} el açamadı, ${b(kap).acamadi*DB.ayar.yz.acamayan} puan ceza yazıldı.`,'kotu');

    const kum=enb(v,p=>p.cifte);
    ek('🎲','Çifte Kumrusu',kum,kum&&`${b(kum).cifte} kez çifte gitti. Cesaretin bedeli iki katıdır.`);

    const agir=enb(v,p=>p.enAgirCeza);
    ek('🐢','Ağır Ceza',agir,agir&&`Tek elde ${b(agir).enAgirCeza} puan yedi. Rekor kendisindedir.`,'kotu');

    const nazar=enb(v,p=>p.ikinci);
    ek('🧿','Nazar Boncuğu',nazar,nazar&&`${b(nazar).ikinci} kez ikinci oldu. Kürsüye en yakın uzaklıktır.`);

    const hesap=enb(v,p=>p.son);
    ek('🧾','Hesabı Ödeyen',hesap,hesap&&`${b(hesap).son} kez sonuncu. Garson kendisini tanımaktadır.`,'kotu');

    const sil=enb(v,p=>p.silmeSay||0);
    ek('🧹','Silgi',sil,sil&&`${b(sil).silmeSay} kez silme yaptı. Hanesini temizlemekte mahirdir.`);

    const cez=enb(v,p=>p.ekCeza||0);
    ek('⚖️','Sicili Kabarık',cez,cez&&`Elle yazılmış ${b(cez).ekCeza} puan ek ceza. Gerekçeler tabelacıda saklıdır.`,'kotu');
  }

  const dus=enb(v.filter(p=>p.seriTip==='hasret'&&p.seri>=2),p=>p.seri);
  ek('📉','Serbest Düşüş',dus,dus&&`Galibiyet hasreti ${b(dus).seri}. maça çıktı. Dosya ilgili birime sevk edilmiştir.`,'kotu');

  const ser=enb(v.filter(p=>p.seriTip==='gal'&&p.seri>=2),p=>p.seri);
  ek('🔥','Müktesep Hak',ser,ser&&`Üst üste ${b(ser).seri} maç birinci. Tesadüf savunması reddedilmiştir.`);

  const dev=enb(v,p=>p.celse);
  ek('🪑','Kürsü Müdavimi',dev,dev&&`${b(dev).celse} maç. Masanın demirbaşıdır.`);
  return out;
}

    const er=v.slice().sort((a,b)=>(b.kazandi-b.kaybetti)-(a.kazandi-a.kaybetti))[0];

      aciklama:`${er.kazandi} iddia tuttu. Beyanı senet hükmündedir.`});
    const acikci=v.slice().sort((a,b)=>b.acik-a.acik)[0];

      aciklama:`${acikci.acik} açık iddia. Hepsinin vadesi gelecektir.`});

  const dgler=DB.oyuncular.filter(o=>o.dogum&&dgKalan(o.dogum)===0);

  return out;
}

function batakElYorum(c,el){
  const a=DB.ayar.batak;
  const T=i=>c.takimlar[i].oyuncular.map(ad).join(' & ');
  const fark=el.ihale-el.alinan;
  if(el.alinan===a.toplamEl)
    return `ŞLEM. ${T(el.ihaleTakim)} masaya tek el bırakmadı.${a.slem==='yok'?'':` ${T(1-el.ihaleTakim)} ${el.ihale} batmıştır.`} Kibir kayda geçirilmiştir.`;
  if(fark>=4) return rast([
    `${T(el.ihaleTakim)} ${el.ihale} dedi, ${el.alinan} çıkardı. Aradaki ${fark} el hayal gücüne verilmiştir.`,
    `${el.ihale} ihaleden ${el.alinan} el. Mahkeme bu beyanı gerçeğe aykırı bulmuştur.`]);
  if(fark>0) return rast([
    `Batak. ${fark} el eksik. "Az kalmıştı" savunması dinlenmemiştir.`,
    `${T(el.ihaleTakim)} ${fark} el eksikle batmıştır. Kayıt düşülmüştür.`]);
  if(el.alinan-el.ihale>=3) return `${el.ihale} ihaleyle ${el.alinan} el. Mütevazı beyan, cezasız bırakılmıştır.`;
  return rast(['İhale tutmuştur. Sıradaki.',`${T(el.ihaleTakim)} sözünü tutmuştur; nadir görülen bir hâldir.`]);
}
function yzElYorum(c,durum){
  const a=DB.ayar.yz;
  const bit=c.oyuncular.find(id=>durum[id]?.tip==='bitirdi');
  const ac =c.oyuncular.filter(id=>durum[id]?.tip==='acamadi');
  const ci =c.oyuncular.filter(id=>durum[id]?.tip==='cifte');
  const si =c.oyuncular.filter(id=>durum[id]?.silme);
  const cz =c.oyuncular.filter(id=>durum[id]?.ceza);
  if(si.length)    return `${liste(si.map(ad))} SİLDİ: hanesinden ${Math.abs(Number(a.silme)||0)} puan düştü. Masa bu hâli kıskançlıkla izlemiştir.`;
  if(cz.length)    return `${liste(cz.map(ad))} hakkında ek ceza yazılmıştır. Gerekçe tabelacıya aittir.`;
  if(ac.length>=2) return `${liste(ac.map(ad))} açamadı. Masanın yarısı seyirci konumundadır.`;
  if(ci.length)    return `${liste(ci.map(ad))} çifte gitti, bedeli iki katı. Cesaret pahalıdır.`;
  if(ac.length===1)return `${ad(ac[0])} açamadı: +${a.acamayan}. Savunması alınmamıştır.`;
  if(bit) return rast([`${ad(bit)} eli bitirdi. Masa sessizliğe gömülmüştür.`,
                       `${ad(bit)} ${a.bitiren} yazdı. İtiraz yolu kapalıdır.`]);
  return 'El kaydedildi.';
}

        else L.push(`${T(i)} tarafı girdiği ${say[i].a} ihalenin tamamını tutmuştur. Şüphe uyandırıcı bulunmakla birlikte delil elde edilememiştir.`);
      });

      if(b) L.push(`Celsenin en ağır batağı: ${T(b.el.ihaleTakim)} tarafı ${b.el.ihale} ihale alıp ${b.el.alinan} el çıkarmıştır.`);
    }

    if(c.giris==='detay'){

      if(ea&&t[ea].ac>0) L.push(`${ad(ea)}, ${t[ea].ac} el açamamış, ${t[ea].ac*a.acamayan} puan ceza tahakkuk ettirilmiştir. Savunması alınmamıştır.`);
      const ec=c.oyuncular.slice().sort((x,y)=>t[y].cif-t[x].cif)[0];
      if(ec&&t[ec].cif>0) L.push(`${ad(ec)}, ${t[ec].cif} kez çifte gitmiş; cesaretin bedeli iki katı tahsil edilmiştir.`);
    }
  }

  const st=istatistik(c.oyun);
  const ilgili=c.oyun==='batak'?c.takimlar.flatMap(t=>t.oyuncular):c.oyuncular;
  const notlar=[];
  ilgili.forEach(id=>{
    const p=st[id]; if(!p) return;
    if(p.seriTip==='hasret'&&p.seri>=3) notlar.push(`${ad(id)} için galibiyet hasreti ${p.seri}. maça çıkmıştır`);
    if(p.seriTip==='gal'&&p.seri>=3)    notlar.push(`${ad(id)} üst üste ${p.seri}. galibiyetini almıştır`);
  });
  if(notlar.length){ L.push(''); L.push(`AYRICA: ${liste(notlar)}.`); }

  const dgler=ilgili.filter(id=>dgBugun(id,c.tarih));
  if(dgler.length){
    L.push('');
    L.push(`DOĞUM GÜNÜ: ${liste(dgler.map(id=>{const y=yas(oy(id).dogum,c.tarih); return `${ad(id)}${y!=null?` (${y})`:''}`;}))} bugün doğum günü olmasına rağmen masaya oturmuştur. Mahkeme, bu durumun kendisine herhangi bir puan avantajı sağlamadığını hatırlatır; tebrik eder.`);
  }
  const acikIdd=grupIddialari().filter(i=>i.durum==='acik'&&(ilgili.includes(i.kim)||ilgili.includes(i.kime)));
  if(acikIdd.length){
    L.push('');
    L.push('DERDEST İDDİALAR:');
    acikIdd.slice(0,4).forEach(i=>L.push(`  • ${ad(i.kim)}${i.kime?` ↔ ${ad(i.kime)}`:''}: “${i.metin}”${i.bahis?` — ${i.bahis}`:''}${i.vade?` (vade ${trh(i.vade)})`:''}`));
  }

  const bh=bahisNotu(c);
  if(bh){ L.push(''); L.push(bh); }
  const rk=aramizdaNotu(c);
  if(rk){ L.push(''); L.push(`REKABET: ${rk}`); }
  if(c.not){ L.push(''); L.push(`ŞERH: ${c.not}`); }
  L.push('');
  L.push(`Tabelayı ${c.tabelaci?ad(c.tabelaci):'masa'} tutmuştur; kayıtlara itiraz süresi dolmuştur.`);
  L.push('Zabıt okundu, imza altına alındı. Bir sonraki masanın tarihi taraflarca serbestçe belirlenecektir.');
  return L.join('\n');
}

/* =========================================================
   İDDİA DEFTERİ
   ========================================================= */
function grupIddialari(){
  const g=aktifGrup();
  return DB.iddialar.filter(i=>!g||i.grupId===g.id);
}
function iddiaSicil(){
  const s={};
  const kur=id=>s[id]=s[id]||{id,kazandi:0,kaybetti:0,acik:0,toplam:0};
  grupIddialari().forEach(i=>{
    const p=kur(i.kim); p.toplam++;
    if(i.durum==='acik') p.acik++;
    if(i.durum==='kazandi') p.kazandi++;
    if(i.durum==='kaybetti') p.kaybetti++;
    if(i.kime){
      const r=kur(i.kime); r.toplam++;
      if(i.durum==='acik') r.acik++;
      if(i.durum==='kazandi') r.kaybetti++;   // iddia sahibi kazandıysa karşı taraf kaybetti
      if(i.durum==='kaybetti') r.kazandi++;
    }
  });
  return s;
}
function vadeDoldu(i){
  return i.durum==='acik' && i.vade && i.vade < bugun();
}
function viewIddia(){
  const list=grupIddialari().slice().sort((a,b)=>{
    const r=(x)=> x.durum==='acik' ? (vadeDoldu(x)?0:1) : 2;
    return r(a)-r(b) || (a.vade||'9999').localeCompare(b.vade||'9999') || b.tarih.localeCompare(a.tarih);
  });
  const acik=list.filter(i=>i.durum==='acik');
  const kapali=list.filter(i=>i.durum!=='acik');
  const sc=iddiaSicil();
  const sicilSat=Object.values(sc).filter(p=>p.kazandi+p.kaybetti>0)
    .sort((a,b)=>(b.kazandi-b.kaybetti)-(a.kazandi-a.kaybetti));

  const kart=i=>{
    const doldu=vadeDoldu(i);
    const renk=i.durum==='kazandi'?'green':(i.durum==='kaybetti'?'red':(doldu?'gold':''));
    const etiket={acik:doldu?'VADESİ DOLDU':'AÇIK',kazandi:'TUTTU',kaybetti:'TUTMADI',iptal:'İPTAL'}[i.durum];
    return `<div class="card tight" style="background:var(--panel2);${doldu?'border-color:var(--gold)':''}">
      <div class="row wrap" style="gap:6px">
        <span class="pill ${renk}">${etiket}</span>
        ${i.bahis?`<span class="pill">🎁 ${esc(i.bahis)}</span>`:''}
        <span class="xs dim">${trh(i.tarih)}${i.vade?` → vade ${trh(i.vade)}`:' → açık uçlu'}</span>
      </div>
      <div style="margin-top:7px;font-size:14.5px;font-family:Georgia,serif;line-height:1.5">
        “${esc(i.metin)}”</div>
      <div class="row" style="margin-top:7px;gap:7px">
        ${avatar(i.kim,22)}<span class="sm" style="font-weight:600">${esc(ad(i.kim))}</span>
        ${i.kime?`<span class="xs dim">↔</span>${avatar(i.kime,22)}<span class="sm" style="font-weight:600">${esc(ad(i.kime))}</span>`
                :`<span class="xs dim">masaya karşı</span>`}
      </div>
      ${i.sonucNot?`<div class="xs muted" style="margin-top:6px;font-style:italic">${esc(i.sonucNot)}</div>`:''}
      ${i.durum==='acik'?`<div class="row" style="margin-top:9px;gap:6px">
        <button class="btn-xs" style="flex:1;border-color:#2E5A3A;color:#8CC79B" onclick="iddiaKarar('${i.id}','kazandi')">Tuttu</button>
        <button class="btn-xs" style="flex:1;border-color:#5a2b2b;color:#C97C7C" onclick="iddiaKarar('${i.id}','kaybetti')">Tutmadı</button>
        <button class="btn-xs btn-gh" onclick="iddiaSil('${i.id}')">Sil</button>
      </div>`:`<div class="row" style="margin-top:8px;justify-content:flex-end">
        <button class="btn-xs btn-gh" onclick="iddiaAc('${i.id}')">Yeniden aç</button>
        <button class="btn-xs btn-gh" onclick="iddiaSil('${i.id}')">Sil</button></div>`}
    </div>`;
  };

  return `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><div class="serif" style="font-size:17px">İddia Defteri</div>
        <div class="xs dim">Söylenen söz kayda geçer. Vadesi gelince hüküm verilir.</div></div>
    </div>
    <button class="btn-p btn-full" style="margin-top:12px" onclick="iddiaFormu()">+ Yeni İddia Kaydet</button>
  </div>

  ${acik.length?`<div class="card"><h3>Derdest İddialar (${acik.length})</h3>
    <div class="stack">${acik.map(kart).join('')}</div></div>`
   :`<div class="card"><div class="empty"><div class="big">🤝</div>
      Açık iddia yok.<div class="sm" style="margin-top:6px">Masada laf edilir, buraya yazılır. Kimse unutamaz.</div></div></div>`}

  ${sicilSat.length?`<div class="card"><h3>İddia Sicili</h3>
    <table><thead><tr><th>Kişi</th><th>Tuttu</th><th>Tutmadı</th><th>Bakiye</th></tr></thead><tbody>
    ${sicilSat.map(p=>{const d=p.kazandi-p.kaybetti;
      return `<tr><td><div class="row" style="gap:7px">${avatar(p.id,22)}<span style="font-weight:600">${esc(ad(p.id))}</span></div></td>
      <td class="pos">${p.kazandi}</td><td class="neg">${p.kaybetti}</td>
      <td><b class="${snf(d)}">${art(d)}</b></td></tr>`;}).join('')}
    </tbody></table>
    <div class="xs dim" style="margin-top:8px">Bakiyesi eksi olanın masada söz hakkı tartışmalıdır.</div></div>`:''}

  ${kapali.length?`<div class="card"><details><summary>Karara bağlanmış iddialar (${kapali.length})</summary>
    <div class="stack">${kapali.map(kart).join('')}</div></details></div>`:''}`;
}

function ikiliSec(el){
  const zaten=el.classList.contains('on');
  el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  if(!zaten) el.classList.add('on');
}
async function iddiaKaydet(){
  const kim=document.querySelector('#iKim .chip.on')?.dataset.id;
  if(!kim) return toast('İddia edeni seç',true);
  const kime=document.querySelector('#iKime .chip.on')?.dataset.id||null;
  if(kime===kim) return toast('Kendine karşı iddia olmaz',true);
  const metin=$('#iMetin').value.trim();
  if(!metin) return toast('İddia metnini yaz',true);
  const bahis=$('#iBahisSerbest').value.trim()||document.querySelector('#iBahis .chip.on')?.dataset.b||'';
  const {data,error}=await sb.from('iddialar').insert({
    masa_id:DB.aktifGrup, kim_id:kim, kime_id:kime, metin, bahis:bahis||null,
    tarih:bugun(), vade:$('#iVade').value||null, durum:'acik', acan_id:OTURUM.id
  }).select('*').single();
  if(error) return toast(hataMetni(error),true);
  DB.iddialar.push({id:data.id,grupId:data.masa_id,tarih:data.tarih,vade:data.vade||'',
    kim:data.kim_id,kime:data.kime_id,metin:data.metin,bahis:data.bahis||'',
    durum:data.durum,sonucNot:'',kapanis:''});
  kapatModal(); render();
  toast('İddia deftere geçirildi. Geri dönüşü yoktur.',true);
}
async function iddiaKarar(id,durum){
  const i=DB.iddialar.find(x=>x.id===id); if(!i) return;
  const kaybeden = durum==='kazandi' ? (i.kime||null) : i.kim;
  const not = durum==='kazandi'
    ? `${ad(i.kim)} sözünü tutmuştur.${i.bahis&&kaybeden?` ${ad(kaybeden)} "${i.bahis}" borcunu ifa edecektir.`:''}`
    : `${ad(i.kim)} tutturamamıştır.${i.bahis?` "${i.bahis}" borcu kendisine yüklenmiştir.`:''}`;
  const {error}=await sb.from('iddialar')
    .update({durum,sonuc_not:not,kapanis:bugun()}).eq('id',id);
  if(error) return toast(hataMetni(error),true);
  i.durum=durum; i.sonucNot=not; i.kapanis=bugun();
  render(); toast(not,true);
}
async function iddiaAc(id){
  const i=DB.iddialar.find(x=>x.id===id); if(!i) return;
  const {error}=await sb.from('iddialar')
    .update({durum:'acik',sonuc_not:null,kapanis:null}).eq('id',id);
  if(error) return toast(hataMetni(error),true);
  i.durum='acik'; i.sonucNot=''; i.kapanis=''; render();
}
async function iddiaSil(id){
  if(!confirm('İddia defterden silinsin mi?')) return;
  const {error}=await sb.from('iddialar').delete().eq('id',id);
  if(error) return toast(hataMetni(error),true);
  DB.iddialar=DB.iddialar.filter(x=>x.id!==id); render();
}

}

      </div>
      <button class="btn-g btn-full btn-sm" style="margin-top:10px" onclick="kuraCek()">🎲 Eş Kurası Çek</button>
      <div class="xs dim" style="margin-top:8px">${DB.acik.length

        :''}Kurayı defter çeker, itiraz kabul edilmez.</div>
    </div>

    ${son?`<div class="card"><h3>Son Maç</h3>${arsivSatir(son,true)}</div>`:''}

function macOzet(c){
  const m=macDurum(c);
  if(c.oyun==='batak'){
    const T=i=>c.takimlar[i].oyuncular.map(ad).join(' & ');
    return {kim:`${T(0)}  vs  ${T(1)}`, skor:`${m.gTop[0]}–${m.gTop[1]}`,
            alt:c.partiHedef>1?`parti ${m.partiSkor[0]}–${m.partiSkor[1]}`:''};
  }
  const s=m.sira;
  return {kim:c.oyuncular.map(ad).join(', '),
          skor:s.length?`${ad(s[0].id)} ${s[0].puan}`:'—',
          alt:s.length>1?`sonuncu ${ad(s[s.length-1].id)} ${s[s.length-1].puan}`:''};
}
function acikMasaSatir(c){
  const o=macOzet(c), benim=c._hesap===OTURUM.id;
  const yazan=DB.oyuncular.find(x=>x.profilId===c._hesap&&x.masaId===c.grupId);
  return `<div class="row" style="gap:10px;align-items:flex-start">
    <div class="grow" style="min-width:0">
      <div class="row wrap" style="gap:6px">
        <span class="pill ${c.oyun==='batak'?'green':'blue'}">${c.oyun==='batak'?'BATAK':'101'}</span>

        ${c.giris==='hizli'?'<span class="pill">⚡</span>':''}
        <span class="xs dim">✍️ ${esc(yazan?.ad||'tabelacı')}</span>
      </div>
      <div class="sm" style="margin-top:5px;font-weight:600" >${esc(o.kim)}</div>
      <div class="xs muted">${esc(o.skor)}${o.alt?' · '+esc(o.alt):''}</div>
    </div>
    <button class="btn-sm ${benim?'btn-p':''}" onclick="macSec('${c.id}')">${benim?'Tabela':'İzle'}</button>
  </div>`;
}
function macSec(id){
  SECILI_MAC=id; DB.aktif=DB.acik.find(c=>c.id===id)||null;
  render(); window.scrollTo(0,0);
}
function macBirak(){
  SECILI_MAC=null; DB.aktif=null;

}
const varsayilanMasaAd=()=>`${DB.acik.length+1}. Masa`;
/* Hesabım var, masadayım — ama hangi oyuncu olduğum belli değil.
   Sahipsiz bir kaydı kendim üstlenirim; yoksa yeni kayıt açarım. */
function karsilama(){
  const bos=DB.oyuncular.filter(o=>o.masaId===DB.aktifGrup&&o.aktif&&!o.profilId);
  return `<div class="card">
    <div class="empty" style="padding-bottom:10px">
      <div class="big">§</div>
      <div class="serif" style="font-size:19px;color:var(--ink)">Sen hangisisin?</div>

async function celseKur(oyun){
  const s=secililer();
  const giris=document.querySelector('#mGiris .on')?.dataset.g||'hizli';
  const partiHedef= giris==='hizli' ? (oyun==='batak'?2:1) : Number(document.querySelector('#mParti .on')?.dataset.p||1);
  const tabelaci=document.querySelector('#mTabelaci .chip.on')?.dataset.id || DB.ben || s[0];

  const c={oyun,giris,masaAd,tarih:$('#mTarih').value||bugun(),yer:yerOku(),
           tabelaci,partiHedef,not:'',bahis:bahisOku(),partiler:[{eller:[],kazanan:null}]};
  if(oyun==='batak'){
    if(s.length!==4) return toast('Batak için tam 4 oyuncu gerekli',true);
    c.takimlar=[{ad:'A',oyuncular:[s[0],s[1]]},{ad:'B',oyuncular:[s[2],s[3]]}];
    c.hizli={partiSkor:[0,0],puan:[0,0]};
  }else{
    if(s.length<3) return toast('En az 3 oyuncu gerekli',true);
    c.mod=document.querySelector('#mMod .on')?.dataset.m||'tek';
    if(c.mod==='esli'&&s.length!==4) return toast('Eşli 101 için tam 4 oyuncu gerekli',true);
    c.oyuncular=s; c.esler=c.mod==='esli'?[[s[0],s[2]],[s[1],s[3]]]:null;
    c.hizli={sira:s.slice(),puan:{}};
  }
  /* Aynı oyuncu iki masada birden oturamaz */
  const mesgul=s.filter(id=>DB.acik.some(a=>macOyunculari(a).includes(id)));
  if(mesgul.length) return toast(`${liste(mesgul.map(ad))} zaten açık bir masada`,true);

  const btn=$('#mKurBtn'); if(btn){btn.disabled=true;btn.innerHTML='<span class="yukleniyor"></span>';}
  try{
    const {data,error}=await sb.from('maclar').insert({
      masa_id:DB.aktifGrup, oyun, giris, tarih:c.tarih, yer:c.yer||null,
      tabelaci_id:OTURUM.id, parti_hedef:Math.min(5,Math.max(1,partiHedef)),
      mod:oyun==='101'?c.mod:null, celse:c, bitti:false

    toast(hataMetni(e),true);
    if(btn){btn.disabled=false;btn.textContent='Tabelayı Aç';}
  }
}

function yzDurumSec(el){
  const kart=el.closest('.el-card');
  /* silme ve ceza durumdan bağımsız; onların düğmeleri ayrı kutuda */
  kart.querySelectorAll('.durumlar .chip').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  const tip=el.dataset.d, ek=kart.querySelector('.ek'), a=DB.ayar.yz;
  if(tip==='kaldi'||tip==='cifte'){
    ek.style.display='block';
    ek.innerHTML=`<label class="fl">Elinde kalan sayı${tip==='cifte'?` (×${a.cifteCarpan} yazılır)`:''}</label>
      <input type="number" inputmode="numeric" class="say" placeholder="örn. 48">`;
    ek.querySelector('.say').focus();
  }else if(tip==='bitirdi'&&a.okeyAktif){
    ek.style.display='block';
    ek.innerHTML=`<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
      <input type="checkbox" class="okey" style="width:18px;height:18px"> Okeyle bitirdi (×${a.okeyCarpan})</label>`;
  }else{ek.style.display='none';ek.innerHTML='';}
}
/* silme rozeti: durum seçiminden bağımsız açılıp kapanır */
function yzSilmeSec(el){ el.classList.toggle('on'); }
function yzElEkle(){
  const c=DB.aktif,parti=yzMac(c).aktif,durum={},eksik=[];
  let bitiren=null;
  for(const id of c.oyuncular){
    const kart=document.querySelector(`.el-card[data-oy="${id}"]`);
    const s=kart.querySelector('.durumlar .chip.on');
    if(!s){eksik.push(ad(id));continue;}
    const tip=s.dataset.d,d={tip};
    if(tip==='kaldi'||tip==='cifte'){
      const v=kart.querySelector('.say')?.value;
      if(v===''||v==null) return toast(`${ad(id)} için kalan sayıyı gir`,true);
      d.sayi=Number(v);
    }
    if(tip==='bitirdi'){bitiren=id;d.okey=!!kart.querySelector('.okey')?.checked;}
    if(kart.querySelector('.silme.on')) d.silme=true;
    const cz=kart.querySelector('.cezaGir')?.value;
    if(cz!==''&&cz!=null&&Number(cz)) d.ceza=Number(cz);
    durum[id]=d;
  }
  if(eksik.length) return toast(`Durum seçilmedi: ${eksik.join(', ')}`,true);
  if(!bitiren) return toast('El bitiren oyuncuyu işaretle',true);
  if(c.mod==='esli'&&c.esler){
    const pr=c.esler.find(p=>p.includes(bitiren)), es=pr&&pr.find(x=>x!==bitiren);
    if(es&&durum[es]&&durum[es].tip!=='es'){
      const kor={tip:'es'};
      if(durum[es].silme) kor.silme=true;
      if(durum[es].ceza)  kor.ceza=durum[es].ceza;
      durum[es]=kor;
    }
  }
  parti.eller.push({durum}); kaydet(); render();
  const N=DB.ayar.yz.elSayisi||11;
  toast(parti.eller.length>=N?`${N}. el girildi — parti tamamlandı`:yzElYorum(c,durum),true);
}

function gecmisPartiler(c){
  if(c.partiler.length<2) return '';
  const eski=c.partiler.slice(0,-1);
  return `<div class="card"><details><summary>Önceki partiler (${eski.length})</summary><div class="stack">
    ${eski.map((p,i)=>{
      if(c.oyun==='batak'){
        const {top}=batakPartiToplam(p),k=(p.kazanan!=null)?p.kazanan:batakPartiKazanan(p);
        return `<div class="row" style="justify-content:space-between"><span class="sm">${partiAd(c,i)}</span>
          <span class="sm"><b>${top[0]} – ${top[1]}</b> <span class="dim">· ${p.eller.length} el</span>
          ${k!=null?`<span class="pill gold">${c.takimlar[k].ad} aldı</span>`:''}</span></div>`;
      }
      const pt=yzPartiToplam(p,c),k=p.kazanan||yzPartiKazanan(p,c);
      const sr=c.oyuncular.slice().sort((x,y)=>pt[x]-pt[y]);
      return `<div><div class="row" style="justify-content:space-between"><span class="sm">${partiAd(c,i)}</span>
        ${k?`<span class="pill gold">${esc(liste(k.map(ad)))} aldı</span>`:''}</div>
        <div class="xs dim" style="margin-top:3px">${sr.map(id=>`${esc(ad(id))} ${pt[id]}`).join(' · ')}</div></div>`;
    }).join('')}</div></details></div>`;
}

/* --- kapatma --- */
function partiKapat(bitir){
  const c=DB.aktif,m=macDurum(c),parti=m.aktif;
  parti.kazanan = c.oyun==='batak'?batakPartiKazanan(parti):yzPartiKazanan(parti,c);
  if(bitir){kaydet();celseKapat();return;}
  c.partiler.push({eller:[],kazanan:null}); kaydet(); render(); window.scrollTo(0,0);
  toast(`${partiAd(c,c.partiler.length-1)} başladı. Taraflar yerlerini almıştır.`,true);
}
function elSil(){
  const m=macDurum(DB.aktif);
  if(!m.aktif.eller.length) return;
  m.aktif.eller.pop(); m.aktif.kazanan=null; kaydet(); render();
}
function celseKapat(){
  const c=DB.aktif;
  if(c.giris==='detay'&&!c.partiler.some(p=>p.eller.length)) return toast('Hiç el girilmemiş');
  acModal(`<h2 class="serif" style="margin:0 0 10px">Zabıt Kapanışı</h2>
    <div class="field"><label class="fl">Şerh <span style="text-transform:none;letter-spacing:0">(isteğe bağlı)</span></label>
      <textarea id="zNot" rows="2" placeholder="Masaya dair bir not..."></textarea></div>
    <button class="btn-g btn-full" style="margin-top:14px" onclick="celseKesinlestir()">Zabtı Üret</button>
    <button class="btn-gh btn-full btn-sm" style="margin-top:8px" onclick="kapatModal()">Vazgeç</button>`);
}
async function celseKesinlestir(){
  const c=DB.aktif; if(!c) return;
  clearTimeout(_yazZaman);          // bekleyen gecikmeli yazma kapanışın üstüne binmesin
  const oncekiRozet=rozetSahipleri(c.oyun);
  c.not=$('#zNot').value.trim();
  if(c.giris==='detay'){
    const son=c.partiler[c.partiler.length-1];
    if(son&&son.eller.length&&son.kazanan==null)
      son.kazanan=c.oyun==='batak'?batakPartiKazanan(son):yzPartiKazanan(son,c);
    if(son&&!son.eller.length&&c.partiler.length>1) c.partiler.pop();
  }
  const m=macDurum(c);
  c.kazanan = c.oyun==='batak' ? (m.macKazanan??(m.partiSkor[0]>=m.partiSkor[1]?0:1)) : (m.macKazanan??m.sira[0].id);
  c.zabit=zabitUret(c);
  const btn=document.querySelector('#modalHost .btn-g');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="yukleniyor"></span>';}
  try{
    await aktifYaz();
    const {error}=await sb.from('maclar').update({
      celse:aktifBelge(c), bitti:true, kazanan:c.kazanan??null,
      zabit:c.zabit, aciklama:c.not||null, tarih:c.tarih
    }).eq('id',c.id);
    if(error) throw error;
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Zabtı Üret';}
    return toast(hataMetni(e),true);
  }
  c.bitti=true;
  DB.acik=DB.acik.filter(x=>x.id!==c.id);
  DB.celseler.unshift(c); DB.aktif=null; SECILI_MAC=null;

  const sonra=rozetSahipleri(c.oyun), yeni=[];
  muayyideler(c.oyun).forEach(r=>{ if(oncekiRozet[r.ad]!==sonra[r.ad]) yeni.push(r); });

  /* Zabıt ve el değiştiren unvanlar akışa düşsün */
  const kazananAd = c.oyun==='batak'
    ? c.takimlar[c.kazanan]?.oyuncular.map(ad).join(' & ')
    : ad(c.kazanan);
  akisEkle('zabit',c.zabit,{mac_id:c.id,oyun:c.oyun,masaAd:c.masaAd||'',tarih:c.tarih,kazanan:kazananAd})
    .then(()=>Promise.all(yeni.map(r=>
      akisEkle('unvan',r.aciklama||'',{unvan:r.ad,k:r.k,kim:unvanAd(r.kim),oyun:c.oyun}))))
    .then(()=>{ if(TAB==='akis') render(); })
    .catch(()=>{});

  kapatModal(); zabitGoster(c,yeni);
}
async function celseIptal(){
  const c=DB.aktif; if(!c) return;
  if(!confirm('Bu tabela kaydedilmeden silinsin mi?')) return;
  clearTimeout(_yazZaman); _bekleyenYazi=false;
  const {error}=await sb.from('maclar').delete().eq('id',c.id);
  if(error) return toast(hataMetni(error),true);
  DB.acik=DB.acik.filter(x=>x.id!==c.id);
  DB.aktif=null; SECILI_MAC=null;
  render(); toast('Tabela silindi');
}
function zabitGoster(c,yeni){

      <div><span class="dim">Seri:</span> ${p.seriTip==='gal'?`<b class="pos">${p.seri} maçtır kazanıyor</b>`:`<b class="neg">${p.seri} maçtır kazanamıyor</b>`}</div>
      <div><span class="dim">En iyi:</span> ${p.enIyi} &nbsp; <span class="dim">En kötü:</span> ${p.enKotu}</div>
    </div>

function h2h(id,oyun){
  const skor={};
  for(const c of grupCelseleri().filter(c=>c.oyun===oyun)){
    if(oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) continue;
      const ben=c.takimlar.findIndex(t=>t.oyuncular.includes(id)); if(ben<0) continue;
      c.takimlar.forEach((t,ti)=>{ if(ti===ben) return;
        t.oyuncular.forEach(o=>{skor[o]=skor[o]||{g:0,m:0}; if(ben===kz)skor[o].g++; else skor[o].m++;});});
    }else{
      const sr=yzMac(c).sira, ben=sr.find(r=>r.id===id); if(!ben) continue;
      sr.forEach(r=>{if(r.id===id)return; skor[r.id]=skor[r.id]||{g:0,m:0};
        if(ben.sira<r.sira)skor[r.id].g++; else skor[r.id].m++;});
    }
  }
  const rows=Object.entries(skor).filter(([,s])=>s.g+s.m>0).sort((a,b)=>(b[1].g-b[1].m)-(a[1].g-a[1].m));
  if(!rows.length) return '';
  return `<div class="sep"></div><h3>Karşılaştırmalı Sicil</h3><table><tbody>
    ${rows.map(([o,s])=>{const d=s.g-s.m;
      const y=d>2?'konuşma hakkı vardır':(d<-2?'sessiz kalması tavsiye edilir':'başa baş');
      return `<tr><td>${esc(ad(o))}</td><td><b class="${d>0?'pos':(d<0?'neg':'zero')}">${s.g}–${s.m}</b></td>
        <td class="xs dim">${y}</td></tr>`;}).join('')}</tbody></table>`;
}

async function ayarSet(g,k,v,tam){

  await ayarYaz();
}
async function ayarYaz(sessiz){

        onclick="document.getElementById('fotoInp').click()">${_foto?'':'Fotoğraf<br>ekle'}</div>
      <div class="grow">
        <label class="fl">Ad</label>
        <input id="pAd" value="${esc(o?.ad||(benimIcin?(PROFIL?.ad||''):''))}" placeholder="Adı" maxlength="24">

      </div>

      onclick="oyuncuKaydet('${id||''}',${benimIcin?'true':'false'})">${o?'Kaydet':'Ekle'}</button>`);
}
function fotoSec(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const B=320, cv=document.createElement('canvas'); cv.width=B; cv.height=B;
      const g=cv.getContext('2d'), k=Math.min(im.width,im.height);
      g.drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,B,B);
      _foto=cv.toDataURL('image/jpeg',.8);
      cv.toBlob(b=>{_fotoBlob=b;},'image/jpeg',.8);
      const b=$('#fotoBtn'); if(b){b.style.backgroundImage=`url('${_foto}')`;b.style.borderStyle='solid';b.innerHTML='';}
    };
    im.src=r.result;
  };
  r.readAsDataURL(f); inp.value='';
}
function fotoSil(){
  _foto=null; _fotoBlob=null;
  const b=$('#fotoBtn');
  if(b){b.style.backgroundImage='';b.style.borderStyle='dashed';b.innerHTML='Fotoğraf<br>ekle';}
}
async function oyuncuKaydet(id,benimIcin){
  const n=$('#pAd').value.trim();
  if(!n) return toast('Ad gerekli',true);
  const cak=DB.oyuncular.some(o=>o.masaId===DB.aktifGrup&&o.id!==id&&o.aktif&&
                                 o.ad.toLocaleLowerCase('tr-TR')===n.toLocaleLowerCase('tr-TR'));
  if(cak) return toast('Bu isim grupta zaten var',true);
  const dg=$('#pDogum')?.value||null;
  const btn=$('#pBtn'); btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>';
  try{
    let foto_url = id ? (oy(id).foto||null) : null;
    if(_fotoBlob){
      const yol=`masa/${DB.aktifGrup}/${(id||yid())}_${Date.now()}.jpg`;
      const {error:ye}=await sb.storage.from('avatarlar')
        .upload(yol,_fotoBlob,{contentType:'image/jpeg',upsert:true});
      if(ye) throw ye;
      foto_url=sb.storage.from('avatarlar').getPublicUrl(yol).data.publicUrl;
    }else if(_foto===null&&id){ foto_url=null; }

    if(id){
      const {error}=await sb.from('oyuncular').update({ad:n,foto_url,dogum:dg}).eq('id',id);
      if(error) throw error;
    }else{
      await oyuncuEkle(n,foto_url,dg,!!benimIcin);
    }
    _foto=null; _fotoBlob=null;
    await verileriGetir(); kapatModal(); render(); toast('Kaydedildi');
  }catch(e){ toast(hataMetni(e),true); btn.disabled=false; btn.textContent='Kaydet'; }
}
async function oyuncuEkle(adi,foto_url,dogum,benim,renk){
  const n=DB.oyuncular.filter(o=>o.masaId===DB.aktifGrup).length;
  const {data,error}=await sb.from('oyuncular').insert({
    masa_id:DB.aktifGrup, ad:adi, foto_url:foto_url||null, dogum:dogum||null,
    renk:renk||RENKLER[n%RENKLER.length], profil_id: benim?OTURUM.id:null
  }).select('id').single();
  if(error) throw error;
  return data.id;
}

/* Eski tek-dosya prototipin (localStorage) yedeğini bu masaya taşır.
   Oyuncular ADA göre eşlenir; masada olmayan ad yeni oyuncu olarak açılır. */
function yedekYukle(inp){
  const f=inp.files[0]; if(!f) return;
  if(!kurucuMu()){ inp.value=''; return toast('İçe aktarmayı yalnız grubu kuran yapabilir',true); }
  const r=new FileReader();
  r.onload=async()=>{
    let d;
    try{ d=JSON.parse(r.result); }catch(e){ return toast('Dosya okunamadı',true); }
    if(!d||!Array.isArray(d.oyuncular)||!Array.isArray(d.celseler)) return toast('Bu bir defter yedeği değil',true);
    const gelen=d.celseler.filter(c=>c.bitti);
    if(!confirm(`Yedekte ${d.oyuncular.length} oyuncu, ${gelen.length} kapanmış maç var.\nBu masaya EKLENECEK (mevcut kayıtlar silinmez). Devam?`)) return;
    try{
      const harita={};
      for(const o of d.oyuncular){
        const varOlan=DB.oyuncular.find(x=>x.masaId===DB.aktifGrup&&
          x.ad.toLocaleLowerCase('tr-TR')===String(o.ad||'').toLocaleLowerCase('tr-TR'));
        harita[o.id]= varOlan ? varOlan.id : await oyuncuEkle(o.ad||'Oyuncu',null,o.dogum||null,false);
      }
      let n=0;
      for(const c of gelen){
        const y=celseHaritala(JSON.parse(JSON.stringify(c)),harita);
        const {error}=await sb.from('maclar').insert({
          masa_id:DB.aktifGrup, oyun:y.oyun, giris:y.giris||'detay', tarih:y.tarih||bugun(),
          yer:y.yer||null, tabelaci_id:OTURUM.id, parti_hedef:Math.min(5,Math.max(1,y.partiHedef||1)),
          mod:y.oyun==='101'?(y.mod||'tek'):null, celse:y, bitti:true,
          kazanan:y.kazanan??null, zabit:y.zabit||null, aciklama:y.not||null });
        if(error) throw error;
        n++;
      }
      await yenile(true);
      toast(`${n} maç içeri alındı.`,true);
    }catch(e){ toast(hataMetni(e),true); }
  };
  r.readAsText(f); inp.value='';
}
function celseHaritala(c,h){
  const m=id=>h[id]||id;
  ['id','grupId','_hesap'].forEach(k=>delete c[k]);
  if(c.tabelaci) c.tabelaci=m(c.tabelaci);
  if(c.takimlar) c.takimlar.forEach(t=>t.oyuncular=t.oyuncular.map(m));
  if(c.oyuncular) c.oyuncular=c.oyuncular.map(m);
  if(c.esler) c.esler=c.esler.map(p=>p.map(m));
  if(c.oyun==='101'&&typeof c.kazanan==='string') c.kazanan=m(c.kazanan);
  if(c.hizli){
    if(Array.isArray(c.hizli.sira)) c.hizli.sira=c.hizli.sira.map(m);
    if(c.hizli.puan&&!Array.isArray(c.hizli.puan)){
      const p={}; Object.keys(c.hizli.puan).forEach(k=>p[m(k)]=c.hizli.puan[k]); c.hizli.puan=p;
    }
  }
  (c.partiler||[]).forEach(pt=>{
    if(Array.isArray(pt.kazanan)) pt.kazanan=pt.kazanan.map(m);
    (pt.eller||[]).forEach(el=>{
      if(el.durum){ const d={}; Object.keys(el.durum).forEach(k=>d[m(k)]=el.durum[k]); el.durum=d; }
    });
  });
  return c;
}

async function masaKur(){
  const adi=$('#yMAd').value.trim();
  if(!adi) return toast('Grup adı gerekli',true);
  const emoji=document.querySelector('#yMEmoji .chip.on')?.dataset.e||GRUP_EMOJI[0];
  try{
    /* Masa kurma sunucudaki masa_kur() ile yapılır: masa ve kurucu üyeliği
       aynı işlemde oluşur. Doğrudan insert edilirse RETURNING okuma kuralına
       takılır (üyelik henüz görünmediği için). Bkz. yama 01. */
    const {data,error}=await sb.rpc('masa_kur',{p_ad:adi,p_emoji:emoji});
    if(error) throw error;
    const yeni=Array.isArray(data)?data[0]:data;
    if(!yeni) throw new Error('Grup kurulamadı');
    localStorage.setItem('kkd_aktif_masa',yeni.id);
    DB.aktifGrup=yeni.id;
    await verileriGetir();
    /* kuran kişi kendi oyuncu kaydını da alsın — yoksa maça giremez */
    if(!DB.ben&&PROFIL?.ad) await oyuncuEkle(PROFIL.ad,null,null,true);
    await verileriGetir(); kanalKur();
    DURUM='hazir'; kapatModal(); render();
    kodPaylas(grup(yeni.id));
  }catch(e){ toast(hataMetni(e),true); }
}
async function kodlaKatil(){
  const kod=($('#kKod')||$('#kKod2'))?.value.trim()||'';
  if(kod.length<4) return toast('Kodu tam yaz',true);
  try{
    const {data,error}=await sb.rpc('masaya_katil',{p_kod:kod});
    if(error) throw error;
    const r=Array.isArray(data)?data[0]:data;
    await verileriGetir();
    DURUM=DB.gruplar.length?'hazir':'masayok';
    kapatModal(); render();
    if(r?.durum==='onayli') toast(`${r.masa_ad} grubundasın.`);
    else toast(`${r?.masa_ad||'Masa'} için istek gönderildi. Kurucu onaylayacak.`,true);
  }catch(e){ toast(hataMetni(e),true); }
}

const TEPKILER=['😂','🔥','👏','💀','🤝','🎯'];

function akisKisi(profilId){
  const o=DB.oyuncular.find(x=>x.masaId===DB.aktifGrup&&x.profilId===profilId);
  if(o) return {ad:o.ad,foto:o.foto,renk:o.renk};
  const u=MASA_UYELERI.find(x=>x.profil_id===profilId);
  return {ad:u?.profiller?.ad||'birisi',foto:u?.profiller?.foto_url||null,renk:u?.profiller?.renk||'#5a524c'};
}
function avatarKisi(k,b){
  b=b||30;
  if(k.foto) return `<div class="avatar" style="width:${b}px;height:${b}px;background-image:url('${esc(k.foto)}')"></div>`;
  return `<div class="avatar" style="background:${esc(k.renk)};width:${b}px;height:${b}px;font-size:${Math.round(b*.43)}px">${esc(bas(k.ad))}</div>`;
}
function ne_zaman(iso){
  const t=new Date(iso), fark=(Date.now()-t.getTime())/1000;
  if(fark<60) return 'az önce';
  if(fark<3600) return Math.floor(fark/60)+' dk';
  if(fark<86400) return Math.floor(fark/3600)+' sa';
  if(fark<172800) return 'dün';
  const g=String(t.getDate()).padStart(2,'0'), a=String(t.getMonth()+1).padStart(2,'0');
  return `${g}.${a}`;
}

    <div class="sm" style="margin-top:6px">İlk lafı sen et. Kapanan her zabıt da buraya düşecek.</div></div></div>`;

/* --------- yazma --------- */
async function akisEkle(tip,metin,veri,yanitId){
  const {data,error}=await sb.from('akis').insert({
    masa_id:DB.aktifGrup, tip, yazan_id:OTURUM.id,
    metin:metin||null, veri:veri||{}, yanit_id:yanitId||null
  }).select('id,tip,yazan_id,metin,veri,olusturma,yanit_id').single();
  if(error){ toast(hataMetni(error),true); return null; }
  DB.akis.unshift({id:data.id,grupId:DB.aktifGrup,tip:data.tip,yazanId:data.yazan_id,
    metin:data.metin,veri:data.veri||{},olusturma:data.olusturma,yanitId:data.yanit_id,tepkiler:[]});
  return data.id;
}
async function akisYaz(){
  const m=($('#akMetin')?.value||'').trim();
  if(!m) return toast('Önce bir şey yaz',true);
  const b=$('#akBtn'); b.disabled=true; b.innerHTML='<span class="yukleniyor"></span>';
  const id=await akisEkle('mesaj',m,{});
  if(id){ _taslak=''; render(); } else { b.disabled=false; b.textContent='Gönder'; }
}
async function yorumYaz(ustId){
  const m=(_yorumTaslak[ustId]||'').trim();
  if(!m) return;
  const id=await akisEkle('mesaj',m,{},ustId);
  if(id){ _yorumTaslak[ustId]=''; _yorumAcik[ustId]=true; render(); }
}
function yorumAcKapa(id){ _yorumAcik[id]=!_yorumAcik[id]; render();
  setTimeout(()=>$('#yr_'+id)?.focus(),50); }
async function cagriYap(){
  const id=await akisEkle('cagri','Bu akşam oynayan var mı? 👍 basan gelir.',{});
  if(id){ await tepkiVer(id,'👍',true); render(); toast('Çağrı yapıldı.'); }
}
async function akisSil(id){
  if(!confirm('Silinsin mi?')) return;
  const {error}=await sb.from('akis').delete().eq('id',id);
  if(error) return toast(hataMetni(error),true);
  DB.akis=DB.akis.filter(a=>a.id!==id&&a.yanitId!==id);
  render();

/* --------- tepkiler --------- */
async function tepkiVer(akisId,emoji,sessiz){
  const a=DB.akis.find(x=>x.id===akisId); if(!a) return;
  a.tepkiler=a.tepkiler||[];
  const varMi=a.tepkiler.find(t=>t.profilId===OTURUM.id&&t.emoji===emoji);
  if(varMi){
    a.tepkiler=a.tepkiler.filter(t=>!(t.profilId===OTURUM.id&&t.emoji===emoji));
    if(!sessiz) render();
    const {error}=await sb.from('akis_tepkileri').delete()
      .eq('akis_id',akisId).eq('profil_id',OTURUM.id).eq('emoji',emoji);
    if(error) toast(hataMetni(error),true);
  }else{
    a.tepkiler.push({profilId:OTURUM.id,emoji});
    if(!sessiz) render();
    const {error}=await sb.from('akis_tepkileri')
      .insert({akis_id:akisId,profil_id:OTURUM.id,emoji});
    if(error) toast(hataMetni(error),true);
  }
}
function tepkiSec(id){
  acModal(`<h2 class="serif" style="margin:0 0 12px">Tepki</h2>
    <div class="row wrap">${TEPKILER.map(e=>
      `<button style="font-size:26px;padding:12px 16px" onclick="kapatModal();tepkiVer('${id}','${e}')">${e}</button>`).join('')}</div>`);
}

async function kadroSor(){

  catch(e){ return toast('Kadro dosyası okunamadı',true); }
  const varOlan=DB.oyuncular.filter(o=>o.masaId===DB.aktifGrup)
    .map(o=>o.ad.toLocaleLowerCase('tr-TR'));
  const yeni=k.oyuncular.filter(o=>!varOlan.includes(o.ad.toLocaleLowerCase('tr-TR')));
  if(!yeni.length) return toast('Kadro zaten kurulu');
  acModal(`<h2 class="serif" style="margin:0 0 4px">${esc(k.grup)} Kadrosu</h2>
    <div class="xs dim" style="margin-bottom:12px">Şu oyuncular gruba eklenecek. Hesap gerekmiyor —
      sicilleri bu kayıtlara işlenir. Sonradan herkes kendi hesabını bağlayabilir.</div>
    <div class="row wrap" style="gap:7px">${yeni.map(o=>

    <div class="xs dim" style="margin-top:10px">🖼 işaretli olanların fotoğrafı da yüklenecek.</div>
    <button class="btn-p btn-full" id="kdBtn" style="margin-top:16px" onclick="kadroKur()">
      ${yeni.length} oyuncuyu ekle</button>
    <button class="btn-gh btn-full btn-sm" style="margin-top:8px" onclick="kapatModal()">Vazgeç</button>`);
}

async function kadroKur(){
  const btn=$('#kdBtn'); if(btn){btn.disabled=true;}
  let eklenen=0, hata=0;
  try{
    const k=await fetch('kurulum/kadro.json',{cache:'no-store'}).then(r=>r.json());
    const varOlan=DB.oyuncular.filter(o=>o.masaId===DB.aktifGrup)
      .map(o=>o.ad.toLocaleLowerCase('tr-TR'));
    const bendeOyuncuVar=!!DB.ben;
    const yeni=k.oyuncular.filter(o=>!varOlan.includes(o.ad.toLocaleLowerCase('tr-TR')));

    for(let i=0;i<yeni.length;i++){
      const o=yeni[i];
      if(btn) btn.innerHTML=`<span class="yukleniyor"></span> ${i+1}/${yeni.length} · ${esc(o.ad)}`;
      try{
        let foto_url=null;
        if(o.foto){
          const blob=await fetch('kurulum/'+o.foto,{cache:'no-store'}).then(r=>r.blob());
          const yol=`masa/${DB.aktifGrup}/${o.kad||yid()}_${Date.now()}.jpg`;
          const {error:ye}=await sb.storage.from('avatarlar')
            .upload(yol,blob,{contentType:'image/jpeg',upsert:true});
          if(ye) throw ye;
          foto_url=sb.storage.from('avatarlar').getPublicUrl(yol).data.publicUrl;
        }
        /* "ben" işaretli oyuncu bu hesaba bağlanır — ama zaten bağlıysam dokunma */
        /* Lakap ada GÖMÜLMÜYOR: ayar.lakaplar'da tutulur, aşağıda işlenir.
           Ada gömülse her zabıtta tırnak içinde çıkar, metni kirletir. */
        await oyuncuEkle(o.ad,foto_url,o.dogum||null,!!o.ben&&!bendeOyuncuVar,o.renk||null);
        eklenen++;
      }catch(e){ hata++; console.warn(o.ad,e); }
    }
    /* lakapları ada göre eşleştirip ayara yaz (oyuncular oluştuktan sonra) */
    if(kurucuMu()){
      await verileriGetir();
      const m=Object.assign({},lakaplar());
      let lk=0;
      for(const o of k.oyuncular){
        if(!o.lakap) continue;
        const oy=grupOyunculari().find(x=>
          x.ad.toLocaleLowerCase('tr-TR')===o.ad.toLocaleLowerCase('tr-TR'));
        if(oy && m[oy.id]!==o.lakap){ m[oy.id]=o.lakap; lk++; }
      }
      if(lk){ DB.ayar.lakaplar=m; await ayarYaz(true); }
    }
  }catch(e){ toast(hataMetni(e),true); }
  await verileriGetir(); kapatModal(); render();
  toast(hata?`${eklenen} oyuncu eklendi, ${hata} tanesi olmadı.`:`${eklenen} oyuncu eklendi.`,!!hata);
}

let DAVET=null;

function davetOku(){
  const q=new URLSearchParams(location.search);
  const kod=q.get('kod');
  if(!kod) return;
  DAVET={kod:kod.toUpperCase(),oyuncu:q.get('oyuncu')||null,
         ad:q.get('ad')||'',kad:q.get('kad')||''};
  if(DAVET.ad||DAVET.kad) GIRIS_MOD='kayit';
  /* adres çubuğunu temizle: link paylaşılınca kimlik bilgisi taşınmasın */
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
}

async function davetiIsle(){
  if(!DAVET||!OTURUM) return;
  const d=DAVET; DAVET=null;
  try{
    if(d.oyuncu){
      const {data,error}=await sb.rpc('davetle_katil',{p_kod:d.kod,p_oyuncu:d.oyuncu});
      if(error) throw error;
      const r=Array.isArray(data)?data[0]:data;
      DB.aktifGrup=r.masa_id;
      localStorage.setItem('kkd_aktif_masa',r.masa_id);
      await verileriGetir(); kanalKur();
      toast(`Hoş geldin ${r.oyuncu_ad}. ${r.masa_ad} grubundasın.`);
    }else{
      const {data,error}=await sb.rpc('masaya_katil',{p_kod:d.kod});
      if(error) throw error;
      const r=Array.isArray(data)?data[0]:data;
      await verileriGetir(); kanalKur();
      toast(r?.durum==='onayli'?`${r.masa_ad} grubundasın.`
        :`${r?.masa_ad||'Grup'} için istek gönderildi, kurucu onaylayacak.`, r?.durum!=='onayli');
    }
  }catch(e){ toast(hataMetni(e),true); }
}

let GECMIS_OYUN='batak';
let GC_A=[], GC_B=[], GC_SIRA=[], GC_PUAN={};

      <textarea id="gcNot" rows="2" placeholder="Masaya dair bir not..."></textarea></div>

    <button class="btn-g btn-full" id="gcBtn" style="margin-top:14px" onclick="gecmisKaydet()">Deftere Geçir</button>
    <button class="btn-gh btn-full btn-sm" style="margin-top:8px" onclick="kapatModal()">Vazgeç</button>`);
  gcCiz();
}

/* --------- gövde: oyuna göre --------- */

/* ---------------- BATAK ---------------- */
function gcBatakGovde(){
  const oyn=grupOyunculari();
  const cip=(takim)=>oyn.map(p=>{
    const bende=(takim==='A'?GC_A:GC_B).includes(p.id);

      onclick="gcTakim('${takim}','${p.id}')">${avatar(p.id,20)}${esc(p.ad)}</div>`;
  }).join('');

  const pa=GC_PUAN.A, pb=GC_PUAN.B;
  const kz = (Number.isFinite(pa)&&Number.isFinite(pb)&&pa!==pb) ? (pa>pb?0:1)
           : (GC_PUAN.kazanan!=null?GC_PUAN.kazanan:null);
  const T=l=>l.length?l.map(ad).join(' & '):'—';

  return `
  <div class="field"><label class="fl"><span class="pill green">A</span> A takımı — 2 kişi
    <span class="dim" style="text-transform:none;letter-spacing:0">(${GC_A.length}/2)</span></label>
    <div class="row wrap">${cip('A')}</div></div>

  <div class="field" style="margin-top:12px"><label class="fl"><span class="pill blue">B</span> B takımı — 2 kişi
    <span class="dim" style="text-transform:none;letter-spacing:0">(${GC_B.length}/2)</span></label>
    <div class="row wrap">${cip('B')}</div></div>

  <div class="card tight" style="margin:12px 0 0;background:var(--panel2)">
    <div class="row" style="justify-content:space-between;gap:8px">
      <div class="sm"><span class="pill green">A</span> ${esc(T(GC_A))}</div>
      <div class="sm"><span class="pill blue">B</span> ${esc(T(GC_B))}</div>
    </div></div>

  <div class="field" style="margin-top:12px"><label class="fl">Toplam puan</label>
    <div class="two">
      <div><input type="number" inputmode="numeric" placeholder="A puanı" value="${pa??''}"
        onchange="gcPuan('A',this.value)"></div>
      <div><input type="number" inputmode="numeric" placeholder="B puanı" value="${pb??''}"
        onchange="gcPuan('B',this.value)"></div>
    </div>
    <div class="xs dim" style="margin-top:5px">Eski defterdeki toplamı yaz. Kazanan buradan anlaşılır.</div></div>

  ${kz!=null?`<div class="uyari" style="margin-top:12px">🏆 Kazanan: <b>${esc(T(kz===0?GC_A:GC_B))}</b>
    ${(Number.isFinite(pa)&&Number.isFinite(pb))?`(${pa}–${pb})`:''}</div>`
   :`<div class="field" style="margin-top:12px"><label class="fl">Kazanan takım</label>
      <div class="seg">
        <button class="${GC_PUAN.kazanan===0?'on':''}" onclick="gcPuan('kazanan',0)">A takımı</button>
        <button class="${GC_PUAN.kazanan===1?'on':''}" onclick="gcPuan('kazanan',1)">B takımı</button></div>
      <div class="xs dim" style="margin-top:5px">Puanı hatırlamıyorsan sadece kazananı seç, yeter.</div></div>`}

  <details style="margin-top:10px"><summary>Parti skorunu da yazayım</summary><div class="two">
    <div><label class="fl">A parti</label><input type="number" min="0" max="9" placeholder="2"
      value="${GC_PUAN.pA??''}" onchange="gcPuan('pA',this.value)"></div>
    <div><label class="fl">B parti</label><input type="number" min="0" max="9" placeholder="1"
      value="${GC_PUAN.pB??''}" onchange="gcPuan('pB',this.value)"></div>
  </div></details>`;
}
function gcTakim(takim,id){
  const bu = takim==='A'?GC_A:GC_B;
  const i=bu.indexOf(id);
  if(i>=0) bu.splice(i,1);
  else{
    if(bu.length>=2) return toast('Takımda 2 kişi olur — birini çıkar',true);
    bu.push(id);
  }
  gcCiz();
}
function gcPuan(alan,v){
  if(alan==='kazanan') GC_PUAN.kazanan=Number(v);
  else{
    const n=parseInt(v,10);
    GC_PUAN[alan]=Number.isFinite(n)?n:undefined;
  }
  gcCiz();
}

/* ---------------- 101 ---------------- */
function gcYzGovde(){
  const oyn=grupOyunculari();
  const cip=oyn.map(p=>`<div class="chip ${GC_SIRA.includes(p.id)?'on':''}"
      onclick="gcYzSec('${p.id}')">${avatar(p.id,20)}${esc(p.ad)}</div>`).join('');
  return `
  <div class="field"><label class="fl">Kimler oynadı?
    <span class="dim" style="text-transform:none;letter-spacing:0">(${GC_SIRA.length} kişi)</span></label>

  ${GC_SIRA.length?`<div class="field" style="margin-top:12px">
    <label class="fl">Sıralama — ▲▼ ile diz</label>
    <div class="card tight" style="margin:0;background:var(--panel2)">
      ${GC_SIRA.map((id,i)=>`<div class="row" style="padding:6px 0;gap:8px">

        <div class="grow" style="min-width:0;margin-left:3px">
          <div style="font-weight:600;font-size:13.5px" class="ell">${esc(ad(id))}</div>
