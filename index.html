        <input type="number" inputmode="numeric" placeholder="puan" style="width:78px"
          value="${GC_PUAN[id]??''}" onchange="gcYzPuan('${id}',this.value)">
        <div style="display:flex;flex-direction:column;gap:3px">
          <button class="btn-xs" onclick="gcTasi(${i},-1)" ${i===0?'disabled':''}>▲</button>
          <button class="btn-xs" onclick="gcTasi(${i},1)" ${i===GC_SIRA.length-1?'disabled':''}>▼</button>
        </div></div>`).join('')}
    </div>
    <div class="xs dim" style="margin-top:6px">En üstteki birinci, en alttaki sonuncu.
      Puanı hatırlamıyorsan boş bırak — sıralama yeter.</div></div>`:''}`;
}
function gcYzSec(id){
  const i=GC_SIRA.indexOf(id);
  if(i>=0) GC_SIRA.splice(i,1);
  else{
    if(GC_SIRA.length>=6) return toast('En fazla 6 oyuncu',true);
    GC_SIRA.push(id);
  }
  gcCiz();
}
function gcYzPuan(id,v){
  const n=Number(v);
  GC_PUAN[id]= (v===''||v==null)?undefined:(Number.isFinite(n)?n:0);
}
function gcTasi(i,d){
  const j=i+d;
  if(j<0||j>=GC_SIRA.length) return;
  [GC_SIRA[i],GC_SIRA[j]]=[GC_SIRA[j],GC_SIRA[i]];
  gcCiz();
}

/* ---------------- kaydet ---------------- */
async function gecmisKaydet(){
  const o=GECMIS_OYUN, tarih=$('#gcTarih').value;
  if(!tarih) return toast('Tarih gerekli',true);
  if(tarih>bugun()) return toast('İleri tarihli maç olmaz',true);

  const c={oyun:o,giris:'hizli',masaAd:'Geçmiş',tarih,yer:$('#gcYer').value.trim(),
           tabelaci:DB.ben||null,partiHedef:o==='batak'?2:1,not:$('#gcNot').value.trim(),
           bahis:bahisOku(),partiler:[{eller:[],kazanan:null}]};

  if(o==='batak'){
    if(GC_A.length!==2||GC_B.length!==2) return toast('Her takımda 2 kişi olmalı',true);
    const pa=GC_PUAN.A, pb=GC_PUAN.B;
    let kz;
    if(Number.isFinite(pa)&&Number.isFinite(pb)&&pa!==pb) kz = pa>pb?0:1;
    else if(GC_PUAN.kazanan===0||GC_PUAN.kazanan===1) kz = GC_PUAN.kazanan;
    else return toast('Kazanan takımı seç ya da puanları yaz',true);

    let sA=GC_PUAN.pA, sB=GC_PUAN.pB;
    if(!Number.isFinite(sA)||!Number.isFinite(sB)||sA===sB){ sA=kz===0?2:1; sB=kz===0?1:2; }
    else if((sA>sB)!==(kz===0)) return toast('Parti skoru kazanan takımla çelişiyor',true);

    c.takimlar=[{ad:'A',oyuncular:GC_A.slice()},{ad:'B',oyuncular:GC_B.slice()}];
    c.hizli={partiSkor:[sA,sB],puan:[Number.isFinite(pa)?pa:0,Number.isFinite(pb)?pb:0]};
    c.kazanan=kz;
    if(!c.tabelaci) c.tabelaci=GC_A[0];
  }else{
    if(GC_SIRA.length<3) return toast('101 için en az 3 oyuncu gerekli',true);
    const puan={};
    GC_SIRA.forEach(id=>{ puan[id]= GC_PUAN[id]===undefined?null:GC_PUAN[id]; });
    c.mod='tek'; c.oyuncular=GC_SIRA.slice(); c.esler=null;
    c.hizli={sira:GC_SIRA.slice(),puan};
    c.kazanan=GC_SIRA[0];
    if(!c.tabelaci) c.tabelaci=GC_SIRA[0];
  }

  const btn=$('#gcBtn'); btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>';
  try{
    c.zabit=zabitUret(c);
    const {data,error}=await sb.from('maclar').insert({
      masa_id:DB.aktifGrup, oyun:o, giris:'hizli', tarih, yer:c.yer||null,
      tabelaci_id:OTURUM.id, parti_hedef:c.partiHedef, mod:o==='101'?'tek':null,
      celse:JSON.parse(JSON.stringify(c)), bitti:true,

/* =========================================================
   ARAMIZDA — ikili sicil, kabuslar, eş uyumu
   "Kim kime karşı ne durumda" masada en çok konuşulan şey;
   burada kayda geçer ve kimse hafızasına güvenemez.
   ========================================================= */

/* Her İKİLİ için karşılıklı sicil: a, b'ye karşı kaç kazandı/kaybetti */
function ikiliSicil(oyun){
  const m={};                                  // "a|b" (a<b) → {a:kazanma, b:kazanma}
  const anahtar=(x,y)=>x<y?`${x}|${y}`:`${y}|${x}`;
  const kur=(x,y)=>{const k=anahtar(x,y); return m[k]=m[k]||{k,x:(x<y?x:y),y:(x<y?y:x),xg:0,yg:0};};

  for(const c of grupCelseleri().filter(c=>c.oyun===oyun)){
    if(oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) continue;
      const A=c.takimlar[0].oyuncular, B=c.takimlar[1].oyuncular;
      A.forEach(a=>B.forEach(b=>{
        const r=kur(a,b);
        const aKazandi = kz===0;
        if((r.x===a)===aKazandi) r.xg++; else r.yg++;
      }));
    }else{
      const sr=yzMac(c).sira;
      for(let i=0;i<sr.length;i++) for(let j=i+1;j<sr.length;j++){
        const p=sr[i], q=sr[j], r=kur(p.id,q.id);       // p daha iyi sırada
        if(r.x===p.id) r.xg++; else r.yg++;
      }
    }
  }
  return Object.values(m).filter(r=>r.xg+r.yg>0);
}

/* Batak: EŞ olarak birlikte oynayan ikililerin uyumu */
function esSicil(){
  const m={};
  const kur=(x,y)=>{const k=x<y?`${x}|${y}`:`${y}|${x}`; return m[k]=m[k]||{x,y,g:0,mgl:0};};
  for(const c of grupCelseleri().filter(c=>c.oyun==='batak')){
    const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) continue;
    c.takimlar.forEach((t,ti)=>{
      if(t.oyuncular.length<2) return;
      const r=kur(t.oyuncular[0],t.oyuncular[1]);
      if(ti===kz) r.g++; else r.mgl++;
    });
  }
  return Object.values(m).filter(r=>r.g+r.mgl>0);
}

const husumetLafi=f=>
  f>=4 ? 'artık sahibi sayılır'
: f===3 ? 'üstünlük tescillidir'
: f===2 ? 'ağırlığını koymuştur'
: f===1 ? 'kıl payı önde'
: 'kimse öne geçemedi, husumet sürüyor';

function aramizdaKart(oyun){
  const ik=ikiliSicil(oyun);
  if(!ik.length) return '';

  /* en çok karşı karşıya gelenler */
  const ezeli=ik.slice().sort((a,b)=>(b.xg+b.yg)-(a.xg+a.yg)).slice(0,5);

  /* herkesin kabusu: en çok kaybettiği rakip (en az 3 karşılaşma) */
  const kabus={};
  ik.forEach(r=>{
    const ekle=(kim,rakip,g,mg)=>{
      if(g+mg<3||mg<=g) return;
      const f=mg-g;
      if(!kabus[kim]||f>kabus[kim].f) kabus[kim]={rakip,g,mg,f};
    };
    ekle(r.x,r.y,r.xg,r.yg);
    ekle(r.y,r.x,r.yg,r.xg);
  });
  const kabusList=Object.entries(kabus).sort((a,b)=>b[1].f-a[1].f).slice(0,5);

  /* batak eş uyumu */
  const es=oyun==='batak'?esSicil().filter(r=>r.g+r.mgl>=2):[];
  const kanka=es.slice().sort((a,b)=>(b.g-b.mgl)-(a.g-a.mgl))[0];
  const ugursuz=es.slice().sort((a,b)=>(a.g-a.mgl)-(b.g-b.mgl))[0];

  const satir=r=>{
    const one=r.xg>=r.yg, ilk=one?r.x:r.y, son=one?r.y:r.x;
    const g=one?r.xg:r.yg, mg=one?r.yg:r.xg;
    return `<div class="row" style="padding:7px 0;gap:8px">
      ${avatar(ilk,26)}
      <div class="grow" style="min-width:0">
        <div style="font-size:13.5px;font-weight:600" class="ell">${esc(ad(ilk))} <span class="dim">vs</span> ${esc(ad(son))}</div>
        <div class="xs dim">${g+mg} karşılaşma · ${esc(husumetLafi(g-mg))}</div></div>
      ${avatar(son,26)}
      <div style="min-width:62px;text-align:right">
        <div class="serif" style="font-size:16px">
          <b class="${g>mg?'pos':'zero'}">${g}</b><span class="dim">–</span><b class="${mg>g?'neg':'zero'}">${mg}</b></div>
        <div class="bar" style="margin-top:3px"><i style="width:${Math.round(g/Math.max(1,g+mg)*100)}%;background:var(--gold)"></i></div>
      </div>
    </div>`;
  };

  return `
  <div class="card">
    <h3>⚔️ Aramızda · ${oyun==='batak'?'Batak':'101'}</h3>
    <div class="xs dim" style="margin-bottom:8px">En çok karşı karşıya gelenler. Rakamlar hafızadan güçlüdür.</div>
    ${ezeli.map(satir).join('<div class="sep" style="margin:0 -14px"></div>')}
  </div>

  ${kabusList.length?`<div class="card">
    <h3>😰 Kabuslar</h3>
    <div class="xs dim" style="margin-bottom:8px">Karşısına oturunca eli titreyenler. En az 3 karşılaşma şartı vardır.</div>
    ${kabusList.map(([kim,k])=>`<div class="row" style="padding:7px 0;gap:9px">
      ${avatar(kim,28)}
      <div class="grow" style="min-width:0">
        <div style="font-size:13.5px;font-weight:600" class="ell">${esc(ad(kim))}</div>
        <div class="xs" style="color:#DD8A8A">kabusu: <b>${esc(ad(k.rakip))}</b> · ${k.g}–${k.mg}</div></div>
      ${avatar(k.rakip,28)}
    </div>`).join('')}
  </div>`:''}

  ${(kanka&&kanka.g>kanka.mgl)||(ugursuz&&ugursuz.mgl>ugursuz.g)?`<div class="card">
    <h3>🤝 Eş Uyumu</h3>
    ${(kanka&&kanka.g>kanka.mgl)?`<div class="rozet" style="margin-bottom:8px"><div class="k">🫂</div>
      <div class="grow"><div style="font-weight:700;font-size:13.5px">Kanka</div>
        <div style="font-size:12.5px;color:var(--gold)">${esc(ad(kanka.x))} &amp; ${esc(ad(kanka.y))}</div>
        <div class="xs muted">Eş olarak ${kanka.g} galibiyet, ${kanka.mgl} yenilgi. Birbirini gözünden anlamaktadırlar.</div></div></div>`:''}
    ${(ugursuz&&ugursuz.mgl>ugursuz.g)?`<div class="rozet"><div class="k">🪦</div>
      <div class="grow"><div style="font-weight:700;font-size:13.5px">Uğursuz Eşleşme</div>
        <div style="font-size:12.5px;color:#DD8A8A">${esc(ad(ugursuz.x))} &amp; ${esc(ad(ugursuz.y))}</div>
        <div class="xs muted">Eş olarak ${ugursuz.g} galibiyet, ${ugursuz.mgl} yenilgi. Bu ikilinin bir daha eş düşmemesi masanın yararınadır.</div></div></div>`:''}
  </div>`:''}`;
}

/* Zabıta iliştirilen rekabet notu: bu maç ikili siciller ne yaptı */
function aramizdaNotu(c){
  const ik=ikiliSicil(c.oyun);
  if(!ik.length) return '';
  const ilgili = c.oyun==='batak' ? c.takimlar.flatMap(t=>t.oyuncular) : (c.oyuncular||[]);
  const bizim=ik.filter(r=>ilgili.includes(r.x)&&ilgili.includes(r.y));
  const carpici=bizim.filter(r=>Math.abs(r.xg-r.yg)>=3)
    .sort((a,b)=>Math.abs(b.xg-b.yg)-Math.abs(a.xg-a.yg))[0];
  if(!carpici) return '';
  const one=carpici.xg>carpici.yg;
  const ilk=one?carpici.x:carpici.y, son=one?carpici.y:carpici.x;
  const g=one?carpici.xg:carpici.yg, mg=one?carpici.yg:carpici.xg;
  return `${ad(ilk)}, ${ad(son)} karşısında ${g}-${mg} öne geçmiştir. ${ad(son)}'in bu husustaki beyanları kayda geçirilmemiştir.`;
}

  if(!kurucuMu()) return toast('Efsaneyi yalnız grubu kuran yazabilir',true);
  const oyn=grupOyunculari();
  acModal(`<h2 class="serif" style="margin:0 0 4px">Efsane Yaz</h2>
    <div class="xs dim" style="margin-bottom:14px">Masada yaşanmış, unutulmaması gereken bir hâl.
      Kişi seçersen o kişiler eş düştüğünde masa uyarı verir.</div>
    <div class="field"><label class="fl">Başlık</label>
      <input id="efBas" maxlength="40" placeholder="Kredi Meselesi"></div>
    <div class="field"><label class="fl">Metin</label>
      <textarea id="efMetin" rows="4" placeholder="Ne olmuştu? Zabıt üslubuyla yazarsan tadından yenmez."></textarea></div>

async function efsaneKaydet(){
  const baslik=$('#efBas').value.trim(), metin=$('#efMetin').value.trim();
  if(!baslik) return toast('Başlık gerekli',true);
  if(!metin)  return toast('Metni yaz',true);
  const adlar=[...document.querySelectorAll('#efKim .chip.on')].map(e=>ad(e.dataset.id));
  const tip=document.querySelector('#efTip .on')?.dataset.t||'efsane';
  const btn=$('#efBtn'); btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>';
  DB.ayar.efsaneler=[...efsaneler(),{baslik,metin,adlar,tip}];
  await ayarYaz(true);
  kapatModal(); render(); toast('Efsane deftere geçti.');
}

async function efsaneSil(i){
  if(!kurucuMu()) return toast('Yetkin yok',true);
  const e=efsaneler()[i]; if(!e) return;
  if(!confirm(`"${e.baslik}" silinsin mi?`)) return;
  DB.ayar.efsaneler=efsaneler().filter((_,j)=>j!==i);
  await ayarYaz(true);
  render(); toast('Silindi');
}

async function efsaneSeed(){
  if(!kurucuMu()) return toast('Yetkin yok',true);
  try{
    const d=await fetch('kurulum/efsaneler.json',{cache:'no-store'}).then(r=>r.json());
    // Aynı başlıklı efsane varsa ÜZERİNE BİRLEŞTİR: sonradan eklenen
    // fotoğraf/video/vurgu alanları mevcut kayda da işlensin.
    const mevcut=efsaneler().slice();
    let yeni=0, guncel=0;
    for(const e of (d.efsaneler||[])){
      const j=mevcut.findIndex(x=>x.baslik===e.baslik);
      if(j<0){ mevcut.push(e); yeni++; }
      else{
        const onceki=JSON.stringify(mevcut[j]);
        mevcut[j]=Object.assign({},mevcut[j],e);
        if(JSON.stringify(mevcut[j])!==onceki) guncel++;
      }
    }
    if(!yeni&&!guncel) return toast('Hazır efsaneler zaten güncel');
    DB.ayar.efsaneler=mevcut;
    await ayarYaz(true);
    render();
    toast(`${yeni} efsane eklendi, ${guncel} tanesi güncellendi.`);
  }catch(e){ toast('Efsane dosyası okunamadı',true); }
}

/* --------- maç kurulumunda uyarı ---------
   Aynı takıma düşen ikili hakkında yazılmış efsane varsa göster. */
function efsaneUyari(takimlar){
  const l=efsaneler().filter(e=>(e.adlar||[]).length>=2);
  if(!l.length||!takimlar) return '';
  const cikti=[];
  for(const e of l){
    const ids=(e.adlar||[]).map(a=>adaGoreOyuncu(a)?.id).filter(Boolean);
    if(ids.length<2) continue;
    const ayniTakim=takimlar.some(t=>ids.every(id=>t.includes(id)));
    if(ayniTakim) cikti.push(e);
  }
  if(!cikti.length) return '';
  return cikti.map(e=>`<div class="uyari" style="margin-top:10px">
    ⚠️ <b>${esc(e.baslik)}</b> — ${esc(e.metin)}</div>`).join('');
}

function lakap(id){ return lakaplar()[id]||''; }

/* Ad + lakap birlikte: kadro ve kartlarda kullanılır, zabıtta kullanılmaz */

}
/* düz metin hâli (kopyalanan yerler için) */
function adLakapDuz(id){
  const l=lakap(id);
  return l ? `${ad(id)} "${l}"` : ad(id);
}

function lakapKart(){

     :'<div class="sm dim">Henüz lakap takılmadı.</div>'}
    ${oyn.length>yazili.length?`<div class="xs dim" style="margin-top:9px">

function lakapAc(secili){
  if(!kurucuMu()) return toast('Lakabı yalnız masayı kuran takar',true);
  const oyn=grupOyunculari();
  acModal(`<h2 class="serif" style="margin:0 0 4px">Lakap Tak</h2>
    <div class="xs dim" style="margin-bottom:14px">Kısa olsun, tek kelime en iyisi.

    <div class="field"><label class="fl">Kim</label>
      <div class="row wrap" id="lkKim">${oyn.map(o=>

    <div class="field"><label class="fl">Lakap</label>

function tekSecChip(el){
  el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));

function lakapDoldur(){
  const id=document.querySelector('#lkKim .chip.on')?.dataset.id;

}
async function lakapKaydet(){
  const id=document.querySelector('#lkKim .chip.on')?.dataset.id;
  if(!id) return toast('Kimi seçtiğini söyle',true);
  const yeni=$('#lkAd').value.trim();
  const btn=$('#lkBtn'); btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>';

  kapatModal(); render();

/* =========================================================
   YER — masanın mutat mekânları
   Liste ayarda tutulur (ayar.yerler); yoksa varsayılan ikili kullanılır.
   Listede olmayan bir yere gidilirse serbest yazılabilir.
   ========================================================= */
const YER_VARSAYILAN=['Parkverde','Kemerdere'];
function yerListesi(){
  const l=DB.ayar&&DB.ayar.yerler;
  return (Array.isArray(l)&&l.length)?l:YER_VARSAYILAN;
}
/* son oynanan yer öne seçili gelsin — genelde bir dönem aynı yerde oynanır */
function sonYer(){
  const l=grupCelseleri().slice().sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||'')));
  return (l[0]&&l[0].yer)||yerListesi()[0];
}
function yerSecici(secili){
  const l=yerListesi();
  const listedeMi=l.includes(secili);
  return `<div class="field"><label class="fl">Yer</label>
    <div class="row wrap" id="mYerSec">${l.map(y=>
      `<div class="chip ${y===secili?'on':''}" data-y="${esc(y)}" onclick="yerSec(this)">📍 ${esc(y)}</div>`).join('')}</div>
    <input id="mYer" placeholder="başka bir yerde oynandıysa yaz..." style="margin-top:8px"
      value="${esc(listedeMi?'':(secili||''))}" oninput="yerYaziliyor()"></div>`;

function yerSec(el){
  el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  const i=$('#mYer'); if(i) i.value='';
}
function yerYaziliyor(){
  if(($('#mYer')?.value||'').trim())
    document.querySelectorAll('#mYerSec .chip').forEach(x=>x.classList.remove('on'));
}
function yerOku(){
  const s=($('#mYer')?.value||'').trim();
  return s || document.querySelector('#mYerSec .chip.on')?.dataset.y || '';
}

/* =========================================================
   TABELA — kâğıttaki hâliyle
   İki sütun, alt alta sayılar, altta toplam. Bir sütun hedefe
   (61) varınca parti biter. Artırma/azaltma düğmesi yok; sayı
   doğrudan yazılır. Batakta eksi de yazılabilir (örn. -7).

   Satırlar parti.eller içine {ham:[a,b]} olarak girer; böylece
   parti/maç/zabıt motorları hiç değişmeden çalışır.

   Hücre değişince TAM ÇİZİM YAPILMAZ — yalnız toplam ve yeni satır
   güncellenir. Yoksa mobilde her dokunuşta odak kaçar.
   ========================================================= */

const TB_IZGARA='display:grid;grid-template-columns:26px 1fr 1fr;gap:7px;align-items:center';

function hamSatirlar(p){
  return (p.eller||[]).map(el=>{
    if(Array.isArray(el.ham)) return [Number(el.ham[0])||0, Number(el.ham[1])||0];
    const x=batakElPuan(el,DB.ayar.batak);      // detaylı satır da gösterilebilsin
    return [x[0],x[1]];
  });
}
function tbAktifParti(){ return batakMac(DB.aktif).aktif; }

function tbHucre(r,i,deger,kilit){
  return `<input type="number" inputmode="numeric" data-r="${r}" data-i="${i}"
    value="${deger===''?'':deger}" ${kilit?'disabled':''} placeholder="·"
    onchange="tbYaz(${r},${i},this.value)" onkeydown="tbTus(event,${r},${i})"
    style="width:100%;text-align:center;font:600 17px/1 Georgia,serif;padding:9px 2px;
      background:${kilit?'transparent':'var(--panel2)'};
      border-color:${kilit?'transparent':'var(--line)'}">`;
}
function tbSatirHtml(r,cift,kilit){
  return `<div style="${TB_IZGARA};margin-bottom:5px" data-satir="${r}">
    <div class="xs dim center">${r+1}</div>
    ${tbHucre(r,0,cift?cift[0]:'',kilit)}${tbHucre(r,1,cift?cift[1]:'',kilit)}
  </div>`;
}
function tbToplamHtml(){
  const c=DB.aktif, a=DB.ayar.batak, parti=tbAktifParti();
  const {top}=batakPartiToplam(parti);
  const pKz=batakPartiKazanan(parti);
  const yuz=i=>Math.min(100,Math.max(0,top[i]/a.hedef*100));
  return `<div style="${TB_IZGARA}">
    <div class="xs dim center">Σ</div>
    ${[0,1].map(i=>`<div class="center">
      <div class="serif" style="font-size:30px;line-height:1;
        color:${pKz===i?'var(--gold)':(top[i]<0?'var(--red)':'var(--ink)')}">${top[i]}</div>
      <div class="bar" style="margin-top:6px"><i style="width:${yuz(i)}%;
        background:${i?'var(--blue)':'var(--accent2)'}"></i></div>
    </div>`).join('')}
  </div>
  <div class="xs dim center" style="margin-top:7px">hedef ${a.hedef} · ${parti.eller.length} el yazıldı</div>`;
}

function batakTabela(){
  const c=DB.aktif, a=DB.ayar.batak, m=batakMac(c);
  const parti=m.aktif, pIdx=m.aktifIdx;
  const {top}=batakPartiToplam(parti);
  const pKz=batakPartiKazanan(parti);
  const pAd=partiAd(c,pIdx), cikis=pAd==='Çıkıştırma';
  const T=i=>c.takimlar[i].oyuncular.map(ad).join(' & ');
  const satir=hamSatirlar(parti);
  const bitti=pKz!==null;

  return `
  ${macSerit(c)}
  <div class="card ${cikis?'cikis':''}">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div class="serif" style="font-size:17px">${cikis?'🔥 ':''}${pAd}</div>
        <div class="xs dim">${trh(c.tarih)}${c.yer?' · '+esc(c.yer):''}${c.tabelaci?' · ✍️ '+esc(ad(c.tabelaci)):''}</div></div>
      <button class="btn-xs btn-dn" onclick="celseIptal()">İptal</button>
    </div>

    <div class="sep"></div>

    <div style="${TB_IZGARA};align-items:end">
      <div></div>
      ${[0,1].map(i=>`<div class="center">
        <div><span class="pill ${i?'blue':'green'}">${c.takimlar[i].ad}</span></div>
        <div class="xs" style="font-weight:600;margin-top:3px;line-height:1.3">${esc(T(i))}</div>
      </div>`).join('')}
    </div>

    <div style="height:1px;background:var(--line);margin:9px 0"></div>

    <div id="tbGovde">
      ${satir.map((cift,r)=>tbSatirHtml(r,cift,bitti)).join('')}
      ${bitti?'':tbSatirHtml(satir.length,null,false)}
    </div>

    <div style="height:2px;background:var(--line);margin:8px 0"></div>
    <div id="tbToplam">${tbToplamHtml()}</div>

    ${satir.length&&!bitti?`<button class="btn-sm btn-dn btn-full" style="margin-top:11px"
      onclick="tbSonSatirSil()">Son satırı sil</button>`:''}

    ${bitti?`<div class="sep"></div><div class="center">
      <div class="serif" style="color:var(--gold);font-size:16px">${esc(T(pKz))} partiyi aldı</div>
      <div class="xs dim" style="margin-top:2px">${top[pKz]} – ${top[1-pKz]}</div>
      ${m.partiSkor[pKz]+1>=c.partiHedef
        ?`<button class="btn-g btn-full" style="margin-top:11px" onclick="partiKapat(true)">Maçı Bitir → Zabıt</button>`
        :`<button class="btn-g btn-full" style="margin-top:11px" onclick="partiKapat(false)">Partiyi Kapat → Sonraki Parti</button>`}
      </div>`:''}
  </div>

  ${gecmisPartiler(c)}

  ${!bitti&&satir.length?`<div class="card tight center">
    <button class="btn-gh btn-sm" onclick="celseKapat()">Yarıda kes, tabelayı olduğu gibi kapat</button></div>`:''}
  <div class="card tight center xs dim">Sayıyı olduğu gibi yaz; batakta eksi de yazılır (örn. −7).
    İhale, koz ve şlem dökümü tutulacaksa masa "Detaylı" açılmalı.</div>`;
}

/* =========================================================
   101 TABELASI — oyuncu başına bir sütun
   Her el o oyuncunun aldığı sayı doğrudan yazılır (bitirdi −101,
   açamadı +200, elinde kalan +X … hangisi olduysa sayısı yazılır).
   elSayisi (11) el dolunca parti biter; toplamı en DÜŞÜK olan alır.
   ========================================================= */
function yzIzgara(n){ return `display:grid;grid-template-columns:24px repeat(${n},minmax(58px,1fr));gap:6px;align-items:center`; }

function yzHamSatir(el,c){
  if(el && el.ham) return c.oyuncular.map(id=>Number(el.ham[id])||0);
  return c.oyuncular.map(id=>yzElPuan(el,id));
}
function yzHucre(r,id,deger,kilit){
  return `<input type="number" inputmode="numeric" data-r="${r}" data-oy="${id}"
    value="${deger===''?'':deger}" ${kilit?'disabled':''} placeholder="·"
    onchange="yzTbYaz(${r},'${id}',this.value)" onkeydown="yzTbTus(event,${r},'${id}')"
    style="width:100%;text-align:center;font:600 15px/1 Georgia,serif;padding:9px 1px;
      background:${kilit?'transparent':'var(--panel2)'};
      border-color:${kilit?'transparent':'var(--line)'}">`;
}
function yzTbSatirHtml(r,degerler,kilit,c){
  return `<div style="${yzIzgara(c.oyuncular.length)};margin-bottom:5px" data-satir="${r}">
    <div class="xs dim center">${r+1}</div>
    ${c.oyuncular.map((id,k)=>yzHucre(r,id,degerler?degerler[k]:'',kilit)).join('')}
  </div>`;
}
function yzTbToplamHtml(){
  const c=DB.aktif, a=DB.ayar.yz, parti=yzMac(c).aktif;
  const top=yzPartiToplam(parti,c);
  const N=a.elSayisi||11, doldu=parti.eller.length>=N;
  const en=Math.min(...c.oyuncular.map(id=>top[id]));
  return `<div style="${yzIzgara(c.oyuncular.length)}">
    <div class="xs dim center">Σ</div>
    ${c.oyuncular.map(id=>`<div class="center serif" style="font-size:22px;line-height:1;

function yzTbYaz(r,id,deger){
  const c=DB.aktif; if(!c) return;
  const parti=yzMac(c).aktif;
  const bos=String(deger).trim()==='';
  const v=bos?0:(parseInt(deger,10)||0);

  while(parti.eller.length<=r) parti.eller.push({ham:{}});
  const el=parti.eller[r];
  if(!el.ham) el.ham={};
  el.ham[id]=v;

  /* sondaki tamamen boş satırları at */
  while(parti.eller.length){
    const e=parti.eller[parti.eller.length-1];
    const bosMu = e.ham && c.oyuncular.every(x=>!e.ham[x]);
    if(bosMu) parti.eller.pop(); else break;
  }
  parti.kazanan=null;
  kaydet();

  const N=DB.ayar.yz.elSayisi||11;
  if(parti.eller.length>=N){ render(); return; }
  yzTbTazele();
}
function yzTbTazele(){
  const t=document.getElementById('yzToplam');
  if(t) t.innerHTML=yzTbToplamHtml();
  const g=document.getElementById('yzGovde');
  if(!g) return;
  const c=DB.aktif, parti=yzMac(c).aktif, n=parti.eller.length;
  const mevcut=g.querySelectorAll('[data-satir]').length;
  if(mevcut<n+1) g.insertAdjacentHTML('beforeend', yzTbSatirHtml(n,null,false,c));
  else if(mevcut>n+1)
    for(let k=mevcut-1;k>=n+1;k--) g.querySelector(`[data-satir="${k}"]`)?.remove();
}

/* =========================================================
   NEYE OYNANIYOR + BORÇ TABELASI
   Her maça bir bahis yazılır (cin, çay, hesap...). Maç kapanınca
   kazanan alacaklı, kaybeden borçlu olur. Ödeme akışa işlenir ve
   tabeladan düşer — yani borç kaydı da masanın gözü önünde durur.
   ========================================================= */
const BAHISLER=[
  {ad:'Cin',            k:'🥃'},
  {ad:"Hendrick's Gin", k:'🫐'},
  {ad:'Beefeater Gin',  k:'🇬🇧'},
  {ad:'Çay',    k:'🫖'},
  {ad:'Kahve',  k:'☕'},
  {ad:'Nargile',k:'💨'},
  {ad:'Tost',   k:'🥪'},
  {ad:'Hesap',  k:'🧾'},
  {ad:'Onur',   k:'🎖️'}   // borç doğurmaz
];
const bahisIkon=ne=>(BAHISLER.find(b=>b.ad===ne)||{}).k||'🎁';
const BORCSUZ=['Onur',''];

/* Bir maçın bahsi birden çok kalem olabilir: hem hesap, hem içecek.
   ESKİ KAYIT {ne,adet} · YENİ KAYIT {kalemler:[{ne,adet},...]}
   Okuyan her yer bu iki fonksiyondan geçsin ki eski maçlar bozulmasın. */
function bahisKalemleri(b){
  if(!b) return [];
  if(Array.isArray(b.kalemler)) return b.kalemler.filter(x=>x&&x.ne)
    .map(x=>({ne:x.ne,adet:Math.max(1,Number(x.adet)||1)}));
  if(b.ne) return [{ne:b.ne,adet:Math.max(1,Number(b.adet)||1)}];
  return [];
}
const bahisBorcluKalemler=b=>bahisKalemleri(b).filter(x=>!BORCSUZ.includes(x.ne));
function bahisOzet(b){
  const k=bahisKalemleri(b);
  if(!k.length) return '';
  return k.map(x=>`${x.adet>1?x.adet+' ':''}${x.ne}`).join(' + ');
}

/* --------- tabela: maçlardan alacak/borç, akıştan ödeme --------- */
function borcTablosu(){
  const t={};        // "oyuncuId|bahis" → bakiye (+ alacaklı, − borçlu)
  const ekle=(id,ne,n)=>{ if(!id||BORCSUZ.includes(ne)) return;
    const k=`${id}|${ne}`; t[k]=(t[k]||0)+n; };

  for(const c of grupCelseleri()){
    const kalemler=bahisBorcluKalemler(c.bahis); if(!kalemler.length) continue;
    if(c.oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) continue;
      c.takimlar.forEach((tk,ti)=>tk.oyuncular.forEach(id=>
        kalemler.forEach(x=>ekle(id,x.ne,ti===kz?x.adet:-x.adet))));
    }else{
      const sr=yzMac(c).sira; if(!sr.length) continue;
      kalemler.forEach(x=>{ ekle(sr[0].id,x.ne,x.adet); ekle(sr[sr.length-1].id,x.ne,-x.adet); });
    }
  }
  /* akıştaki elle borç kayıtları (devir, iddia, söz) */
  (DB.akis||[]).forEach(a=>{
    const k=a.veri&&a.veri.borcKaydi;
    if(!k||!k.ne) return;
    const n=Number(k.adet)||1;
    (k.borclular||[]).forEach(id=>ekle(id,k.ne,-n));
    (k.alacaklilar||[]).forEach(id=>ekle(id,k.ne,n));
  });
  /* akıştaki ödemeler borcu kapatır */
  (DB.akis||[]).forEach(a=>{
    const o=a.veri&&a.veri.odeme;
    if(!o||!o.kim||!o.ne) return;
    const k=`${o.kim}|${o.ne}`;
    t[k]=(t[k]||0)+(Number(o.adet)||0);      // ödeyince borcu (eksi) azalır
  });
  return t;
}

function borcKart(){
  const t=borcTablosu();
  const kayitlar=Object.entries(t).filter(([,v])=>v!==0)
    .map(([k,v])=>{const [id,ne]=k.split('|'); return {id,ne,v};});
  if(!kayitlar.length) return '';

  const borclu=kayitlar.filter(r=>r.v<0).sort((a,b)=>a.v-b.v);
  const alacakli=kayitlar.filter(r=>r.v>0).sort((a,b)=>b.v-a.v);

  return `<div class="card">
    <h3>🥃 Borç Tabelası</h3>
    <div class="xs dim" style="margin-bottom:8px">Maçlardan doğan borçlar. Ödeme kaydedilince düşer ve akışa işlenir.</div>

      ${borclu.map(satir).join('')}`:''}
    ${alacakli.length?`<div class="sep"></div>
      <div class="xs" style="color:#8CC79B;font-weight:700;margin:4px 0">ALACAKLI</div>
      ${alacakli.map(satir).join('')}`:''}

  </div>`;
}

/* zabıta bahis satırı */
function bahisNotu(c){
  const hepsi=bahisKalemleri(c.bahis);
  if(!hepsi.length) return '';
  const borclu=bahisBorcluKalemler(c.bahis);
  if(!borclu.length)
    return `BAHİS: Maç ${hepsi[0].ne.toLocaleLowerCase('tr-TR')}una oynanmıştır; maddi bir sonuç doğmamıştır.`;
  const dokum=borclu.map(x=>`${x.adet} ${x.ne}`).join(' + ');
  const coklu=borclu.length>1 ? ' Kalemler ayrı ayrı zimmete geçirilmiştir.' : '';
  if(c.oyun==='batak'){
    const kz=c.kazanan??batakMac(c).macKazanan;
    if(kz==null) return '';
    const kayb=c.takimlar[1-kz].oyuncular.map(ad);
    return `BAHİS: ${dokum}. ${liste(kayb)} borçlanmış olup, ifa süresi bir sonraki celseye kadardır.${coklu}`;
  }
  const sr=yzMac(c).sira;
  if(!sr.length) return '';
  return `BAHİS: ${dokum}. ${ad(sr[sr.length-1].id)} borçlanmış, ${ad(sr[0].id)} alacaklı hâle gelmiştir.${coklu}`;
}

/* =========================================================
   BORÇLULAR HESABI — bakiye + kişi bazında EKSTRE
   Her hareket nereden geldiği belli olacak şekilde listelenir:
   hangi maç borçlandırdı, hangi ödeme düştü.
   ========================================================= */

/* Bir oyuncunun bütün hareketleri, tarihe göre */
function borcHareketleri(id){
  const h=[];
  for(const c of grupCelseleri()){
    /* bir maçta birden çok bahis kalemi olabilir (hesap + içecek);
       ekstrede her kalem ayrı hareket olarak görünür */
    const kalemler=bahisBorcluKalemler(c.bahis); if(!kalemler.length) continue;
    if(c.oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) continue;
      const ti=c.takimlar.findIndex(t=>t.oyuncular.includes(id)); if(ti<0) continue;
      const rakip=c.takimlar[1-ti].oyuncular.map(ad).join(' & ');
      kalemler.forEach(x=>h.push({tarih:c.tarih,sira:c._sira||'',ne:x.ne,adet:ti===kz?x.adet:-x.adet,
        aciklama:(ti===kz?'Batak galibiyeti · ':'Batak yenilgisi · ')+rakip,macId:c.id}));
    }else{
      const sr=yzMac(c).sira; if(!sr.length) continue;
      if(sr[0].id===id) kalemler.forEach(x=>h.push({tarih:c.tarih,sira:c._sira||'',ne:x.ne,adet:x.adet,
        aciklama:'101 birinciliği',macId:c.id}));
      else if(sr[sr.length-1].id===id) kalemler.forEach(x=>h.push({tarih:c.tarih,sira:c._sira||'',ne:x.ne,adet:-x.adet,
        aciklama:'101 sonuncululuğu',macId:c.id}));
    }
  }
  (DB.akis||[]).forEach(a=>{
    const k=a.veri&&a.veri.borcKaydi;
    if(k&&k.ne){
      const n=Number(k.adet)||1;
      if((k.borclular||[]).includes(id))
        h.push({tarih:(a.olusturma||'').slice(0,10),sira:a.olusturma||'',ne:k.ne,adet:-n,
          aciklama:k.aciklama||'Borç kaydı · '+liste((k.alacaklilar||[]).map(ad))+' lehine'});
      if((k.alacaklilar||[]).includes(id))
        h.push({tarih:(a.olusturma||'').slice(0,10),sira:a.olusturma||'',ne:k.ne,adet:n,
          aciklama:'Alacak kaydı · '+liste((k.borclular||[]).map(ad))+' zimmetinde'});
    }
    const o=a.veri&&a.veri.odeme;
    if(!o||o.kim!==id) return;
    h.push({tarih:(a.olusturma||'').slice(0,10),sira:a.olusturma||'',ne:o.ne,
      adet:Number(o.adet)||0,aciklama:'Ödeme yapıldı',odeme:true});
  });
  return h.sort((x,y)=>(y.tarih+y.sira).localeCompare(x.tarih+x.sira));
}

    .map(([k,v])=>{const [id,ne]=k.split('|'); return {id,ne,v};});
  const L=[`${g.emoji||''} ${String(g.ad).toLocaleUpperCase('tr-TR')} — HESAP ÖZETİ`,
           `${trh(bugun())} itibarıyla`,''];
  if(!kayit.length){ L.push('Masada açık borç bulunmamaktadır. Nadir görülen bir hâldir.'); return L.join('\n'); }
  const borclu=kayit.filter(r=>r.v<0).sort((a,b)=>a.v-b.v);
  const alacakli=kayit.filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  if(borclu.length){
    L.push('BORÇLULAR:');
    borclu.forEach(r=>L.push(`  • ${ad(r.id)} — ${Math.abs(r.v)} ${r.ne}`));

  return L.join('\n');

/* =========================================================
   REKORLAR KİTABI — masanın sayısal efsaneleri
   Efsaneler hikâyeyi, bu sayfa rakamı tutar.
   ========================================================= */
function rekorlar(oyun){
  const R=[];
  const list=grupCelseleri().filter(c=>c.oyun===oyun);
  if(!list.length) return R;
  const ekle=(k,baslik,deger,kim,not,tarih)=>{
    if(deger==null) return;
    R.push({k,baslik,deger,kim:Array.isArray(kim)?kim:[kim],not,tarih});
  };

  if(oyun==='batak'){
    /* en ağır fark: maç toplam puan farkı */
    let f=null;
    list.forEach(c=>{
      const m=batakMac(c), kz=c.kazanan??m.macKazanan??0;
      const d=m.gTop[kz]-m.gTop[1-kz];
      if(!(m.gTop[0]||m.gTop[1])) return;                 // puan yazılmamış
      if(!f||d>f.d) f={d,c,kz,kazandi:m.gTop[kz],kaybetti:m.gTop[1-kz]};
    });
    if(f) ekle('💣','En ağır fark',`${f.kazandi} – ${f.kaybetti}`,
      f.c.takimlar[f.kz].oyuncular,
      `${liste(f.c.takimlar[1-f.kz].oyuncular.map(ad))} karşısında. Aradaki ${f.d} puanlık uçurum `+
      `${f.kaybetti<0?'karşı tarafın EKSİDE bitirmesiyle':'tek celsede'} oluşmuş; `+
      `sonuç dillere destan olmuş, bugüne kadar aşılamamıştır. `+
      `Kaybeden tarafın "kağıt gelmedi" savunması reddedilmiştir.`,f.c.tarih);

    /* en ağır batak: ihale - alınan */
    let b=null;
    list.forEach(c=>batakTumEller(c).forEach(el=>{
      const d=el.ihale-el.alinan;
      if(d>0&&(!b||d>b.d)) b={d,el,c};
    }));
    if(b) ekle('🕳️','En ağır batak',`${b.el.ihale} ihale · ${b.el.alinan} el`,
      b.c.takimlar[b.el.ihaleTakim].oyuncular,
      `${b.d} el eksik. "Az kalmıştı" savunması dinlenmemiştir.`,b.c.tarih);

    /* en yüksek ihale (tutan) */
    let y=null;
    list.forEach(c=>batakTumEller(c).forEach(el=>{
      if(el.alinan>=el.ihale&&(!y||el.ihale>y.el.ihale)) y={el,c};
    }));
    if(y) ekle('🎯','Tutturulan en yüksek ihale',`${y.el.ihale}`,
      y.c.takimlar[y.el.ihaleTakim].oyuncular,'Beyanın arkasında durulmuştur.',y.c.tarih);

    /* şlem sayısı */
    const st=istatistik('batak');
    const sl=Object.values(st).filter(p=>p.slem>0).sort((a,b)=>b.slem-a.slem);
    if(sl.length) ekle('🧨','En çok şlem',`${sl[0].slem}`,
      sl.filter(p=>p.slem===sl[0].slem).map(p=>p.id),'Masaya tek el bırakmama sanatı.');

    /* tek partide en yüksek puan */
    let tp=null;
    list.filter(c=>c.giris==='detay').forEach(c=>c.partiler.forEach(p=>{
      const {top}=batakPartiToplam(p);
      [0,1].forEach(i=>{ if(!tp||top[i]>tp.v) tp={v:top[i],c,ti:i}; });
    }));
    if(tp&&tp.v>0) ekle('🚀','Tek partide en yüksek puan',`${tp.v}`,
      tp.c.takimlar[tp.ti].oyuncular,'Hedef aşılmıştır.',tp.c.tarih);
  }else{
    /* tek elde en ağır ceza */
    let a=null;
    list.forEach(c=>(c.partiler||[]).forEach(p=>(p.eller||[]).forEach(el=>{
      (c.oyuncular||[]).forEach(id=>{
        const v=yzElPuan(el,id);
        if(v>0&&(!a||v>a.v)) a={v,id,c};
      });
    })));
    if(a) ekle('🐢','Tek elde en ağır ceza',`+${a.v}`,a.id,'Rekor kendisindedir.',a.c.tarih);

    /* maç sonu en yüksek (kötü) ve en düşük (iyi) toplam */
    let en=null,az=null;
    list.forEach(c=>{
      const sr=yzMac(c).sira;
      if(!sr.length) return;
      const s=sr[sr.length-1], i=sr[0];
      if(s.puan!=null&&(!en||s.puan>en.v)) en={v:s.puan,id:s.id,c};
      if(i.puan!=null&&(!az||i.puan<az.v)) az={v:i.puan,id:i.id,c};
    });
    if(en) ekle('💸','Maç sonu en yüksek ceza',`${en.v}`,en.id,'Masayı fiilen finanse etmiştir.',en.c.tarih);
    if(az) ekle('🧊','Maç sonu en düşük puan',`${az.v}`,az.id,'Kusursuz icra.',az.c.tarih);

    /* en çok el bitirme (tek maçta) */
    let eb=null;
    list.filter(c=>c.giris==='detay').forEach(c=>{
      const say={};
      c.partiler.forEach(p=>p.eller.forEach(el=>(c.oyuncular||[]).forEach(id=>{
        if(el.durum[id]?.tip==='bitirdi') say[id]=(say[id]||0)+1; })));
      Object.entries(say).forEach(([id,n])=>{ if(!eb||n>eb.n) eb={n,id,c}; });
    });
    if(eb) ekle('✂️','Bir maçta en çok el bitirme',`${eb.n}`,eb.id,'Masaya merhamet gösterilmemiştir.',eb.c.tarih);

    /* en çok silme (tek maçta) */
    let sm=null;
    list.filter(c=>c.giris==='detay').forEach(c=>{
      const say={};
      c.partiler.forEach(p=>p.eller.forEach(el=>(c.oyuncular||[]).forEach(id=>{
        if(el.durum[id]?.silme) say[id]=(say[id]||0)+1; })));
      Object.entries(say).forEach(([id,n])=>{ if(!sm||n>sm.n) sm={n,id,c}; });
    });
    if(sm) ekle('🧹','Bir maçta en çok silme',`${sm.n}`,sm.id,'Hane temizliği ustalığı.',sm.c.tarih);
  }

  /* eş analizi (yalnız Batak) */
  if(oyun==='batak'){
    const es=esSicil().filter(r=>r.g+r.mgl>=2);
    const iyi=es.slice().sort((a,b)=>(b.g-b.mgl)-(a.g-a.mgl))[0];
    const kot=es.slice().sort((a,b)=>(a.g-a.mgl)-(b.g-b.mgl))[0];
    const cok=es.slice().sort((a,b)=>(b.g+b.mgl)-(a.g+a.mgl))[0];
    if(iyi&&iyi.g>iyi.mgl) ekle('🫂','En uyumlu eş',`${iyi.g}–${iyi.mgl}`,[iyi.x,iyi.y],
      'Birbirini gözünden anlamaktadırlar. Masa bu ikilinin ayrılmasını talep etmektedir.');
    if(kot&&kot.mgl>kot.g) ekle('🪦','En uğursuz eş',`${kot.g}–${kot.mgl}`,[kot.x,kot.y],
      'Ayrı ayrı iyi oynarlar; birlikte oynadıklarında masaya ikram ederler.');
    if(cok) ekle('⛓️','En çok eş düşenler',`${cok.g+cok.mgl} maç`,[cok.x,cok.y],
      'Kader birliği. Kurayı kim çekiyorsa soruşturulmalıdır.');
  }

  /* iki oyunda da geçerli */
  const st=istatistik(oyun);
  const v=Object.values(st).filter(p=>p.celse>0);
  const ser=v.filter(p=>p.seriTip==='gal').sort((a,b)=>b.seri-a.seri)[0];
  if(ser&&ser.seri>=2) ekle('🔥','En uzun galibiyet serisi',`${ser.seri} maç`,ser.id,'Hâlen sürmektedir.');
  const has=v.filter(p=>p.seriTip==='hasret').sort((a,b)=>b.seri-a.seri)[0];
  if(has&&has.seri>=2) ekle('📉','En uzun galibiyet hasreti',`${has.seri} maç`,has.id,'Dosya derdesttir.');
  const dev=v.slice().sort((a,b)=>b.celse-a.celse)[0];
  if(dev) ekle('🪑','En çok maç',`${dev.celse}`,
    v.filter(p=>p.celse===dev.celse).map(p=>p.id),'Masanın demirbaşı.');
  return R;
}

function rekorKart(oyun){
  const R=rekorlar(oyun);
  if(!R.length) return `<div class="card"><div class="empty"><div class="big">📖</div>
    Rekor yok.<div class="sm" style="margin-top:6px">Birkaç maç girilince kitap kendiliğinden yazılır.</div></div></div>`;
  return `<div class="card">
    <h3>📖 Rekorlar Kitabı · ${oyun==='batak'?'Batak':'101'}</h3>
    <div class="xs dim" style="margin-bottom:10px">Masanın sayısal efsaneleri. Kırılana kadar geçerlidir.</div>
    <div class="stack">${R.map(r=>`<div class="rozet">
      <div class="k">${r.k}</div>
      <div class="grow" style="min-width:0">
        <div style="font-weight:700;font-size:13px">${esc(r.baslik)}</div>
        <div class="serif" style="font-size:19px;color:var(--gold);line-height:1.2">${esc(String(r.deger))}</div>
        <div class="xs" style="color:var(--ink2)">${esc(unvanAd(r.kim))}${r.tarih?` · ${trh(r.tarih)}`:''}</div>

      <div class="row" style="gap:4px;flex-shrink:0">${unvanAvatar(r.kim,24)}</div>
    </div>`).join('')}</div>

}
function rekorPaylas(oyun){
  const g=aktifGrup()||{ad:'Masa',emoji:''};
  const R=rekorlar(oyun);
  const L=[`${g.emoji||''} ${String(g.ad).toLocaleUpperCase('tr-TR')} — ${oyun==='batak'?'BATAK':'101'} REKORLARI`,''];

}

/* =========================================================
   HAFTALIK ÖZET + EŞ KURASI

/* --------- HAFTA ÖZETİ ---------
   Verilen gün sayısı içindeki celselerden WhatsApp'a yapıştırılacak metin. */
function haftaOzetiUret(gun){
  gun=gun||7;
  const g=aktifGrup()||{ad:'Masa',emoji:''};
  const bitis=new Date(), baslangic=new Date(Date.now()-gun*86400000);
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const b0=iso(baslangic), b1=iso(bitis);

  const list=grupCelseleri().filter(c=>c.tarih>=b0&&c.tarih<=b1)
    .sort((a,b)=>(a.tarih+(a._sira||'')).localeCompare(b.tarih+(b._sira||'')));

  const L=[`${g.emoji||''} ${String(g.ad).toLocaleUpperCase('tr-TR')} — ${gun} GÜNLÜK ÖZET`,
           `${trh(b0)} – ${trh(b1)}`,''];
  if(!list.length){
    L.push('Bu dönemde celse görülmemiştir.');
    L.push('Masanın uzun süre kurulmaması, üyelerin sağlığı bakımından kaygı vericidir.');
    return L.join('\n');
  }

  const bat=list.filter(c=>c.oyun==='batak').length, yz=list.length-bat;
  L.push(`${list.length} celse görülmüştür${bat&&yz?` (${bat} Batak, ${yz} 101)`:(bat?' (Batak)':' (101)')}.`);
  L.push('');

  /* celse dökümü */
  L.push('DÖKÜM:');
  list.forEach(c=>{
    if(c.oyun==='batak'){
      const m=batakMac(c), kz=c.kazanan??m.macKazanan??0;
      L.push(`  ${trh(c.tarih)} · Batak — ${liste(c.takimlar[kz].oyuncular.map(ad))} kazandı`+
             `${(m.gTop[0]||m.gTop[1])?` (${m.gTop[kz]}–${m.gTop[1-kz]})`:''}`);
    }else{
      const sr=yzMac(c).sira;
      L.push(`  ${trh(c.tarih)} · 101 — ${ad(sr[0].id)} birinci, ${ad(sr[sr.length-1].id)} sonuncu`);
    }
  });

  /* dönemin galibi: en çok birincilik */
  const say={};
  list.forEach(c=>{
    if(c.oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) return;
      c.takimlar[kz].oyuncular.forEach(id=>say[id]=(say[id]||0)+1);
    }else{
      const sr=yzMac(c).sira; if(sr.length) say[sr[0].id]=(say[sr[0].id]||0)+1;
    }
  });
  const sirali=Object.entries(say).sort((a,b)=>b[1]-a[1]);
  if(sirali.length){
    const en=sirali[0][1];
    const kimler=sirali.filter(([,n])=>n===en).map(([id])=>ad(id));
    L.push('');
    L.push(`ÜSTÜNLÜK: ${liste(kimler)}, dönem içinde ${en} kez kazanmıştır.`);
  }

  /* dönemin sponsoru: en çok sonuncu/kaybeden */
  const kayip={};
  list.forEach(c=>{
    if(c.oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) return;
      c.takimlar[1-kz].oyuncular.forEach(id=>kayip[id]=(kayip[id]||0)+1);
    }else{
      const sr=yzMac(c).sira; if(sr.length) { const s=sr[sr.length-1].id; kayip[s]=(kayip[s]||0)+1; }
    }
  });
  const ks=Object.entries(kayip).sort((a,b)=>b[1]-a[1]);
  if(ks.length&&ks[0][1]>0){
    const en=ks[0][1];
    L.push(`SPONSORLUK: ${liste(ks.filter(([,n])=>n===en).map(([id])=>ad(id)))} ${en} kez kaybetmiş, masanın masraflarına katkıda bulunmuştur.`);
  }

  /* borç durumu */
  const t=borcTablosu();
  const borclu=Object.entries(t).filter(([,v])=>v<0)
    .map(([k,v])=>{const [id,ne]=k.split('|'); return `${ad(id)} ${Math.abs(v)} ${ne}`;});
  if(borclu.length){
    L.push('');
    L.push(`ZİMMET: ${liste(borclu)}. İfa süresi bir sonraki celseye kadardır.`);
  }

  /* açık iddialar */
  const idd=grupIddialari().filter(i=>i.durum==='acik');
  if(idd.length){
    L.push('');
    L.push(`DERDEST İDDİA: ${idd.length} adet.`);
    idd.slice(0,3).forEach(i=>L.push(`  • ${ad(i.kim)}${i.kime?` ↔ ${ad(i.kime)}`:''}: “${i.metin}”`));
  }

  /* unvan sahipleri */
  ['batak','101'].forEach(oy=>{
    const u=muayyideler(oy);
    const sp=u.find(x=>x.ad==='Masanın Sponsoru');
    const em=u.find(x=>x.ad==='Emsal Karar');
    if(!sp&&!em) return;
    L.push('');
    L.push(`${oy==='batak'?'BATAK':'101'} SİCİLİ: ${em?`${unvanAd(em.kim)} önde`:''}${em&&sp?', ':''}${sp?`${unvanAd(sp.kim)} sponsor`:''}.`);
  });

  L.push('');
  L.push('Bir sonraki celsenin tarihi taraflarca serbestçe belirlenecektir.');
  return L.join('\n');
}

      </div></div>
    <div class="field" style="margin-top:12px"><label class="fl">Gerekçe <span style="text-transform:none;letter-spacing:0">(isteğe bağlı)</span></label>
      <input id="beNot" placeholder="Devir borcu, iddia sonucu..."></div>

    <button class="btn-gh btn-full btn-sm" style="margin-top:8px" onclick="kapatModal()">Vazgeç</button>`);
}
async function borcEkleKaydet(){
  const borclular=[...document.querySelectorAll('#beBorclu .chip.on')].map(e=>e.dataset.id);
  const alacaklilar=[...document.querySelectorAll('#beAlacakli .chip.on')].map(e=>e.dataset.id);
  if(!borclular.length)   return toast('Borçluyu seç',true);
  if(!alacaklilar.length) return toast('Alacaklıyı seç',true);
  if(borclular.some(id=>alacaklilar.includes(id))) return toast('Aynı kişi hem borçlu hem alacaklı olamaz',true);
  const ne=($('#beSerbest').value||'').trim()||document.querySelector('#beNe .chip.on')?.dataset.b||'Cin';
  const adet=Math.max(1,Math.min(20,parseInt($('#beAdet').value,10)||1));
  const not=($('#beNot').value||'').trim();
  const btn=$('#beBtn'); btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>';
  const ok=await borcKaydiYaz({borclular,alacaklilar,ne,adet,aciklama:not});
  if(!ok){ btn.disabled=false; btn.textContent='Hesaba Geçir'; return; }
  kapatModal(); render();
  toast(`${liste(borclular.map(ad))} → ${liste(alacaklilar.map(ad))}: ${adet} ${ne}`,true);
}
async function borcKaydiYaz(k){
  const metin=`ZİMMET: ${liste(k.borclular.map(ad))}, ${liste(k.alacaklilar.map(ad))} lehine `+
    `${k.adet} ${k.ne} borçlu kaydedilmiştir.${k.aciklama?' '+k.aciklama:''}`;
  return await akisEkle('mesaj',metin,{borcKaydi:k});
}

  if(!kurucuMu()) return toast('Bunu yalnız grubu kuran yapabilir',true);

  try{ d=await fetch('kurulum/devir.json',{cache:'no-store'}).then(r=>r.json()); }
  catch(e){ return toast('Devir dosyası okunamadı',true); }
  const mac=(d.maclar||[]), borc=(d.borclar||[]);
  const eksik=new Set();
  [...mac.flatMap(m=>[...(m.A||[]),...(m.B||[])]),
   ...borc.flatMap(b=>[...(b.borclular||[]),...(b.alacaklilar||[])])]

  acModal(`<h2 class="serif" style="margin:0 0 4px">Devir Kayıtları</h2>
    <div class="xs dim" style="margin-bottom:12px">Uygulamadan önceki dönemden aktarılacak kayıtlar.

    ${borc.length?`<div class="card tight" style="margin:0 0 10px;background:var(--panel2)">
      <div class="xs" style="font-weight:700;color:#DD8A8A;margin-bottom:6px">BORÇLAR (${borc.length})</div>
      ${borc.map(b=>`<div class="sm" style="padding:3px 0">${esc((b.borclular||[]).join(' & '))}
        → ${esc((b.alacaklilar||[]).join(' & '))} · <b>${b.adet} ${esc(b.ne)}</b></div>`).join('')}
    </div>`:''}
    ${eksik.size?`<div class="uyari" style="margin-bottom:10px">⚠️ Kadroda bulunamayan isimler:
      <b>${esc([...eksik].join(', '))}</b>. Bunlar eklenmeden devir işlenemez.
      ${kurucuMu()?`<button class="btn-sm btn-b btn-full" style="margin-top:9px" onclick="kapatModal();kadroSor()">
        ⚡ Kadroyu Tamamla (${esc([...eksik].join(', '))})</button>`
       :'<div class="xs" style="margin-top:6px">Masayı kuran eklemeli.</div>'}</div>`:''}
    <button class="btn-p btn-full" id="dvBtn" ${eksik.size?'disabled':''} onclick="devirYukle()">Devri İşle</button>
    <button class="btn-gh btn-full btn-sm" style="margin-top:8px" onclick="kapatModal()">Vazgeç</button>`);
}

async function devirYukle(){
  const btn=$('#dvBtn'); if(btn){btn.disabled=true;}
  let macN=0, borcN=0, hata=0;
  try{
    const d=await fetch('kurulum/devir.json',{cache:'no-store'}).then(r=>r.json());

    /* maçlar */
    for(const m of (d.maclar||[])){
      if(btn) btn.innerHTML=`<span class="yukleniyor"></span> maç ${macN+1}`;
      const A=(m.A||[]).map(n=>adaGoreOyuncu(n)?.id).filter(Boolean);
      const B=(m.B||[]).map(n=>adaGoreOyuncu(n)?.id).filter(Boolean);
      if(A.length!==2||B.length!==2){ hata++; continue; }
      /* zaten yüklenmiş mi? aynı tarih + aynı kadro */
      const varMi=DB.celseler.some(c=>c.tarih===m.tarih&&c.oyun==='batak'&&c.takimlar&&
        c.takimlar.some(t=>t.oyuncular.every(id=>A.includes(id))));
      if(varMi) continue;
      const kz=(Number(m.puanA)||0)>=(Number(m.puanB)||0)?0:1;
      const c={oyun:'batak',giris:'hizli',masaAd:'Devir',tarih:m.tarih,yer:m.yer||'',
        tabelaci:DB.ben||A[0],partiHedef:2,not:m.not||'',bahis:m.bahis||{ne:'Onur',adet:1},
        takimlar:[{ad:'A',oyuncular:A},{ad:'B',oyuncular:B}],
        hizli:{partiSkor:[Number(m.partiA)||(kz===0?2:0),Number(m.partiB)||(kz===1?2:0)],
               puan:[Number(m.puanA)||0,Number(m.puanB)||0]},
        kazanan:kz,partiler:[{eller:[],kazanan:null}]};
      c.zabit=zabitUret(c);
      const {data,error}=await sb.from('maclar').insert({
        masa_id:DB.aktifGrup,oyun:'batak',giris:'hizli',tarih:m.tarih,yer:m.yer||null,
        tabelaci_id:OTURUM.id,parti_hedef:2,celse:JSON.parse(JSON.stringify(c)),bitti:true,
        kazanan:kz,zabit:c.zabit,aciklama:c.not||null}).select('id,olusturma').single();
      if(error){ hata++; continue; }
      Object.assign(c,{id:data.id,grupId:DB.aktifGrup,bitti:true,_hesap:OTURUM.id,_sira:data.olusturma});
      DB.celseler.push(c); macN++;
    }

    /* borçlar */
    for(const b of (d.borclar||[])){
      if(btn) btn.innerHTML=`<span class="yukleniyor"></span> borç ${borcN+1}`;
      const bl=(b.borclular||[]).map(n=>adaGoreOyuncu(n)?.id).filter(Boolean);
      const al=(b.alacaklilar||[]).map(n=>adaGoreOyuncu(n)?.id).filter(Boolean);
      if(!bl.length||!al.length){ hata++; continue; }
      const zaten=(DB.akis||[]).some(a=>{
        const k=a.veri&&a.veri.borcKaydi;
        return k&&k.ne===b.ne&&(k.borclular||[]).length===bl.length&&
               (k.borclular||[]).every(id=>bl.includes(id));
      });
      if(zaten) continue;
      const ok=await borcKaydiYaz({borclular:bl,alacaklilar:al,ne:b.ne,
        adet:Number(b.adet)||1,aciklama:b.aciklama||'Devir borcu.'});
      if(ok) borcN++; else hata++;
    }
  }catch(e){ toast(hataMetni(e),true); }
  await verileriGetir(); kapatModal(); render();
  toast(hata?`${macN} maç, ${borcN} borç işlendi · ${hata} kayıt olmadı`
            :`Devir işlendi: ${macN} maç, ${borcN} borç kaydı.`,true);
}
