      <div class="xs muted">${esc(o.skor)}${o.alt?' · '+esc(o.alt):''} · ${yazilanEl(c)} el</div>
      ${t.not?`<div class="xs dim" style="margin-top:4px">“${esc(t.not)}”</div>`:''}
    </div>
    <button class="btn-sm ${benim?'btn-g':''}" onclick="${benim?`talikDevam('${c.id}')`:`macSec('${c.id}')`}">${benim?'▶️ Devam':'Gör'}</button>
  </div>`;
}

//== talikZabitNotu
/* Maç sonunda zabta düşen satır: kaç kez ara verilmiş */
function talikZabitNotu(c){
  /* Maç askıdayken bitirilmişse o ara da sayılır */
  const g=(c.talikGecmisi||[]).concat(c.talik?[c.talik]:[]);
  if(!g.length) return '';
  const gunler=[...new Set(g.map(x=>x.tarih))];
  const sebepler=g.map(x=>x.not).filter(Boolean);
  if(g.length===1)
    return `Celse bir kez talik edilmiştir (${trh(g[0].tarih)}${g[0].saat?' '+g[0].saat:''})`
         + `${sebepler.length?`, gerekçe: ${sebepler[0]}`:''}. Maç aynı tabela üzerinde tamamlanmıştır.`;
  return `Celse ${g.length} kez talik edilmiş, ${gunler.length} güne yayılmıştır`
       + `${sebepler.length?` (${liste(sebepler)})`:''}. `
       + `Tabelanın bu süre boyunca korunmuş olması takdirle karşılanmıştır.`;
}

//== dayanikli
/* =========================================================
   YAZMANIN DAYANIKLILIĞI

   Soru (kullanıcı, 02.09.2026): "Bir saat sürecek bir parti; en son
   'kaydet' dediğimde ne olur, zaman aşımına uğrar mı? Yoksa el girdikçe
   mi kaydetsin?"

   Cevap: el girdikçe kaydediyor, "en son kaydet" diye bir şey yok.
   Her hücre değişiminde kaydet() çağrılıyor, 450 ms bekleyip maçı
   buluta yazıyor. Oturum anahtarı da kendini yeniliyor
   (autoRefreshToken), yani bir saat de sürse üç saat de sürse
   zaman aşımı olmuyor.

   ASIL RİSK BAŞKAYDI: yazma BAŞARISIZ olursa eskiden ekranda iki
   saniyelik bir uyarı çıkıyor, sonra hiçbir şey olmuyordu. Parkverde'de
   internet bir dakika giderse o eller yalnız tarayıcının belleğinde
   kalıyor; sekme kapanınca gidiyordu. Bu dosya onu kapatıyor:

     1) YEREL AYNA — her yazma denemesinden ÖNCE tabela localStorage'a
        kopyalanıyor. Sekme kapansa, telefon kilitlense, uygulama
        çökse bile duruyor.
     2) BIKMAYAN YENİDEN DENEME — yazma başarısızsa 2·5·10·20·30 sn
        aralıklarla, bağlantı gelene kadar deniyor. Ayrıca internet
        geri geldiğinde (online olayı) hemen deniyor.
     3) GÖRÜNÜR UYARI — geçici bildirim yerine ekranın altında duran
        kırmızı şerit: "N eldir buluta yazılamıyor". Yazılınca yeşile
        dönüp "hh:mm'de kaydedildi" diyor.
     4) SEKME KAPATMA KORUMASI — yazılmamış el varsa tarayıcı "çıkmak
        istediğine emin misin?" diye soruyor.
     5) AÇILIŞTA KURTARMA — bir maçı açarken yerel aynada buluttakinden
        FAZLA el varsa (yani kaydedilemeyen eller varsa) uyarıyor ve
        tek dokunuşla buluta yazıyor.
   ========================================================= */

const AYNA_ON = 'kkd_celse_';
const YENIDEN = [2000, 5000, 10000, 20000, 30000];   // sn: 2, 5, 10, 20, 30…

let _yazHata = 0;          // üst üste kaçıncı başarısızlık
let _yazTimer = null;      // yeniden deneme zamanlayıcısı
let _sonYazma = null;      // son başarılı yazmanın saati
let _aynaBekleyen = 0;     // aynada duran ama yazılamamış el sayısı

const elSay = c => (c?.partiler || []).reduce((t, p) => t + ((p.eller || []).length), 0);

/* ---------------- yerel ayna ---------------- */
function aynaYaz(c) {
  if (!c?.id) return;
  try {
    localStorage.setItem(AYNA_ON + c.id, JSON.stringify({
      celse: aktifBelge(c), el: elSay(c), zaman: Date.now(), grupId: c.grupId
    }));
  } catch (e) { /* kota dolduysa yapacak bir şey yok, bulut zaten asıl yer */ }
}
function aynaOku(id) {
  try { return JSON.parse(localStorage.getItem(AYNA_ON + id) || 'null'); }
  catch (e) { return null; }
}
function aynaSil(id) {
  try { localStorage.removeItem(AYNA_ON + id); } catch (e) {}
}
/* Kapanmış maçların aynaları birikmesin */
function aynaTemizle() {
  try {
    const acikIdler = (DB.acik || []).map(c => c.id);
    Object.keys(localStorage).filter(k => k.startsWith(AYNA_ON)).forEach(k => {
      if (!acikIdler.includes(k.slice(AYNA_ON.length))) localStorage.removeItem(k);
    });
  } catch (e) {}
}

/* ---------------- görünür şerit ---------------- */
function yazSeridi(durum, metin) {
  let n = document.getElementById('yazSerit');
  if (!durum) { if (n) n.remove(); return; }
  if (!n) {
    n = document.createElement('div');
    n.id = 'yazSerit';
    n.style.cssText = 'position:fixed;left:10px;right:10px;bottom:calc(var(--tab-h,62px) + 10px);'
      + 'z-index:60;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.45;'
      + 'text-align:center;border:1px solid;backdrop-filter:blur(6px)';
    document.body.appendChild(n);
  }
  const renk = durum === 'hata'
    ? { a: 'rgba(120,42,42,.92)', b: '#E8B4B4', c: '#8C3A3A' }
    : { a: 'rgba(30,58,38,.92)', b: '#9BD0AA', c: '#2E5A3A' };
  n.style.background = renk.a; n.style.color = renk.b; n.style.borderColor = renk.c;
  n.innerHTML = metin;
  if (durum === 'ok') { clearTimeout(n._z); n._z = setTimeout(() => n.remove(), 2600); }
}

const saatKisa = t => {
  const d = new Date(t);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};

/* ---------------- yazma ---------------- */
/* kaydet() bunu çağırıyor: ayna + gecikmeli bulut yazması */
function celseKaydet() {
  const c = DB.aktif;
  if (!c) return;
  aynaYaz(c);
  _bekleyenYazi = true; yazIsigi();
  clearTimeout(_yazZaman);
  _yazZaman = setTimeout(celseYaz, 450);
}

function celseYaz() {
  const c = DB.aktif;
  if (!c || !tabelaciMiyim()) { _bekleyenYazi = false; yazIsigi(); return _yazSira; }
  clearTimeout(_yazTimer);

  _yazSira = _yazSira.then(async () => {
    const { error } = await sb.from('maclar').update({
      celse: aktifBelge(c), tarih: c.tarih || bugun(),
      parti_hedef: Math.min(5, Math.max(1, c.partiHedef || 1)),
      giris: c.giris, yer: c.yer || null
    }).eq('id', c.id);
    if (error) throw error;
  }).then(() => {
    _yazHata = 0; _aynaBekleyen = 0; _sonYazma = Date.now();
    aynaSil(c.id);
    _bekleyenYazi = false; yazIsigi();
    yazSeridi('ok', `✓ ${saatKisa(_sonYazma)} · tabela buluta yazıldı`);
  }).catch(e => {
    /* Yazılamadı: ayna duruyor, bıkmadan yeniden dene */
    _yazHata++;
    _aynaBekleyen = elSay(c);
    _bekleyenYazi = true; yazIsigi();
    const bekle = YENIDEN[Math.min(_yazHata - 1, YENIDEN.length - 1)];
    yazSeridi('hata',
      `⚠️ <b>Buluta yazılamıyor</b> — ${_aynaBekleyen} el bu cihazda bekliyor.<br>`
      + `<span style="opacity:.85">${Math.round(bekle / 1000)} sn sonra yine denenecek. `
      + `Sayfayı kapatmazsan hiçbir şey kaybolmaz.</span> `
      + `<b style="text-decoration:underline;cursor:pointer" onclick="celseYaz()">şimdi dene</b>`);
    clearTimeout(_yazTimer);
    _yazTimer = setTimeout(celseYaz, bekle);
    if (_yazHata === 1) toast('Bulut yazılamadı — cihazda saklandı, denemeye devam ediyor', true);
  });
  return _yazSira;
}

/* İnternet geri geldiğinde beklemeden dene */
addEventListener('online', () => { if (_yazHata) celseYaz(); });
/* Uygulamaya dönünce de dene (mobilde sekme uykuya yatıyor) */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && _yazHata) celseYaz();
});

/* Yazılmamış el varken sekmeyi kapatmaya kalkarsa uyar */
addEventListener('beforeunload', e => {
  if (_yazHata && _aynaBekleyen) { e.preventDefault(); e.returnValue = ''; return ''; }
});

/* ---------------- açılışta kurtarma ---------------- */
/* Bir maçı açarken aynada buluttakinden fazla el varsa kaydedilemeyen
   eller var demektir. Sessizce üzerine yazmak yanlış olur (belki başka
   biri devam etti); kullanıcıya sorup öyle yazıyoruz. */
function kurtarmaKontrol(c) {
  if (!c || c._hesap !== OTURUM?.id) return '';
  const a = aynaOku(c.id);
  if (!a || a.el <= elSay(c)) return '';
  return `<div class="card" style="border-color:#8C3A3A;background:var(--panel2)">
    <div class="row" style="gap:10px;align-items:flex-start">
      <div style="font-size:22px;flex-shrink:0">⚠️</div>
      <div class="grow" style="min-width:0">
        <div class="serif" style="font-size:16px;color:#E8B4B4">Kaydedilemeyen eller var</div>
        <div class="xs dim" style="margin-top:4px">Bu cihazda <b>${a.el} el</b> duruyor,
          bulutta <b>${elSay(c)} el</b> var. Muhtemelen internet kesilmişti.
          ${a.zaman ? `Cihazdaki kayıt ${saatKisa(a.zaman)} tarihli.` : ''}</div>
      </div>
    </div>
    <button class="btn-g btn-full" style="margin-top:11px" onclick="kurtarmaYaz('${c.id}')">
      ⬆️ Cihazdakini buluta yaz (${a.el} el)</button>
    <button class="btn-gh btn-full btn-sm" style="margin-top:7px" onclick="kurtarmaAt('${c.id}')">
      Cihazdakini at, buluttaki geçerli olsun</button>
  </div>`;
}
async function kurtarmaYaz(id) {
  const c = DB.acik.find(x => x.id === id); if (!c) return;
  const a = aynaOku(id); if (!a?.celse) return toast('Cihazdaki kayıt okunamadı', true);
  Object.assign(c, a.celse);
  if (DB.aktif?.id === id) DB.aktif = c;
  await celseYaz();
  render(); toast(`${a.el} el buluta yazıldı`, true);
}
function kurtarmaAt(id) {
  if (!confirm('Cihazdaki eller silinecek, buluttaki tabela geçerli olacak. Emin misin?')) return;
  aynaSil(id); render(); toast('Cihazdaki kopya atıldı');
}

//== misafir
/* =========================================================
   MİSAFİR TABELACI — WhatsApp linkiyle sonuç girme

   İstek (kullanıcı, 02.09.2026): "Maç sonuçlarını açacağız ya, onu
   WhatsApp'tan da paylaşayım, oradan da yazsınlar; dışarıdan yazan da
   adını yazıp girsin sonuçları."

   AKIŞ
     Tabelacı  → 📱 WhatsApp'a At → link üretilir, mesaj hazırlanır
     Misafir   → linke tıklar → adını yazar → tabelayı yazar

   GÜVENLİK — kural veritabanında, burada değil (yama 09)
     · Misafirin RLS'i açılmadı. Üç kapı var, hepsi security definer:
         misafir_katil(kod, ad) · misafir_mac(kod) · misafir_celse_yaz(...)
     · misafir_celse_yaz YALNIZ celse alanını yazar. Maçı bitiremez,
       zabıt üretemez, tabelacıyı değiştiremez, silemez.
     · Grubun arşivini, öteki maçları, akışı, borçları, tahminleri
       GÖRMEZ. Yalnız o maçı ve o masanın oyuncu adlarını görür.
     · Link maç kapanınca ölür; tabelacı "misafir yazmayı kapat"
       deyince de o an ölür.
     · Anonim oturum masa kuramaz, gruba katılamaz, akışa yazamaz
       (yama 09'daki anonim_mi() kilitleri).
     · AÇIK RİSK: link iletilebilir. Linki gören herkes maç açıkken
       tabelaya yazabilir. Ekranda da bunu yazıyoruz; kapatma düğmesi
       tabelacının elinde.

   AD → OYUNCU: misafirin yazdığı ad kadroda varsa O OYUNCUYA
   bağlanıyor (sicili bölünmesin), yoksa o adla yeni oyuncu açılıyor.
   Eşleşmeyi sunucu yapıyor (misafir_katil); burada yalnız sonucunu
   gösteriyoruz.

   ÇAKIŞMA: JSONB tek parça yazıldığı için iki kişi aynı anda yazarsa
   biri diğerini ezerdi. Sunucu el sayısını karşılaştırıyor; eksik
   tabela reddediliyor, istemci tazeleyip uyarıyor.
   ========================================================= */

let MISAFIR = null;          // {kod, ad, macId, elBeklenen, oyuncuId, yeniActi}
let _misafirZaman = null;    // gecikmeli yazma
let _misafirNabiz = null;    // düzenli tazeleme

/* ---------- linkten kodu oku ---------- */
function misafirOku() {
  try {
    const k = new URL(location.href).searchParams.get('misafir');
    if (!k) return null;
    /* Sayfa yenilenince kaybolmasın (davet linkindeki ile aynı dert) */
    localStorage.setItem('kkd_misafir', k);
    return k;
  } catch (e) { return null; }
}
const misafirKodu = () => {
  try { return misafirOku() || localStorage.getItem('kkd_misafir') || null; }
  catch (e) { return null; }
};
function misafirBirak() {
  try { localStorage.removeItem('kkd_misafir'); } catch (e) {}
  MISAFIR = null;
  clearInterval(_misafirNabiz);
  location.href = location.origin + location.pathname;
}

/* ---------- misafirin adını sorduğumuz ekran ---------- */
function misafirGirisEkrani(kod, hata) {
  const eskiAd = (() => { try { return localStorage.getItem('kkd_misafir_ad') || ''; } catch (e) { return ''; } })();
  return `<div class="orta"><div style="max-width:400px;margin:0 auto;width:100%">
    <div class="center" style="margin-bottom:18px">
      <div style="font-size:40px">🂡</div>
      <div class="serif" style="font-size:22px;margin-top:6px">Misafir Tabelacı</div>
      <div class="xs dim" style="margin-top:5px">Bu linkle <b>tek bir masanın</b> tabelasını yazabilirsin.</div>
    </div>

    <div class="card">
      ${hata ? `<div class="uyari" style="margin-bottom:12px;border-color:#8C3A3A;color:#E8B4B4">${esc(hata)}</div>` : ''}
      <div class="field"><label class="fl">Adın</label>
        <input id="msAd" maxlength="24" value="${esc(eskiAd)}" placeholder="Ufuk"
          onkeydown="if(event.key==='Enter')misafirKatil()">
        <div class="xs dim" style="margin-top:6px">Yazdığın ad tabelada ve zabıtta böyle görünecek.
          Hesap açmıyorsun, şifre yok.</div></div>
      <button class="btn-p btn-full" id="msBtn" style="margin-top:12px" onclick="misafirKatil()">Masaya Otur</button>
    </div>

    <div class="card tight xs dim">
      Bu link sana <b>yalnız o maçın tabelasını</b> açar. Grubun arşivini, öteki masaları,
      sohbeti ve borçları görmezsin; maçı bitiremez, zabıt üretemezsin.
      Masa kapanınca link kendiliğinden ölür.
    </div>
  </div></div>`;
}

/* ---------- katılma ---------- */
async function misafirKatil() {
  const kod = misafirKodu();
  const ad2 = ($('#msAd')?.value || '').trim();
  if (!ad2) return toast('Adını yaz', true);
  const btn = $('#msBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="yukleniyor"></span>'; }
  try { localStorage.setItem('kkd_misafir_ad', ad2); } catch (e) {}

  try {
    /* Hesabı olmayan kişi için anonim oturum. Panelde "Anonymous
       sign-ins" kapalıysa Supabase burada hata döner; mesajı olduğu
       gibi gösteriyoruz ki sebep anlaşılsın. */
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      const { error } = await sb.auth.signInAnonymously();
      if (error) throw error;
    }
    const { data, error } = await sb.rpc('misafir_katil', { p_kod: kod, p_ad: ad2 });
    if (error) throw error;
    MISAFIR = { kod, ad: ad2, macId: data.mac.id, elBeklenen: data.mac.el_sayisi };
    misafirPencereKur(data);
    DURUM = 'misafir';
    misafirNabizKur();
    render(); window.scrollTo(0, 0);
    /* Sunucu adı kadroda buldu mu, yeni mi açtı? */
    toast(MISAFIR.yeniActi
      ? `Hoş geldin ${ad2} — bu adla kadroya yeni eklendin`
      : `Hoş geldin ${ad2} — kadrodaki kaydına bağlandın`, true);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Masaya Otur'; }
    const m = hataMetni(e);
    if (/anonymous|disabled|signups/i.test(m))
      return toast('Misafir girişi Supabase panelinde açık değil — masayı kuran açmalı', true);
    toast(m, true);
  }
}

/* ---------- sunucudan gelen pencereyi DB'ye oturt ----------
   Tabela çizicileri DB üzerinden çalışıyor; misafir için DB'nin
   yalnız o maça ait küçük bir kopyasını kuruyoruz. */
function misafirPencereKur(p) {
  const m = p.mac;
  DB.oyuncular = (p.oyuncular || []).map(o => ({
    id: o.id, ad: o.ad, renk: o.renk || '#C9A227', fotoUrl: o.foto_url || null,
    masaId: m.masa_id, profilId: null, aktif: true
  }));
  DB.ayar = Object.assign(JSON.parse(JSON.stringify(VARSAYILAN_AYAR)), p.ayar || {});
  DB.gruplar = [{ id: m.masa_id, ad: m.masa_ad || 'Masa', emoji: '🍀', kod: '', kuran: null, rol: 'misafir', uyeler: DB.oyuncular.map(o => o.id), ayar: DB.ayar }];
  DB.aktifGrup = m.masa_id;
  DB.celseler = []; DB.akis = []; DB.iddialar = [];
  DB.haftalar = []; DB.karsilasmalar = []; DB.tahminler = []; DB.odemeler = [];
  UYELIKLER = []; MASA_UYELERI = []; BEKLEYENLER = [];
  DB.ben = null;

  const c = Object.assign({}, m.celse || {}, {
    id: m.id, grupId: m.masa_id, bitti: m.bitti,
    oyun: m.oyun, giris: m.giris, mod: m.mod, tarih: m.tarih, yer: m.yer,
    partiHedef: m.parti_hedef
  });
  if (!Array.isArray(c.partiler) || !c.partiler.length) c.partiler = [{ eller: [], kazanan: null }];
  DB.acik = [c]; DB.aktif = c; SECILI_MAC = c.id;
  MISAFIRLER = (p.misafirler || []).map(x => x.ad);
  if (MISAFIR) {
    MISAFIR.elBeklenen = m.el_sayisi;
    MISAFIR.oyuncuId = p.ben?.oyuncu_id || null;
    MISAFIR.yeniActi = !!p.ben?.yeni_acti;
    if (p.ben?.ad) MISAFIR.ad = p.ben.ad;
  }
}
let MISAFIRLER = [];

/* ---------- misafirin ekranı ---------- */
function misafirEkran() {
  const c = DB.aktif;
  if (!c) return misafirGirisEkrani(misafirKodu(), 'Masa okunamadı.');
  if (c.bitti) return `<div class="card"><div class="empty">
    <div class="big">✔️</div>
    <div class="serif" style="font-size:17px;color:var(--ink)">Masa kapandı</div>
    <div class="sm" style="margin-top:8px">Bu maç bitirilmiş; tabela artık yazılamıyor.</div>
    <button class="btn-gh" style="margin-top:14px" onclick="misafirBirak()">Çık</button></div></div>`;

  const tabela = c.giris === 'hizli'
    ? (c.oyun === 'batak' ? batakTabela() : yzTabela())
    : (c.oyun === 'batak' ? aktifBatak() : aktifYz());

  /* Bağlandığım oyuncu bu masada oturuyor mu? Oturmuyorsa tabelayı
     başkası adına yazıyorum demektir; bunu söylemek gerekiyor. */
  /* oy() bulamayinca {ad:'?'} donduruyor; gercekten kadroda olani ariyoruz. */
  const benOyn = MISAFIR?.oyuncuId
    ? (DB.oyuncular.find(o => o.id === MISAFIR.oyuncuId) || null) : null;
  const benAd = benOyn?.ad || MISAFIR?.ad || 'Misafir';
  const masada = benOyn ? macOyunculari(c).includes(benOyn.id) : false;

  return `
  <div class="card tight" style="border-color:var(--gold)">
    <div class="row" style="gap:9px">
      ${benOyn ? avatar(benOyn.id, 34) : '<div style="font-size:20px;flex-shrink:0">📱</div>'}
      <div class="grow" style="min-width:0">
        <div class="sm" style="font-weight:700">${esc(MISAFIR?.ad || '')}
          <span class="xs dim" style="font-weight:500">· misafir tabelacı</span></div>
        <div class="xs dim">${esc(DB.gruplar[0]?.ad || 'Masa')} · ${c.oyun === 'batak' ? 'Batak' : '101'}
          ${MISAFIRLER.length > 1 ? ` · masada ${MISAFIRLER.length} misafir` : ''}</div>
      </div>
      <button class="btn-xs btn-gh" style="flex-shrink:0" onclick="misafirTazele(true)">↻</button>
    </div>
    <div class="xs dim" style="margin-top:8px">${

/* ---------- misafirin yazması ---------- */
function misafirKaydet() {
  _bekleyenYazi = true; yazIsigi();
  clearTimeout(_misafirZaman);
  _misafirZaman = setTimeout(misafirYaz, 500);
}
async function misafirYaz() {
  const c = DB.aktif; if (!c || !MISAFIR) return;
  aynaYaz(c);
  try {
    const { data, error } = await sb.rpc('misafir_celse_yaz', {
      p_kod: MISAFIR.kod, p_celse: aktifBelge(c), p_beklenen_el: MISAFIR.elBeklenen
    });
    if (error) throw error;
    MISAFIR.elBeklenen = data.mac.el_sayisi;
    aynaSil(c.id);
    _bekleyenYazi = false; yazIsigi();
    yazSeridi('ok', `✓ ${saatKisa(Date.now())} · masaya yazıldı`);
  } catch (e) {
    const m = hataMetni(e);
    _bekleyenYazi = false; yazIsigi();
    if (/CAKISMA/i.test(m)) {
      yazSeridi('hata', '⚠️ <b>Bu arada masaya başka biri yazdı</b><br>'
        + '<span style="opacity:.85">Ekran güncellendi; kendi elini tekrar yaz.</span>');
      return misafirTazele(true);
    }
    if (/yetkin yok|kapat/i.test(m)) {
      yazSeridi('hata', '⚠️ <b>Misafir yazma kapatıldı</b><br><span style="opacity:.85">Tabelacı linki iptal etti.</span>');
      return misafirTazele(true);
    }
    yazSeridi('hata', `⚠️ <b>Yazılamadı</b> — ${esc(m)}<br>`
      + '<b style="text-decoration:underline;cursor:pointer" onclick="misafirYaz()">şimdi dene</b>');
  }
}

/* ---------- tazeleme ---------- */
async function misafirTazele(gorunur) {
  if (!MISAFIR) return;
  if (_bekleyenYazi) return;                 // kendi yazımız beklerken ezme
  try {
    const { data, error } = await sb.rpc('misafir_mac', { p_kod: MISAFIR.kod });
    if (error) throw error;
    misafirPencereKur(data);
    render();
    if (gorunur) toast('Tabela güncellendi');
  } catch (e) {
    if (gorunur) toast(hataMetni(e), true);
  }
}
function misafirNabizKur() {
  clearInterval(_misafirNabiz);
  /* Misafirde canlı yayın (realtime) yok — RLS kapalı olduğu için
     abone olamıyor. Beş saniyede bir soruyor; kâğıt oyunu için yeter. */
  _misafirNabiz = setInterval(() => {
    if (!document.hidden) misafirTazele(false);
  }, 5000);
}

/* =========================================================
   REKORLAR KİTABI — masanın sayısal efsaneleri
   Efsaneler hikâyeyi, bu sayfa rakamı tutar.
   ========================================================= */
function rekorlar(oyun){
  const R=[];
  const list=grupCelseleri().filter(c=>c.oyun===oyun);
  if(!list.length) return R;
  const ekle=(k,baslik,deger,kim,not,tarih)=>{
    if(deger==null) return;
    R.push({k,baslik,deger,kim:Array.isArray(kim)?kim:[kim],not,tarih});
  };

  if(oyun==='batak'){
    /* en ağır fark: maç toplam puan farkı */
    let f=null;
    list.forEach(c=>{
      const m=batakMac(c), kz=c.kazanan??m.macKazanan??0;
      const d=m.gTop[kz]-m.gTop[1-kz];
      if(!(m.gTop[0]||m.gTop[1])) return;                 // puan yazılmamış
      if(!f||d>f.d) f={d,c,kz,kazandi:m.gTop[kz],kaybetti:m.gTop[1-kz]};
    });
    if(f) ekle('💣','En ağır fark',`${f.kazandi} – ${f.kaybetti}`,
      f.c.takimlar[f.kz].oyuncular,
      `${liste(f.c.takimlar[1-f.kz].oyuncular.map(ad))} karşısında. Aradaki ${f.d} puanlık uçurum `+
      `${f.kaybetti<0?'karşı tarafın EKSİDE bitirmesiyle':'tek celsede'} oluşmuş; `+
      `sonuç dillere destan olmuş, bugüne kadar aşılamamıştır. `+
      `Kaybeden tarafın "kağıt gelmedi" savunması reddedilmiştir.`,f.c.tarih);

    /* en ağır batak: ihale - alınan */
    let b=null;
    list.forEach(c=>batakTumEller(c).forEach(el=>{
      const d=el.ihale-el.alinan;
      if(d>0&&(!b||d>b.d)) b={d,el,c};
    }));
    if(b) ekle('🕳️','En ağır batak',`${b.el.ihale} ihale · ${b.el.alinan} el`,
      b.c.takimlar[b.el.ihaleTakim].oyuncular,
      `${b.d} el eksik. "Az kalmıştı" savunması dinlenmemiştir.`,b.c.tarih);

    /* en yüksek ihale (tutan) */
    let y=null;
    list.forEach(c=>batakTumEller(c).forEach(el=>{
      if(el.alinan>=el.ihale&&(!y||el.ihale>y.el.ihale)) y={el,c};
    }));
    if(y) ekle('🎯','Tutturulan en yüksek ihale',`${y.el.ihale}`,
      y.c.takimlar[y.el.ihaleTakim].oyuncular,'Beyanın arkasında durulmuştur.',y.c.tarih);

    /* şlem sayısı */
    const st=istatistik('batak');
    const sl=Object.values(st).filter(p=>p.slem>0).sort((a,b)=>b.slem-a.slem);
    if(sl.length) ekle('🧨','En çok şlem',`${sl[0].slem}`,
      sl.filter(p=>p.slem===sl[0].slem).map(p=>p.id),'Masaya tek el bırakmama sanatı.');

    /* tek partide en yüksek puan */
    let tp=null;
    list.filter(c=>c.giris==='detay').forEach(c=>c.partiler.forEach(p=>{
      const {top}=batakPartiToplam(p);
      [0,1].forEach(i=>{ if(!tp||top[i]>tp.v) tp={v:top[i],c,ti:i}; });
    }));
    if(tp&&tp.v>0) ekle('🚀','Tek partide en yüksek puan',`${tp.v}`,
      tp.c.takimlar[tp.ti].oyuncular,'Hedef aşılmıştır.',tp.c.tarih);
  }else{
    /* tek elde en ağır ceza */
    let a=null;
    list.forEach(c=>(c.partiler||[]).forEach(p=>(p.eller||[]).forEach(el=>{
      (c.oyuncular||[]).forEach(id=>{
        const v=yzElPuan(el,id);
        if(v>0&&(!a||v>a.v)) a={v,id,c};
      });
    })));
    if(a) ekle('🐢','Tek elde en ağır ceza',`+${a.v}`,a.id,'Rekor kendisindedir.',a.c.tarih);

    /* maç sonu en yüksek (kötü) ve en düşük (iyi) toplam */
    let en=null,az=null;
    list.forEach(c=>{
      const sr=yzMac(c).sira;
      if(!sr.length) return;
      const s=sr[sr.length-1], i=sr[0];
      if(s.puan!=null&&(!en||s.puan>en.v)) en={v:s.puan,id:s.id,c};
      if(i.puan!=null&&(!az||i.puan<az.v)) az={v:i.puan,id:i.id,c};
    });
    if(en) ekle('💸','Maç sonu en yüksek ceza',`${en.v}`,en.id,'Masayı fiilen finanse etmiştir.',en.c.tarih);
    if(az) ekle('🧊','Maç sonu en düşük puan',`${az.v}`,az.id,'Kusursuz icra.',az.c.tarih);

    /* en çok el bitirme (tek maçta) */
    let eb=null;
    list.filter(c=>c.giris==='detay').forEach(c=>{
      const say={};
      c.partiler.forEach(p=>p.eller.forEach(el=>(c.oyuncular||[]).forEach(id=>{
        if(el.durum[id]?.tip==='bitirdi') say[id]=(say[id]||0)+1; })));
      Object.entries(say).forEach(([id,n])=>{ if(!eb||n>eb.n) eb={n,id,c}; });
    });
    if(eb) ekle('✂️','Bir maçta en çok el bitirme',`${eb.n}`,eb.id,'Masaya merhamet gösterilmemiştir.',eb.c.tarih);

    /* en çok silme (tek maçta) */
    let sm=null;
    list.filter(c=>c.giris==='detay').forEach(c=>{
      const say={};
      c.partiler.forEach(p=>p.eller.forEach(el=>(c.oyuncular||[]).forEach(id=>{
        if(el.durum[id]?.silme) say[id]=(say[id]||0)+1; })));
      Object.entries(say).forEach(([id,n])=>{ if(!sm||n>sm.n) sm={n,id,c}; });
    });
    if(sm) ekle('🧹','Bir maçta en çok silme',`${sm.n}`,sm.id,'Hane temizliği ustalığı.',sm.c.tarih);
  }

  /* eş analizi (yalnız Batak) */
  if(oyun==='batak'){
    const es=esSicil().filter(r=>r.g+r.mgl>=2);
    const iyi=es.slice().sort((a,b)=>(b.g-b.mgl)-(a.g-a.mgl))[0];
    const kot=es.slice().sort((a,b)=>(a.g-a.mgl)-(b.g-b.mgl))[0];
    const cok=es.slice().sort((a,b)=>(b.g+b.mgl)-(a.g+a.mgl))[0];
    if(iyi&&iyi.g>iyi.mgl) ekle('🫂','En uyumlu eş',`${iyi.g}–${iyi.mgl}`,[iyi.x,iyi.y],
      'Birbirini gözünden anlamaktadırlar. Masa bu ikilinin ayrılmasını talep etmektedir.');
    if(kot&&kot.mgl>kot.g) ekle('🪦','En uğursuz eş',`${kot.g}–${kot.mgl}`,[kot.x,kot.y],
      'Ayrı ayrı iyi oynarlar; birlikte oynadıklarında masaya ikram ederler.');
    if(cok) ekle('⛓️','En çok eş düşenler',`${cok.g+cok.mgl} maç`,[cok.x,cok.y],
      'Kader birliği. Kurayı kim çekiyorsa soruşturulmalıdır.');
  }

  /* iki oyunda da geçerli */
  const st=istatistik(oyun);
  const v=Object.values(st).filter(p=>p.celse>0);
  const ser=v.filter(p=>p.seriTip==='gal').sort((a,b)=>b.seri-a.seri)[0];
  if(ser&&ser.seri>=2) ekle('🔥','En uzun galibiyet serisi',`${ser.seri} maç`,ser.id,'Hâlen sürmektedir.');
  const has=v.filter(p=>p.seriTip==='hasret').sort((a,b)=>b.seri-a.seri)[0];
  if(has&&has.seri>=2) ekle('📉','En uzun galibiyet hasreti',`${has.seri} maç`,has.id,'Dosya derdesttir.');
  const dev=v.slice().sort((a,b)=>b.celse-a.celse)[0];
  if(dev) ekle('🪑','En çok maç',`${dev.celse}`,
    v.filter(p=>p.celse===dev.celse).map(p=>p.id),'Masanın demirbaşı.');
  return R;
}

function rekorKart(oyun){
  const R=rekorlar(oyun);
  if(!R.length) return `<div class="card"><div class="empty"><div class="big">📖</div>
    Rekor yok.<div class="sm" style="margin-top:6px">Birkaç maç girilince kitap kendiliğinden yazılır.</div></div></div>`;
  return `<div class="card">
    <h3>📖 Rekorlar Kitabı · ${oyun==='batak'?'Batak':'101'}</h3>
    <div class="xs dim" style="margin-bottom:10px">Masanın sayısal efsaneleri. Kırılana kadar geçerlidir.</div>
    <div class="stack">${R.map(r=>`<div class="rozet">
      <div class="k">${r.k}</div>
      <div class="grow" style="min-width:0">
        <div style="font-weight:700;font-size:13px">${esc(r.baslik)}</div>

        <div class="xs" style="color:var(--ink2)">${esc(unvanAd(r.kim))}${r.tarih?` · ${trh(r.tarih)}`:''}</div>
        ${r.not?`<div class="xs muted" style="margin-top:2px">${esc(r.not)}</div>`:''}

      <div class="row" style="gap:4px;flex-shrink:0">${unvanAvatar(r.kim,24)}</div>
    </div>`).join('')}</div>

}
function rekorPaylas(oyun){
  const g=aktifGrup()||{ad:'Masa',emoji:''};
  const R=rekorlar(oyun);
  const L=[`${g.emoji||''} ${String(g.ad).toLocaleUpperCase('tr-TR')} — ${oyun==='batak'?'BATAK':'101'} REKORLARI`,''];

/* =========================================================
   HAFTALIK ÖZET + EŞ KURASI
   İkisi de tek amaca hizmet ediyor: masanın işini kolaylaştırmak.
   ========================================================= */

/* --------- HAFTA ÖZETİ ---------
   Verilen gün sayısı içindeki celselerden WhatsApp'a yapıştırılacak metin. */
function haftaOzetiUret(gun){
  gun=gun||7;
  const g=aktifGrup()||{ad:'Masa',emoji:''};
  const bitis=new Date(), baslangic=new Date(Date.now()-gun*86400000);
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const b0=iso(baslangic), b1=iso(bitis);

  const list=grupCelseleri().filter(c=>c.tarih>=b0&&c.tarih<=b1)
    .sort((a,b)=>(a.tarih+(a._sira||'')).localeCompare(b.tarih+(b._sira||'')));

  const L=[`${g.emoji||''} ${String(g.ad).toLocaleUpperCase('tr-TR')} — ${gun} GÜNLÜK ÖZET`,
           `${trh(b0)} – ${trh(b1)}`,''];
  if(!list.length){
    L.push('Bu dönemde celse görülmemiştir.');
    L.push('Masanın uzun süre kurulmaması, üyelerin sağlığı bakımından kaygı vericidir.');
    return L.join('\n');
  }

  const bat=list.filter(c=>c.oyun==='batak').length, yz=list.length-bat;
  L.push(`${list.length} celse görülmüştür${bat&&yz?` (${bat} Batak, ${yz} 101)`:(bat?' (Batak)':' (101)')}.`);
  L.push('');

  /* celse dökümü */
  L.push('DÖKÜM:');
  list.forEach(c=>{
    if(c.oyun==='batak'){
      const m=batakMac(c), kz=c.kazanan??m.macKazanan??0;
      L.push(`  ${trh(c.tarih)} · Batak — ${liste(c.takimlar[kz].oyuncular.map(ad))} kazandı`+
             `${(m.gTop[0]||m.gTop[1])?` (${m.gTop[kz]}–${m.gTop[1-kz]})`:''}`);
    }else{
      const sr=yzMac(c).sira;
      L.push(`  ${trh(c.tarih)} · 101 — ${ad(sr[0].id)} birinci, ${ad(sr[sr.length-1].id)} sonuncu`);
    }
  });

  /* dönemin galibi: en çok birincilik */
  const say={};
  list.forEach(c=>{
    if(c.oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) return;
      c.takimlar[kz].oyuncular.forEach(id=>say[id]=(say[id]||0)+1);
    }else{
      const sr=yzMac(c).sira; if(sr.length) say[sr[0].id]=(say[sr[0].id]||0)+1;
    }
  });
  const sirali=Object.entries(say).sort((a,b)=>b[1]-a[1]);
  if(sirali.length){
    const en=sirali[0][1];
    const kimler=sirali.filter(([,n])=>n===en).map(([id])=>ad(id));
    L.push('');
    L.push(`ÜSTÜNLÜK: ${liste(kimler)}, dönem içinde ${en} kez kazanmıştır.`);
  }

  /* dönemin sponsoru: en çok sonuncu/kaybeden */
  const kayip={};
  list.forEach(c=>{
    if(c.oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) return;
      c.takimlar[1-kz].oyuncular.forEach(id=>kayip[id]=(kayip[id]||0)+1);
    }else{
      const sr=yzMac(c).sira; if(sr.length) { const s=sr[sr.length-1].id; kayip[s]=(kayip[s]||0)+1; }
    }
  });
  const ks=Object.entries(kayip).sort((a,b)=>b[1]-a[1]);
  if(ks.length&&ks[0][1]>0){
    const en=ks[0][1];
    L.push(`SPONSORLUK: ${liste(ks.filter(([,n])=>n===en).map(([id])=>ad(id)))} ${en} kez kaybetmiş, masanın masraflarına katkıda bulunmuştur.`);
  }

  /* borç durumu */
  const t=borcTablosu();
  const borclu=Object.entries(t).filter(([,v])=>v<0)
    .map(([k,v])=>{const i=k.indexOf('|');
      const taraf=tarafKisiler(k.slice(0,i));
      return `${taraf.map(ad).join(' & ')} ${Math.abs(v)} ${k.slice(i+1)}${taraf.length>1?' (ortak)':''}`;});
  if(borclu.length){
    L.push('');
    L.push(`ZİMMET: ${liste(borclu)}. İfa süresi bir sonraki celseye kadardır.`);
  }

  /* açık iddialar */
  const idd=grupIddialari().filter(i=>i.durum==='acik');
  if(idd.length){
    L.push('');
    L.push(`DERDEST İDDİA: ${idd.length} adet.`);
    idd.slice(0,3).forEach(i=>L.push(`  • ${ad(i.kim)}${i.kime?` ↔ ${ad(i.kime)}`:''}: “${i.metin}”`));
  }

  /* unvan sahipleri */
  ['batak','101'].forEach(oy=>{
    const u=muayyideler(oy);
    const sp=u.find(x=>x.ad==='Masanın Sponsoru');
    const em=u.find(x=>x.ad==='Emsal Karar');
    if(!sp&&!em) return;
    L.push('');
    L.push(`${oy==='batak'?'BATAK':'101'} SİCİLİ: ${em?`${unvanAd(em.kim)} önde`:''}${em&&sp?', ':''}${sp?`${unvanAd(sp.kim)} sponsor`:''}.`);
  });

  L.push('');
  L.push('Bir sonraki celsenin tarihi taraflarca serbestçe belirlenecektir.');
  return L.join('\n');
}

async function devirYukle(){
  const btn=$('#dvBtn'); if(btn){btn.disabled=true;}
  let macN=0, borcN=0, hata=0;
  try{
    const d=await fetch('kurulum/devir.json',{cache:'no-store'}).then(r=>r.json());

    /* maçlar */
    for(const m of (d.maclar||[])){
      if(btn) btn.innerHTML=`<span class="yukleniyor"></span> maç ${macN+1}`;
      const A=(m.A||[]).map(n=>adaGoreOyuncu(n)?.id).filter(Boolean);
      const B=(m.B||[]).map(n=>adaGoreOyuncu(n)?.id).filter(Boolean);
      if(A.length!==2||B.length!==2){ hata++; continue; }
      /* zaten yüklenmiş mi? aynı tarih + aynı kadro */
      const varMi=DB.celseler.some(c=>c.tarih===m.tarih&&c.oyun==='batak'&&c.takimlar&&
        c.takimlar.some(t=>t.oyuncular.every(id=>A.includes(id))));
      if(varMi) continue;
      const kz=(Number(m.puanA)||0)>=(Number(m.puanB)||0)?0:1;
      const c={oyun:'batak',giris:'hizli',masaAd:'Devir',tarih:m.tarih,yer:m.yer||'',
        tabelaci:DB.ben||A[0],partiHedef:2,not:m.not||'',bahis:m.bahis||{ne:'Onur',adet:1},
        takimlar:[{ad:'A',oyuncular:A},{ad:'B',oyuncular:B}],
        hizli:{partiSkor:[Number(m.partiA)||(kz===0?2:0),Number(m.partiB)||(kz===1?2:0)],
               puan:[Number(m.puanA)||0,Number(m.puanB)||0]},
        kazanan:kz,partiler:[{eller:[],kazanan:null}]};
      c.zabit=zabitUret(c);
      const {data,error}=await sb.from('maclar').insert({
        masa_id:DB.aktifGrup,oyun:'batak',giris:'hizli',tarih:m.tarih,yer:m.yer||null,
        tabelaci_id:OTURUM.id,parti_hedef:2,celse:JSON.parse(JSON.stringify(c)),bitti:true,
        kazanan:kz,zabit:c.zabit,aciklama:c.not||null}).select('id,olusturma').single();
      if(error){ hata++; continue; }
      Object.assign(c,{id:data.id,grupId:DB.aktifGrup,bitti:true,_hesap:OTURUM.id,_sira:data.olusturma});
      DB.celseler.push(c); macN++;
    }

    /* borçlar */
    for(const b of (d.borclar||[])){
      if(btn) btn.innerHTML=`<span class="yukleniyor"></span> borç ${borcN+1}`;
      const bl=(b.borclular||[]).map(n=>adaGoreOyuncu(n)?.id).filter(Boolean);
      const al=(b.alacaklilar||[]).map(n=>adaGoreOyuncu(n)?.id).filter(Boolean);
      if(!bl.length||!al.length){ hata++; continue; }
      const zaten=(DB.akis||[]).some(a=>{
        const k=a.veri&&a.veri.borcKaydi;
        return k&&k.ne===b.ne&&(k.borclular||[]).length===bl.length&&
               (k.borclular||[]).every(id=>bl.includes(id));
      });
      if(zaten) continue;
      const ok=await borcKaydiYaz({borclular:bl,alacaklilar:al,ne:b.ne,
        adet:Number(b.adet)||1,aciklama:b.aciklama||'Devir borcu.'});
      if(ok) borcN++; else hata++;
    }
  }catch(e){ toast(hataMetni(e),true); }
  await verileriGetir(); kapatModal(); render();
  toast(hata?`${macN} maç, ${borcN} borç işlendi · ${hata} kayıt olmadı`
            :`Devir işlendi: ${macN} maç, ${borcN} borç kaydı.`,true);
}

  /* YÜRÜYEN PARTİ ayrı gösterilir. Eskiden maçın TOPLAMI (gTop / top)
     yazılıyordu; 1. parti bitince 2. partinin sayıları onun üstüne
     biniyor gibi görünüyordu — tabelacının ekranıyla tutmuyordu. */
  const parti=m.aktif, pIdx=m.aktifIdx;
  const pAd=partiAd(c,pIdx), cikis=pAd==='Çıkıştırma';
  const kafeKart=typeof macKafeKart==='function'?macKafeKart(c):'';
  const alt=`</div>
    ${kafeKart}
    ${sureKarti(c)}
    ${gecmisPartiler(c)}
    <div class="card tight center xs dim">Tabelayı ${esc(kim?.ad||'tabelacı')} tutuyor.
      Ekran kendiliğinden güncellenir. Yukarıdaki sayılar <b>${esc(pAd)}</b> içindir;
      önceki partiler ayrı durur.</div>`;

  if(c.oyun==='batak'){
    const T=i=>c.takimlar[i].oyuncular.map(ad).join(' & ');
    const {top}=batakPartiToplam(parti);
    const pKz=batakPartiKazanan(parti);
    return bas2+`
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div class="serif" style="font-size:15px">${cikis?'🔥 ':''}${esc(pAd)}</div>
        <div class="xs dim">${parti.eller.length} el · hedef ${DB.ayar.batak.hedef}</div>
      </div>
      ${[0,1].map(i=>`<div class="row" style="padding:7px 0">
        <span class="pill ${i?'blue':'green'}">${c.takimlar[i].ad}</span>
        <div class="grow" style="font-weight:600;font-size:14px">${esc(T(i))}</div>
        <div class="serif" style="font-size:22px;${pKz===i?'color:var(--gold)':''}">${top[i]}</div>
      </div>`).join('')}
      <div class="xs dim center" style="margin-top:6px">Parti skoru ${m.partiSkor[0]}–${m.partiSkor[1]}
        · ${c.partiHedef} parti üzerinden${c.partiler.length>1?` · maç toplamı ${m.gTop[0]}–${m.gTop[1]}`:''}</div>
      ${alt}`;
  }

  /* 101: yürüyen partinin puanları. Sıralama da o partiye göre. */
  const pt=yzPartiToplam(parti,c);
  const sr=c.oyuncular.slice().sort((x,y)=>pt[x]-pt[y]||ad(x).localeCompare(ad(y),'tr'));
  return bas2+`
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <div class="serif" style="font-size:15px">${esc(pAd)}</div>
      <div class="xs dim">${parti.eller.length} / ${DB.ayar.yz.elSayisi} el</div>
    </div>
    ${sr.map((id,i)=>`<div class="row" style="padding:6px 0;gap:9px">
      <div class="rank ${i===0?'r1':(i===sr.length-1?'rs':'')}">${i+1}</div>
      ${avatar(id,30)}
      <div class="grow" style="margin-left:4px;font-weight:600;font-size:14px">${esc(ad(id))}</div>
      <div class="serif" style="font-size:19px">${pt[id]}</div></div>`).join('')}
    ${c.partiler.length>1?`<div class="xs dim center" style="margin-top:6px">Parti sayısı ${
      c.oyuncular.map(id=>`${ad(id)} ${m.partiKaz[id]||0}`).join(' · ')}</div>`:''}
    ${alt}`;
}
