/* =========================================================
   TAHMİN YARIŞMASI
   Haftanın maçları girilir, herkes skor yazar. Tahminler AÇIK —
   herkes birbirini görür. Maç başlayınca kilitlenir; kilit
   veritabanında (yama 08), arayüzde değil.

   PUAN SKALASI
     tam skor .................. 5
     doğru sonuç + gol farkı ... 3
     sadece doğru sonuç ........ 2
     toplam gol de tutarsa ..... +1   (yalnız puan aldıysa)
     yoksa ..................... 0
   ========================================================= */

let TAHMIN_HAFTA=null;          // seçili hafta id

/* --------------------------- puanlama --------------------------- */
const isaret=x=>x>0?1:(x<0?-1:0);
function tahminPuan(t,k){
  if(!t||k.evSkor==null||k.depSkor==null) return null;
  if(t.ev===k.evSkor&&t.dep===k.depSkor) return 5;
  let p=0;
  if(isaret(t.ev-t.dep)===isaret(k.evSkor-k.depSkor))
    p = ((t.ev-t.dep)===(k.evSkor-k.depSkor)) ? 3 : 2;
  if(p>0 && (t.ev+t.dep)===(k.evSkor+k.depSkor)) p+=1;
  return p;
}
const puanEtiketi=p=>p===null?'':(p===0?'0':'+'+p);

/* --------------------------- veri ------------------------------- */
const haftalar     = ()=>(DB.haftalar||[]).filter(h=>h.masaId===DB.aktifGrup);
const haftaMaclari = hid=>(DB.karsilasmalar||[]).filter(k=>k.haftaId===hid)
                            .sort((a,b)=>a.sira-b.sira||String(a.baslangic).localeCompare(String(b.baslangic)));
const macTahminleri= kid=>(DB.tahminler||[]).filter(t=>t.karsilasmaId===kid);
const benimTahmin   = kid=>macTahminleri(kid).find(t=>t.profilId===OTURUM.id)||null;
const kilitli        = k=>new Date(k.baslangic).getTime()<=Date.now();
const skorVar        = k=>k.evSkor!=null&&k.depSkor!=null;

function saatMetni(iso){
  const d=new Date(iso);
  if(isNaN(d)) return '';
  const g=['Paz','Pzt','Sal','Çar','Per','Cum','Cts'][d.getDay()];
  const ik=n=>String(n).padStart(2,'0');
  return `${g} ${ik(d.getDate())}.${ik(d.getMonth()+1)} ${ik(d.getHours())}:${ik(d.getMinutes())}`;
}
function kalanMetni(iso){
  const fark=new Date(iso).getTime()-Date.now();
  if(fark<=0) return 'kilitli';
  const dk=Math.round(fark/60000);
  if(dk<60) return dk+' dk kaldı';
  const sa=Math.round(dk/60);
  if(sa<48) return sa+' saat kaldı';
  return Math.round(sa/24)+' gün kaldı';
}

/* haftanın puan tablosu: profilId → {puan, tam, adet} */
function haftaPuanlari(hid){
  const t={};
  const kur=id=>t[id]=t[id]||{puan:0,tam:0,adet:0};
  haftaMaclari(hid).filter(skorVar).forEach(k=>{
    macTahminleri(k.id).forEach(x=>{
      const p=tahminPuan(x,k); if(p===null) return;
      const s=kur(x.profilId); s.puan+=p; s.adet++; if(p===5) s.tam++;
    });
  });
  return t;
}
/* sezon: bütün haftalar */
function sezonPuanlari(){
  const t={};
  const kur=id=>t[id]=t[id]||{puan:0,tam:0,adet:0,hafta:0};
  haftalar().forEach(h=>{
    const hp=haftaPuanlari(h.id);
    const sirali=Object.entries(hp).sort((a,b)=>b[1].puan-a[1].puan);
    const en=sirali.length?sirali[0][1].puan:0;
    Object.entries(hp).forEach(([id,s])=>{
      const g=kur(id); g.puan+=s.puan; g.tam+=s.tam; g.adet+=s.adet;
      if(s.puan===en&&en>0) g.hafta++;      // haftalık şampiyonluk
    });
  });
  return t;
}
const profilAd=pid=>{
  const o=DB.oyuncular.find(x=>x.profilId===pid&&x.masaId===DB.aktifGrup);
  if(o) return o.ad;
  const u=MASA_UYELERI.find(u=>u.profil_id===pid)?.profiller?.ad;
  if(u) return u;
  /* WhatsApp linkiyle katilan misafir: uyelik kaydi yok, adi
     hafta_misafirleri tablosunda (yama 10). */
  const g=(typeof HAFTA_MISAFIRLERI!=='undefined'?HAFTA_MISAFIRLERI:[])
            .find(x=>x.profilId===pid);
  return g ? g.ad : '?';
};

/* HERKESİN TAHMİNİ BİR TABLODA
   Satır = kişi, sütun = maç. Hücrede o kişinin skoru; maç
   sonuçlandıysa aldığı puana göre renklenir (altın = tam skor).
   Sütun başlıkları numaralı, altında hangi maç olduğu yazıyor —
   20 maçlık haftada takım adlarını yatay sığdırmanın yolu yok. */
function tahminPanosu(hid){
  const mac=haftaMaclari(hid);
  if(!mac.length) return '';
  const tahminler=mac.flatMap(k=>macTahminleri(k.id));
  if(!tahminler.length) return `<div class="card"><h3>🗒️ Tahmin Panosu</h3>
    <div class="sm dim">Henüz kimse tahmin yazmadı. İlk yazan sen ol.</div></div>`;

  /* kişiler: tahmin yazanlar önce, sonra yazmayan masa üyeleri */
  const yazanlar=[...new Set(tahminler.map(t=>t.profilId))];
  const uyeler=(MASA_UYELERI||[]).map(u=>u.profil_id).filter(id=>!yazanlar.includes(id));
  const kisiler=yazanlar.concat(uyeler);

  const hp=haftaPuanlari(hid);
  const sirali=kisiler.slice().sort((a,b)=>
    ((hp[b]?.puan)||0)-((hp[a]?.puan)||0)
    || (a===OTURUM.id?-1:0)-(b===OTURUM.id?-1:0)
    || String(profilAd(a)).localeCompare(String(profilAd(b)),'tr'));

  const hucre=(pid,k)=>{
    const t=macTahminleri(k.id).find(x=>x.profilId===pid);
    if(!t) return `<td class="dim center">–</td>`;
    const p=skorVar(k)?tahminPuan(t,k):null;
    const renk = p===5 ? 'var(--gold)' : (p>0 ? 'var(--green)' : (p===0 ? 'var(--dim)' : 'var(--ink)'));
    return `<td class="center" style="white-space:nowrap;color:${renk};font-weight:${p>0?700:600}">
      ${t.ev}–${t.dep}${p!==null&&p>0?`<span class="xs"> +${p}</span>`:''}</td>`;
  };

  return `<div class="card">
    <h3>🗒️ Tahmin Panosu</h3>
    <div class="xs dim" style="margin-bottom:9px">Herkesin tahmini bir arada.
      <b style="color:var(--gold)">Altın</b> tam skor, <b style="color:var(--green)">yeşil</b> puan aldı,
      soluk olan tutmadı. Sağa kaydırarak bütün maçları görürsün.</div>

    <div style="overflow-x:auto"><table style="min-width:100%">
      <thead><tr><th style="position:sticky;left:0;background:var(--panel)">Kişi</th>
        ${mac.map((k,i)=>`<th class="center" title="${esc(k.ev)} – ${esc(k.deplasman)}">${i+1}</th>`).join('')}
        <th class="center">Σ</th></tr></thead>
      <tbody>${sirali.map(pid=>`<tr>
        <td style="position:sticky;left:0;background:var(--panel)">
          <div class="row" style="gap:7px">${profilAvatar(pid,22)}
            <span style="font-weight:${pid===OTURUM.id?700:600};white-space:nowrap">${
              pid===OTURUM.id?'sen':esc(profilAd(pid))}</span></div></td>
        ${mac.map(k=>hucre(pid,k)).join('')}
        <td class="center"><b>${(hp[pid]?.puan)||0}</b></td></tr>`).join('')}
      </tbody>
    </table></div>

    <div class="xs dim" style="margin-top:10px;line-height:1.7">
      ${mac.map((k,i)=>`<div><b>${i+1}</b> · ${esc(k.ev)} – ${esc(k.deplasman)}
        ${skorVar(k)?`<b>${k.evSkor}–${k.depSkor}</b>`:`<span class="dim">${kilitli(k)?'oynanıyor':saatMetni(k.baslangic)}</span>`}</div>`).join('')}
    </div>
  </div>`;
}

/* =========================================================
   TAHMİN YARIŞMASI — eylemler
   Fikstür YAPIŞTIRILARAK giriliyor: dış servise, API anahtarına ve
   kotaya bağımlılık yok. Anahtar statik sayfada saklanamaz zaten.
   ========================================================= */

/* ---------------- fikstür ayrıştırıcı ----------------
   Tanıdığı biçimler (satır başına bir maç):
     Cts 20:00 Fenerbahçe - Beşiktaş
     06.09 20:00  Galatasaray - Trabzonspor
     2026-09-06 22:00 Real Madrid vs Galatasaray
     20:00 Fenerbahçe-Beşiktaş
   Gün adı yazılmışsa bu haftanın o gününe denk getirilir.        */
const GUNLER={paz:0,pzt:1,pts:1,sal:2,car:3,'çar':3,per:4,cum:5,cts:6,cmt:6,
              pazar:0,pazartesi:1,sali:2,'salı':2,carsamba:3,'çarşamba':3,
              persembe:4,'perşembe':4,cuma:5,cumartesi:6};

const GUN_DESEN=/\b(pzt|pts|sal|çar|car|per|cum|cts|cmt|paz|pazartesi|salı|sali|çarşamba|carsamba|perşembe|persembe|cuma|cumartesi|pazar)\b/i;

/* Sıra önemli: ÖNCE tarih ayrılır, SONRA saat aranır.
   Tersi yapılınca "06.09 22:00" satırında 06.09 saat sanılıyor ve
   22:00 takım adına karışıyordu — yaşanan hata buydu.
   Ayırt etme kuralı: ':' varsa o kesin saattir; "gg.aa" ise ay 1-12
   olmak zorunda, yani "20.00" (ay=00) tarih olamaz, saattir. */
function fiksturAyristir(metin){
  const cikti=[], hata=[];
  const bugun=new Date();

  String(metin||'').split(/\r?\n/).forEach(ham=>{
    const asil=ham.trim(); if(!asil) return;
    let s=asil, d=null, saat=null, dk=null, tarihYazili=false;
    const cikar=x=>{ s=s.replace(x,' '); };

    /* 1) ISO tarih: 2026-09-06 */
    let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m){ d=new Date(+m[1],+m[2]-1,+m[3]); tarihYazili=true; cikar(m[0]); }

    /* 2) ':' ayraçlı saat — tereddütsüz saattir */
    m=s.match(/(\d{1,2}):(\d{2})/);
    if(m && +m[1]<=23 && +m[2]<=59){ saat=+m[1]; dk=+m[2]; cikar(m[0]); }

    /* 3) gg.aa[.yyyy] — ay 1-12 olmalı, yoksa tarih değildir */
    if(!d){
      m=s.match(/\b(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?\b/);
      if(m && +m[1]>=1 && +m[1]<=31 && +m[2]>=1 && +m[2]<=12){
        const yil=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):bugun.getFullYear();
        d=new Date(yil,+m[2]-1,+m[1]); tarihYazili=true; cikar(m[0]);
      }
    }

    /* 4) saat hâlâ yoksa nokta ile yazılmış olabilir: 20.00 */
    if(saat===null){
      m=s.match(/\b(\d{1,2})[.](\d{2})\b/);
      if(m && +m[1]<=23 && +m[2]<=59){ saat=+m[1]; dk=+m[2]; cikar(m[0]); }
    }
    if(saat===null){ hata.push(asil); return; }

    /* 5) tarih yoksa gün adına bak: bu haftanın o günü (geçtiyse sonraki) */
    const g=s.match(GUN_DESEN);
    if(!d && g){
      const gi=GUNLER[g[1].toLocaleLowerCase('tr-TR')];
      if(gi!==undefined){
        d=new Date(bugun);
        d.setDate(bugun.getDate()+((gi-bugun.getDay()+7)%7));
      }
    }
    if(g) cikar(g[0]);
    if(!d) d=new Date(bugun);
    d.setHours(saat,dk,0,0);
    /* Sadece saat yazılmışsa ve o saat geçmişse yarını kastediyordur */
    if(!tarihYazili && !g && d.getTime()<Date.now()) d.setDate(d.getDate()+1);

    /* 6) takımlar */
    const kalan=s.replace(/\s+/g,' ').trim();
    const t2=takimlariAyir(kalan);
    if(!t2){ hata.push(asil); return; }
    const ev=t2[0], dep=t2[1];
    cikti.push({ev,deplasman:dep,baslangic:d.toISOString()});
  });
  return {mac:cikti,hata};
}

/* ---- takım adlarını ayırma ----
   Ayraç (v / vs / - / x) varsa iş kolay. Fikstür sitelerinden kopyalanan
   satırlarda ayraç OLMUYOR: "04.09.2026 20:00 Başakşehir Galatasaray".
   O zaman kelimeleri ikiye bölmek gerekiyor ve tek doğru cevap yok:
   "Sporting CP Galatasaray" 2+1, "Liverpool Atletico Madrid" 1+2.

   Kural: kelime sayısı çiftse yarı yarıya. Tekse fazlalık EV sahibine
   gider; ancak son kelime bir takım adının İKİNCİ parçası olabilecek
   kelimelerdense (Madrid, City, United...) fazlalık deplasmana geçer.
   Sonuç her hâlükârda önizlemede gösteriliyor; yanlışsa satıra "v"
   koymak yeter. */
const IKINCI_PARCA=new Set(['madrid','city','united','munih','münih','munich','villa',
  'prag','praha','donetsk','leipzig','bilbao','brugge','bruges','atina','linz','wien',
  'zagreb','belgrad','bratislava','betis','sofya','moskova','kiev','lizbon','lisbon',
  'dortmund','eindhoven','glimt','sociedad','graz','salzburg','pilsen','plzen',
  'hoffenheim','leverkusen','frankfurt','mönchengladbach','bremen',
  'sofia','pireus','pire','selanik','saraybosna','skopje','tiran','baku','bakü']);

function takimlariAyir(kalan){
  const temiz=x=>String(x||'').trim().replace(/^[-–—|\s]+|[-–—|\s]+$/g,'');

  /* a) açık ayraç */
  const ayrac=kalan.split(/\s+(?:vs\.?|v|x|-|–|—|\|)\s+|(?<=\S)\s*[–—|]\s*(?=\S)/i);
  if(ayrac.length>=2){
    const a=temiz(ayrac[0]), b=temiz(ayrac.slice(1).join(' '));
    if(a&&b) return [a,b];
  }
  /* b) tireli ama boşluksuz: "Fenerbahçe-Beşiktaş" */
  if(/\S-\S/.test(kalan)){
    const i=kalan.indexOf('-');
    const a=temiz(kalan.slice(0,i)), b=temiz(kalan.slice(i+1));
    if(a&&b) return [a,b];
  }
  /* c) ayraçsız: kelimeleri böl */
  const k=kalan.split(/\s+/).filter(Boolean);
  if(k.length<2) return null;
  let evSay=Math.ceil(k.length/2);
  if(k.length%2===1 && IKINCI_PARCA.has(k[k.length-1].toLocaleLowerCase('tr-TR')))
    evSay=Math.floor(k.length/2);
  const a=temiz(k.slice(0,evSay).join(' ')), b=temiz(k.slice(evSay).join(' '));
  return (a&&b)?[a,b]:null;
}

/* ---------------- tahmin ---------------- */
/* sessiz=true: kutudan çıkınca kendiliğinden yazılır. Ekranı yeniden
   çizmez (yazarken odak kaçmasın), yanındaki küçük not güncellenir. */
async function tahminKaydet(kid,sessiz){
  const k=(DB.karsilasmalar||[]).find(x=>x.id===kid); if(!k) return;
  const not=(m,renk)=>{ const n=$(`#th-n-${kid}`); if(n){ n.textContent=m; n.style.color=renk; } };
  if(kilitli(k)){ await yenile(true); return toast('Maç başladı, tahmin kapandı.',true); }
  const e=parseInt($(`#th-e-${kid}`)?.value,10), d=parseInt($(`#th-d-${kid}`)?.value,10);
  if(!Number.isInteger(e)||!Number.isInteger(d)||e<0||d<0){
    if(sessiz){ not('iki sayıyı yaz','var(--dim)'); return; }
    return toast('İki skoru da yaz',true);
  }
  const eski=benimTahmin(kid);
  if(eski&&eski.ev===e&&eski.dep===d){ not('✓ kayıtlı','var(--green)'); return; }
  not('yazılıyor…','var(--dim)');
  const {error}=await tahminYaz(kid,e,d);
  if(error){
    /* kilit veritabanında: maç başladıysa kural engeller */
    if(/row-level security|violates/i.test(error.message||'')){
      await yenile(true); return toast('Maç başladı, tahmin kapandı.',true);
    }
    not('yazılamadı','var(--red)');
    return toast(hataMetni(error),true);
  }
  if(sessiz){
    /* yerel kaydı güncelle, ekranı çizmeden notu yeşile çevir */
    const yeni={karsilasmaId:kid,profilId:OTURUM.id,ev:e,dep:d};
    const i=(DB.tahminler||[]).findIndex(t=>t.karsilasmaId===kid&&t.profilId===OTURUM.id);
    if(i>=0) DB.tahminler[i]=Object.assign(DB.tahminler[i],yeni); else (DB.tahminler=DB.tahminler||[]).push(yeni);
    not('✓ kayıtlı','var(--green)');
    return;
  }
  await yenile(true);
  toast(`${k.ev} – ${k.deplasman}: ${e}–${d} yazıldı.`);
}

function tahminYaz(kid,e,d){
  return sb.from('tahminler')
    .upsert({karsilasma_id:kid,profil_id:OTURUM.id,ev:e,dep:d,guncelleme:new Date().toISOString()},
            {onConflict:'karsilasma_id,profil_id'});
}

/* Ekrandaki bütün açık maçların kutularını okuyup TEK istekte yazar. */
async function tahminHepsiniKaydet(hid){
  const acik=haftaMaclari(hid).filter(k=>!kilitli(k));
  const satir=[], atlanan=[];
  acik.forEach(k=>{
    const e=parseInt($(`#th-e-${k.id}`)?.value,10), d=parseInt($(`#th-d-${k.id}`)?.value,10);
    if(!Number.isInteger(e)||!Number.isInteger(d)||e<0||d<0){ atlanan.push(k); return; }
    satir.push({karsilasma_id:k.id,profil_id:OTURUM.id,ev:e,dep:d,guncelleme:new Date().toISOString()});
  });
  if(!satir.length) return toast('Kaydedilecek tahmin yok — skorları yaz',true);

  const btn=$('#thHepBtn');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>'; }
  const {error}=await sb.from('tahminler').upsert(satir,{onConflict:'karsilasma_id,profil_id'});
  if(error){
    if(btn){ btn.disabled=false; btn.textContent='💾 Yazdıklarımın Hepsini Kaydet'; }
    if(/row-level security|violates/i.test(error.message||'')){
      await yenile(true);
      return toast('Bir maç bu arada başlamış olabilir; ekran yenilendi, kalanları tekrar dene.',true);
    }
    return toast(hataMetni(error),true);
  }
  await yenile(true);
  toast(`${satir.length} tahmin kaydedildi${atlanan.length?`, ${atlanan.length} maç boş bırakıldı`:''}.`,true);
}

/* ---------------- hafta zabıtı ---------------- */
function tahminZabtiUret(hid){
  const h=haftalar().find(x=>x.id===hid); if(!h) return '';
  const g=aktifGrup()||{ad:'Masa',emoji:''};
  const mac=haftaMaclari(hid), hp=haftaPuanlari(hid);
  const sirali=Object.entries(hp).sort((a,b)=>b[1].puan-a[1].puan||b[1].tam-a[1].tam);
  const L=[`${g.emoji||''} ${String(g.ad).toLocaleUpperCase('tr-TR')} — ${String(h.ad).toLocaleUpperCase('tr-TR')} TAHMİN ZABTI`,''];

  const bitmis=mac.filter(skorVar);
  if(bitmis.length){
    L.push('SONUÇLAR:');
    bitmis.forEach(k=>L.push(`  ${k.ev} ${k.evSkor}–${k.depSkor} ${k.deplasman}`));
    L.push('');
  }
  const bekleyen=mac.filter(k=>!skorVar(k));
  if(bekleyen.length){
    L.push(`SONUCU BEKLENEN: ${bekleyen.map(k=>`${k.ev}–${k.deplasman}`).join(', ')}.`);
    L.push('');
  }
  if(!sirali.length){ L.push('Henüz puanlanmış tahmin yok.'); return L.join('\n'); }

  L.push('SIRALAMA:');
  sirali.forEach(([pid,s],i)=>L.push(`  ${i+1}. ${profilAd(pid)} — ${s.puan} puan`+
    (s.tam?` (${s.tam} tam skor)`:'')));
  L.push('');

  const en=sirali[0][1].puan;
  const sampiyonlar=sirali.filter(([,s])=>s.puan===en).map(([pid])=>profilAd(pid));
  L.push(`HÜKÜM: ${liste(sampiyonlar)} ${en} puanla haftanın birincisi olmuştur.`+
    (sampiyonlar.length>1?' Beraberlik hâlinde unvan ortak taşınır.':''));

  const son=sirali[sirali.length-1];
  if(sirali.length>1&&son[1].puan<en)
    L.push(`${profilAd(son[0])} ${son[1].puan} puanda kalmıştır. Futbol bilgisi hususu tartışmaya açılmamıştır.`);

  const tamci=sirali.filter(([,s])=>s.tam>0);
  if(tamci.length) L.push(`TAM SKOR: ${liste(tamci.map(([pid,s])=>`${profilAd(pid)} (${s.tam})`))}.`);
  else L.push('Bu hafta tam skor tutan çıkmamıştır.');

  const sifir=sirali.filter(([,s])=>s.puan===0).map(([pid])=>profilAd(pid));
  if(sifir.length) L.push(`Sıfır çeken: ${liste(sifir)}. Tahmin serbestliği anayasal bir haktır.`);

  L.push('');
  L.push('Zabıt okundu, imza altına alındı.');
  return L.join('\n');
}
function tahminZabtiAc(hid){
  const m=tahminZabtiUret(hid);
  acModal(`<h2 class="serif" style="margin:0 0 10px">Hafta Zabtı</h2>
    <div class="zabit" id="hzMetin">${esc(m)}</div>

  if(!kurucuMu()) return toast('Yetkin yok',true);

//== tmisafir
/* =========================================================
   TAHMİN HAFTASINI WHATSAPP'TAN OYNATMAK

   İstek (kullanıcı, 02.09.2026): "Maç sonuçlarını açacağız ya, onu
   WhatsApp'tan da paylaşayım, gruptan bağlanıp oradan da yazsınlar;
   dışarıdan yazan da adını yazsın girsin." — Buradaki maçlar FUTBOL
   maçları; masa tabelasının misafiri f_misafir.js'te.

   AKIŞ
     Kurucu  → Divan → haftada "📱 Gruba At" → link + hazır mesaj
     Misafir → linke tıklar → adını yazar → tahminlerini girer

   GÜVENLİK — kural veritabanında (yama 10)
     · RLS açılmadı; üç security definer kapı:
         tahmin_misafir_katil · tahmin_misafir_pencere · tahmin_misafir_yaz
     · Misafir yalnız KENDİ tahminini yazar (profil_id = auth.uid()).
     · MAÇ BAŞLADIKTAN SONRA yazamaz — kilit sunucuda (tahmin_acik_mi),
       üyeler için de aynı kural.
     · Sonuç giremez, maç ekleyip silemez, haftayı kapatamaz.
     · Grubun arşivini, masalarını, akışını, borçlarını görmez.
     · Link hafta kapanınca ve kurucu kapatınca ölür.
     · AÇIK RİSK: link iletilebilir; linki gören herkes o haftaya
       tahmin yazabilir. Kapatma düğmesi kurucunun elinde.
   ========================================================= */

let TMISAFIR = null;          // {kod, ad, haftaId, oyuncuId, yeniActi, profilId}
let TM_PENCERE = null;        // sunucudan gelen son pencere
let _tmNabiz = null;

/* ---------- linkten kodu oku ---------- */
function tmisafirOku() {
  try {
    const k = new URL(location.href).searchParams.get('tahmin');
    if (!k) return null;
    localStorage.setItem('kkd_tahmin', k);
    return k;
  } catch (e) { return null; }
}
const tmisafirKodu = () => {
  try { return tmisafirOku() || localStorage.getItem('kkd_tahmin') || null; }
  catch (e) { return null; }
};
function tmisafirBirak() {
  try { localStorage.removeItem('kkd_tahmin'); } catch (e) {}
  TMISAFIR = null; clearInterval(_tmNabiz);
  location.href = location.origin + location.pathname;
}

/* ---------- adını sorduğumuz ekran ---------- */
function tmisafirGirisEkrani(hata) {
  const eskiAd = (() => { try { return localStorage.getItem('kkd_misafir_ad') || ''; } catch (e) { return ''; } })();
  return `<div class="orta"><div style="max-width:400px;margin:0 auto;width:100%">
    <div class="center" style="margin-bottom:18px">
      <div style="font-size:40px">⚽</div>
      <div class="serif" style="font-size:22px;margin-top:6px">Tahmin Yarışması</div>
      <div class="xs dim" style="margin-top:5px">Adını yaz, haftanın maçlarına skor tahmini gir.</div>
    </div>
    <div class="card">
      ${hata ? `<div class="uyari" style="margin-bottom:12px;border-color:#8C3A3A;color:#E8B4B4">${esc(hata)}</div>` : ''}
      <div class="field"><label class="fl">Adın</label>
        <input id="tmAd" maxlength="24" value="${esc(eskiAd)}" placeholder="Ufuk"
          onkeydown="if(event.key==='Enter')tmisafirKatil()">
        <div class="xs dim" style="margin-top:6px">Sıralamada bu ad görünecek. Hesap açmıyorsun, şifre yok.
          Grupta bu adla kayıtlıysan puanların o kayda işler.</div></div>
      <button class="btn-p btn-full" id="tmBtn" style="margin-top:12px" onclick="tmisafirKatil()">Yarışmaya Katıl</button>
    </div>
    <div class="card tight xs dim">
      Tahminler açıktır: herkes birbirinin tahminini görür. <b>Maç başlayınca kilitlenir</b> —
      o andan sonra ne sen ne başkası değiştirebilir. Puan: tam skor <b>5</b> ·
      doğru sonuç + gol farkı <b>3</b> · sadece doğru sonuç <b>2</b> · toplam gol de tutarsa <b>+1</b>.
    </div>
  </div></div>`;
}

/* ---------- katılma ---------- */
async function tmisafirKatil() {
  const kod = tmisafirKodu();
  const ad2 = ($('#tmAd')?.value || '').trim();
  if (!ad2) return toast('Adını yaz', true);
  const btn = $('#tmBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="yukleniyor"></span>'; }
  try { localStorage.setItem('kkd_misafir_ad', ad2); } catch (e) {}
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      const { error } = await sb.auth.signInAnonymously();
      if (error) throw error;
    }
    const { data, error } = await sb.rpc('tahmin_misafir_katil', { p_kod: kod, p_ad: ad2 });
    if (error) throw error;
    tmPencereKur(data, kod, ad2);
    DURUM = 'tmisafir'; tmNabizKur();
    render(); window.scrollTo(0, 0);
    toast(TMISAFIR.yeniActi
      ? `Hoş geldin ${ad2} — bu adla kadroya eklendin`
      : `Hoş geldin ${ad2} — kadrodaki kaydına bağlandın`, true);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Yarışmaya Katıl'; }
    const m = hataMetni(e);
    if (/anonymous|disabled|signups/i.test(m))
      return toast('Misafir girişi Supabase panelinde açık değil — masayı kuran açmalı', true);
    if (/function|does not exist|schema/i.test(m))
      return toast('Yama 10 çalıştırılmamış', true);
    toast(m, true);
  }
}

function tmPencereKur(p, kod, ad2) {
  TM_PENCERE = p;
  TMISAFIR = {
    kod: kod || TMISAFIR?.kod,
    ad: p.ben?.ad || ad2 || TMISAFIR?.ad || 'Misafir',
    haftaId: p.hafta.id,
    oyuncuId: p.ben?.oyuncu_id || null,
    yeniActi: !!p.ben?.yeni_acti,
    profilId: p.ben?.profil_id || null
  };
}

/* ---------- misafirin ekranı ---------- */
function tmisafirEkran() {
  const p = TM_PENCERE;
  if (!p) return tmisafirGirisEkrani('Hafta okunamadı.');
  const h = p.hafta, mac = p.maclar || [], hepsi = p.tahminler || [];
  if (h.kapandi) return `<div class="card"><div class="empty">
    <div class="big">✔️</div><div class="serif" style="font-size:17px;color:var(--ink)">Hafta kapandı</div>
    <div class="sm" style="margin-top:8px">Bu haftanın tahminleri artık yazılamıyor.</div>
    <button class="btn-gh" style="margin-top:14px" onclick="tmisafirBirak()">Çık</button></div></div>`;

  const benim = kid => hepsi.find(t => t.karsilasma_id === kid && t.profil_id === TMISAFIR.profilId);
  const acik = mac.filter(k => k.acik);

  return `
  <div class="card tight" style="border-color:var(--gold)">
    <div class="row" style="gap:9px">
      <div style="font-size:20px;flex-shrink:0">⚽</div>
      <div class="grow" style="min-width:0">
        <div class="sm" style="font-weight:700">${esc(TMISAFIR.ad)}
          <span class="xs dim" style="font-weight:500">· misafir</span></div>
        <div class="xs dim">${esc(h.masa_ad || '')} · ${esc(h.ad)} · ${mac.length} maç</div>
      </div>
      <button class="btn-xs btn-gh" style="flex-shrink:0" onclick="tmisafirTazele(true)">↻</button>
    </div>
    ${TMISAFIR.yeniActi ? `<div class="xs dim" style="margin-top:8px">
      <b>${esc(TMISAFIR.ad)}</b> adıyla kadroya eklendin; puanların bu ada işleyecek.</div>` : ''}
  </div>

  <div class="card">
    <h3>${esc(h.ad)}</h3>
    <div class="xs dim" style="margin-bottom:10px">Kutulara skoru yaz, kutudan çıkınca kaydediliyor.
      ${acik.length ? `<b>${acik.length} maç</b> açık; ` : ''}maç başlayınca kilitlenir.</div>
    ${mac.map(k => tmMacSatiri(k, benim(k.id), hepsi)).join('<div class="sep" style="margin:10px -14px"></div>')}
  </div>

  ${tmPano(mac, hepsi)}

  <div class="card tight xs dim center">Tam skor <b>5</b> · doğru sonuç + gol farkı <b>3</b> ·
    sadece doğru sonuç <b>2</b> · toplam gol de tutarsa <b>+1</b>.<br>
    <b style="text-decoration:underline;cursor:pointer" onclick="tmisafirBirak()">Çık</b></div>`;
}

function tmMacSatiri(k, ben, hepsi) {
  const digerleri = hepsi.filter(t => t.karsilasma_id === k.id);
  const bitti = k.ev_skor != null && k.dep_skor != null;
  const puan = t => bitti ? tahminPuan({ ev: t.ev, dep: t.dep }, { evSkor: k.ev_skor, depSkor: k.dep_skor }) : null;
  return `<div>
    <div class="row" style="justify-content:space-between;gap:8px">
      <div class="grow" style="min-width:0">
        <div style="font-weight:600;font-size:14px" class="ell">${esc(k.ev)} – ${esc(k.deplasman)}</div>
        <div class="xs dim">${saatMetni(k.baslangic)} · ${bitti ? 'sonuçlandı' : (k.acik ? kalanMetni(k.baslangic) : 'kilitli')}</div>
      </div>
      ${bitti ? `<div class="serif" style="font-size:20px;flex-shrink:0">${k.ev_skor}–${k.dep_skor}</div>` : ''}
    </div>

    ${k.acik ? `<div class="row" style="gap:6px;margin-top:8px;align-items:center">
      <input type="number" inputmode="numeric" id="tm-e-${k.id}" min="0" max="30" value="${ben ? ben.ev : ''}" placeholder="–"
        onchange="tmYaz('${k.id}')" onkeydown="if(event.key==='Enter')this.blur()"
        style="width:56px;text-align:center;font:600 16px Georgia,serif">
      <span class="dim">–</span>
      <input type="number" inputmode="numeric" id="tm-d-${k.id}" min="0" max="30" value="${ben ? ben.dep : ''}" placeholder="–"
        onchange="tmYaz('${k.id}')" onkeydown="if(event.key==='Enter')this.blur()"
        style="width:56px;text-align:center;font:600 16px Georgia,serif">
      <span class="xs" id="tm-n-${k.id}" style="color:${ben ? 'var(--green)' : 'var(--dim)'}">${ben ? '✓ kayıtlı' : 'iki sayıyı yaz'}</span>
    </div>`
    : (ben ? `<div class="xs" style="margin-top:6px">Tahminin: <b>${ben.ev}–${ben.dep}</b>
        ${bitti ? ` · <b class="${puan(ben) > 0 ? 'pos' : 'zero'}">${puanEtiketi(puan(ben))}</b>` : ''}</div>`
      : `<div class="xs dim" style="margin-top:6px">Tahmin girmedin.</div>`)}

    ${digerleri.length ? `<div class="row wrap" style="gap:5px;margin-top:7px">${digerleri
      .slice().sort((a, b) => (a.profil_id === TMISAFIR.profilId ? -1 : 0) - (b.profil_id === TMISAFIR.profilId ? -1 : 0))
      .map(t => {
        const pu = puan(t), o = t.profil_id === TMISAFIR.profilId;
        return `<span class="pill ${pu === 5 ? 'gold' : (pu > 0 ? 'green' : (bitti ? '' : (o ? 'gold' : 'blue')))}"
          style="${o ? 'font-weight:700' : ''}">${o ? 'sen' : esc(t.ad)} ${t.ev}–${t.dep}${pu !== null ? ' ' + puanEtiketi(pu) : ''}</span>`;
      }).join('')}</div>` : ''}
  </div>`;
}

/* Misafirin gördüğü sıralama — puanı burada, ham veriden hesaplıyoruz */
function tmPano(mac, hepsi) {
  const bitmis = mac.filter(k => k.ev_skor != null && k.dep_skor != null);
  if (!bitmis.length) return '';
  const t = {};
  bitmis.forEach(k => hepsi.filter(x => x.karsilasma_id === k.id).forEach(x => {
    const p = tahminPuan({ ev: x.ev, dep: x.dep }, { evSkor: k.ev_skor, depSkor: k.dep_skor });
    if (p === null) return;
    const s = t[x.profil_id] = t[x.profil_id] || { ad: x.ad, puan: 0, tam: 0 };
    s.puan += p; if (p === 5) s.tam++;
  }));
  const sira = Object.entries(t).sort((a, b) => b[1].puan - a[1].puan || b[1].tam - a[1].tam);
  if (!sira.length) return '';
  return `<div class="card"><h3>🏆 Sıralama</h3>
    <table><thead><tr><th>Kişi</th><th>Puan</th><th>🎯</th></tr></thead><tbody>
    ${sira.map(([pid, s], i) => `<tr>
      <td><div class="row" style="gap:8px"><span class="rank ${i === 0 ? 'r1' : ''}">${i + 1}</span>
        <span style="font-weight:${pid === TMISAFIR.profilId ? 700 : 600}">${
          pid === TMISAFIR.profilId ? 'sen' : esc(s.ad)}</span></div></td>
      <td><b>${s.puan}</b></td><td>${s.tam || '–'}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ---------- yazma ---------- */
async function tmYaz(kid) {
  const not = (m, renk) => { const n = $(`#tm-n-${kid}`); if (n) { n.textContent = m; n.style.color = renk; } };
  const e = parseInt($(`#tm-e-${kid}`)?.value, 10), d = parseInt($(`#tm-d-${kid}`)?.value, 10);
  if (!Number.isInteger(e) || !Number.isInteger(d) || e < 0 || d < 0) return not('iki sayıyı yaz', 'var(--dim)');
  not('yazılıyor…', 'var(--dim)');
  try {
    const { data, error } = await sb.rpc('tahmin_misafir_yaz',
      { p_kod: TMISAFIR.kod, p_karsilasma: kid, p_ev: e, p_dep: d });
    if (error) throw error;
    TM_PENCERE = data;
    not('✓ kayıtlı', 'var(--green)');
  } catch (err) {
    const m = hataMetni(err);
    not('yazılamadı', 'var(--red)');
    if (/KILIT/i.test(m)) { toast('Maç başladı, tahmin kapandı', true); return tmisafirTazele(false); }
    toast(m, true);
  }
}

/* ---------- tazeleme ---------- */
async function tmisafirTazele(gorunur) {
  if (!TMISAFIR) return;
  try {
    const { data, error } = await sb.rpc('tahmin_misafir_pencere', { p_kod: TMISAFIR.kod });
    if (error) throw error;
    tmPencereKur(data);
    render();

}
function tmNabizKur() {
  clearInterval(_tmNabiz);

/* =========================================================
   NEYE OYNANIYOR + BORÇ TABELASI
   Her maça bir bahis yazılır (cin, çay, hesap...). Maç kapanınca
   kazanan alacaklı, kaybeden borçlu olur. Ödeme akışa işlenir ve
   tabeladan düşer — yani borç kaydı da masanın gözü önünde durur.
   ========================================================= */
const BAHISLER=[
  {ad:'Cin',            k:'🥃'},
  {ad:"Hendrick's Gin", k:'🫐'},
  {ad:'Beefeater Gin',  k:'🇬🇧'},
  {ad:'Çay',    k:'🫖'},
  {ad:'Kahve',  k:'☕'},
  {ad:'Nargile',k:'💨'},
  {ad:'Tost',   k:'🥪'},
  {ad:'Hesap',  k:'🧾'},
  {ad:'Onur',   k:'🎖️'}   // borç doğurmaz
];
const bahisIkon=ne=>(BAHISLER.find(b=>b.ad===ne)||{}).k||'🎁';
const BORCSUZ=['Onur',''];

/* Bir maçın bahsi birden çok kalem olabilir: hem hesap, hem içecek.
   ESKİ KAYIT {ne,adet} · YENİ KAYIT {kalemler:[{ne,adet},...]}
   Okuyan her yer bu iki fonksiyondan geçsin ki eski maçlar bozulmasın. */
function bahisKalemleri(b){
  if(!b) return [];
  if(Array.isArray(b.kalemler)) return b.kalemler.filter(x=>x&&x.ne)
    .map(x=>({ne:x.ne,adet:Math.max(1,Number(x.adet)||1)}));
  if(b.ne) return [{ne:b.ne,adet:Math.max(1,Number(b.adet)||1)}];
  return [];
}
const bahisBorcluKalemler=b=>bahisKalemleri(b).filter(x=>!BORCSUZ.includes(x.ne));
function bahisOzet(b){
  const k=bahisKalemleri(b);
  if(!k.length) return '';
  return k.map(x=>`${x.adet>1?x.adet+' ':''}${x.ne}`).join(' + ');
}

/* maç kurulum penceresine konan bahis seçici — ÇOKLU seçim */
function bahisSecici(varsayilan){
  const v=[].concat(varsayilan||'Cin').filter(Boolean);

      `<div class="chip ${v.includes(b.ad)?'on':''}" data-b="${b.ad}" onclick="bahisSec(this)">${b.k} ${b.ad}</div>`).join('')}</div>

/* seçilen her kalem için ayrı adet — "1 hesap + 2 cin" yazılabilsin */
function bahisAdetCiz(){

  const kap=$('#mBahisAdet');

  if(!kalemler.length) kalemler.push({ne:'Onur',adet:1});
  return {kalemler};

/* --------- tabela: maçlardan alacak/borç, akıştan ödeme --------- */
/* Borç TARAFA yazılır, kişiye değil.
   Eşli batakta kaybeden çift BİR şişe borçlanır; ikisine birer yazılırsa
   tabelada iki şişe görünür — yaşanan hata buydu. 101'de taraf tek kişidir,
   aynı mantık kendiliğinden çalışır. */
const tarafKey = ids => (ids||[]).filter(Boolean).slice().sort().join('+');
const tarafKisiler = k => String(k||'').split('+').filter(Boolean);

function borcTablosu(){
  const t={};        // "tarafKey|bahis" → bakiye (+ alacaklı, − borçlu)
  const ekle=(ids,ne,n)=>{
    const k0=tarafKey(ids); if(!k0||BORCSUZ.includes(ne)) return;
    const k=`${k0}|${ne}`; t[k]=(t[k]||0)+n;
  };

  for(const c of grupCelseleri()){
    const kalemler=bahisBorcluKalemler(c.bahis); if(!kalemler.length) continue;
    if(c.oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) continue;
      c.takimlar.forEach((tk,ti)=>
        kalemler.forEach(x=>ekle(tk.oyuncular,x.ne,ti===kz?x.adet:-x.adet)));
    }else{
      const sr=yzMac(c).sira; if(!sr.length) continue;
      kalemler.forEach(x=>{ ekle([sr[0].id],x.ne,x.adet); ekle([sr[sr.length-1].id],x.ne,-x.adet); });
    }
  }
  /* akıştaki elle borç kayıtları (devir, iddia, söz) — taraf olarak */
  (DB.akis||[]).forEach(a=>{
    const k=a.veri&&a.veri.borcKaydi;
    if(!k||!k.ne) return;
    const n=Number(k.adet)||1;
    ekle(k.borclular,k.ne,-n);
    ekle(k.alacaklilar,k.ne,n);
  });
  /* akıştaki ödemeler borcu kapatır. Eski kayıtlar tek kişi (o.kim) tutuyordu;
     yenilerde taraf (o.taraf) var. İkisi de okunuyor.

     ÖNEMLİ: ödeme İKİ tarafı da kapatır — borçlunun borcu azalır,
     ALACAKLININ alacağı da azalır. Eskiden yalnız borçlu tarafı
     düşüyordu, alacaklı ödendiği hâlde alacaklı görünüyordu.
     o.alacakli yoksa (eski kayıt) eski davranış korunuyor. */
  (DB.akis||[]).forEach(a=>{
    const o=a.veri&&a.veri.odeme;
    if(!o||!o.ne) return;
    const n=Number(o.adet)||0;
    const k0=o.taraf ? tarafKey(o.taraf) : tarafKey([o.kim]);
    if(k0) t[`${k0}|${o.ne}`]=(t[`${k0}|${o.ne}`]||0)+n;   // borçlu: eksi azalır
    if(Array.isArray(o.alacakli)&&o.alacakli.length){
      const k1=tarafKey(o.alacakli);
      if(k1) t[`${k1}|${o.ne}`]=(t[`${k1}|${o.ne}`]||0)-n; // alacaklı: artı azalır
    }
  });
  return t;
}

function borcKart(){
  const t=borcTablosu();
  const kayitlar=Object.entries(t).filter(([,v])=>v!==0)
    .map(([k,v])=>{const i=k.indexOf('|');
      return {taraf:tarafKisiler(k.slice(0,i)), ne:k.slice(i+1), v};});
  if(!kayitlar.length) return '';

  const borclu=kayitlar.filter(r=>r.v<0).sort((a,b)=>a.v-b.v);
  const alacakli=kayitlar.filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const satir=r=>`<div class="row" style="padding:6px 0;gap:9px">
    <div class="row" style="gap:-6px;flex-shrink:0">${r.taraf.map((id,i)=>
      `<span style="margin-left:${i?-9:0}px;display:inline-block">${avatar(id,28)}</span>`).join('')}</div>
    <div class="grow" style="min-width:0">

/* O bahis kaleminde alacaklı taraflar — ödemenin kime yapıldığını
   sormak için. Bakiyesi artı olan her taraf bir seçenek. */
function alacakliTaraflar(ne){
  return Object.entries(borcTablosu())
    .filter(([k,v])=>v>0&&k.slice(k.indexOf('|')+1)===ne)
    .map(([k,v])=>({ids:tarafKisiler(k.slice(0,k.indexOf('|'))),v}))
    .sort((a,b)=>b.v-a.v);
}

/* Tek seçimli çip (aynı kaptaki ötekiler kapanır) */
function chipTek(el){
  const secili=el.classList.contains('on');
  el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  if(!secili) el.classList.add('on');
}
async function borcOdeKaydet(taraf,ne,enfazla){
  const adet=Math.max(1,Math.min(enfazla,parseInt($('#boAdet').value,10)||1));
  const secili=document.querySelector('#boAlacakli .chip.on');
  let alacakli=null;
  try{ alacakli=secili?JSON.parse(secili.dataset.ids):null; }catch(e){ alacakli=null; }
  const btn=$('#boBtn'); btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>';
  const kim=liste(taraf.map(ad));
  const kime=alacakli&&alacakli.length?` ${liste(alacakli.map(ad))} lehine olan`:'';
  const metin=taraf.length>1
    ? `${kim}, ${adet} ${ne}${kime} ortak borcunu ifa etmişlerdir. Zimmetleri bu miktarda azalmıştır.`
    : `${kim}, ${adet} ${ne}${kime} borcunu ifa etmiştir. Zimmeti bu miktarda azalmıştır.`;
  const ok=await akisEkle('mesaj',metin,{odeme:{taraf,kim:taraf[0],ne,adet,alacakli}});
  if(!ok){ btn.disabled=false; btn.textContent='Ödendi Olarak İşle'; return; }
  kapatModal(); render(); toast(metin,true);
}

/* zabıta bahis satırı */
function bahisNotu(c){
  const hepsi=bahisKalemleri(c.bahis);
  if(!hepsi.length) return '';
  const borclu=bahisBorcluKalemler(c.bahis);
  if(!borclu.length)
    return `BAHİS: Maç ${hepsi[0].ne.toLocaleLowerCase('tr-TR')}una oynanmıştır; maddi bir sonuç doğmamıştır.`;
  const dokum=borclu.map(x=>`${x.adet} ${x.ne}`).join(' + ');
  const coklu=borclu.length>1 ? ' Kalemler ayrı ayrı zimmete geçirilmiştir.' : '';
  if(c.oyun==='batak'){
    const kz=c.kazanan??batakMac(c).macKazanan;
    if(kz==null) return '';
    const kayb=c.takimlar[1-kz].oyuncular.map(ad);
    return `BAHİS: ${dokum}. ${liste(kayb)} borçlanmış olup, ifa süresi bir sonraki celseye kadardır.${coklu}`;
  }
  const sr=yzMac(c).sira;
  if(!sr.length) return '';
  return `BAHİS: ${dokum}. ${ad(sr[sr.length-1].id)} borçlanmış, ${ad(sr[0].id)} alacaklı hâle gelmiştir.${coklu}`;
}

/* Masayı kuranın oyuncu kaydı — "ödemeyi yalnız X işaretler" yazısı için. */
function kurucuOyuncu(){
  const g=aktifGrup(); if(!g) return null;
  const o=DB.oyuncular.find(x=>x.masaId===g.id&&x.profilId===g.kuran);
  return o?o.id:null;
}

/* =========================================================
   BORÇLULAR HESABI — bakiye + kişi bazında EKSTRE
   Her hareket nereden geldiği belli olacak şekilde listelenir:
   hangi maç borçlandırdı, hangi ödeme düştü.
   ========================================================= */

/* Bir oyuncunun bütün hareketleri, tarihe göre */
function borcHareketleri(id){
  const h=[];
  for(const c of grupCelseleri()){
    /* bir maçta birden çok bahis kalemi olabilir (hesap + içecek);
       ekstrede her kalem ayrı hareket olarak görünür */
    const kalemler=bahisBorcluKalemler(c.bahis); if(!kalemler.length) continue;
    if(c.oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) continue;
      const ti=c.takimlar.findIndex(t=>t.oyuncular.includes(id)); if(ti<0) continue;
      const rakip=c.takimlar[1-ti].oyuncular.map(ad).join(' & ');
      /* Borç tarafa ait: eş varsa hareket ORTAK olarak gösterilir, iki kişiye
         ayrı ayrı yazılmaz. Tabeladaki bakiye de bu yüzden tek şişe. */
      const es=c.takimlar[ti].oyuncular.filter(x=>x!==id).map(ad);
      const ortakNot=es.length?` (ortak · ${es.join(' & ')} ile)`:'';
      kalemler.forEach(x=>h.push({tarih:c.tarih,sira:c._sira||'',ne:x.ne,adet:ti===kz?x.adet:-x.adet,
        ortak:es.length>0,
        aciklama:(ti===kz?'Batak galibiyeti · ':'Batak yenilgisi · ')+rakip+ortakNot,macId:c.id}));
    }else{
      const sr=yzMac(c).sira; if(!sr.length) continue;
      if(sr[0].id===id) kalemler.forEach(x=>h.push({tarih:c.tarih,sira:c._sira||'',ne:x.ne,adet:x.adet,
        aciklama:'101 birinciliği',macId:c.id}));
      else if(sr[sr.length-1].id===id) kalemler.forEach(x=>h.push({tarih:c.tarih,sira:c._sira||'',ne:x.ne,adet:-x.adet,
        aciklama:'101 sonuncululuğu',macId:c.id}));
    }
  }
  (DB.akis||[]).forEach(a=>{
    const k=a.veri&&a.veri.borcKaydi;
    if(k&&k.ne){
      const n=Number(k.adet)||1;
      const ortakNot=t=>{
        const es=(t||[]).filter(x=>x!==id).map(ad);
        return es.length?` (ortak · ${es.join(' & ')} ile)`:'';
      };
      if((k.borclular||[]).includes(id))
        h.push({tarih:(a.olusturma||'').slice(0,10),sira:a.olusturma||'',ne:k.ne,adet:-n,
          ortak:(k.borclular||[]).length>1,
          aciklama:(k.aciklama||'Borç kaydı · '+liste((k.alacaklilar||[]).map(ad))+' lehine')+ortakNot(k.borclular)});
      if((k.alacaklilar||[]).includes(id))
        h.push({tarih:(a.olusturma||'').slice(0,10),sira:a.olusturma||'',ne:k.ne,adet:n,
          ortak:(k.alacaklilar||[]).length>1,
          aciklama:'Alacak kaydı · '+liste((k.borclular||[]).map(ad))+' zimmetinde'+ortakNot(k.alacaklilar)});
    }
    const o=a.veri&&a.veri.odeme;
    if(!o) return;
    const odeyenler=o.taraf&&o.taraf.length?o.taraf:[o.kim];   // eski kayıtlar tek kişi
    if(!odeyenler.includes(id)) return;
    const digerleri=odeyenler.filter(x=>x!==id).map(ad);
    h.push({tarih:(a.olusturma||'').slice(0,10),sira:a.olusturma||'',ne:o.ne,
      adet:Number(o.adet)||0,ortak:odeyenler.length>1,
      aciklama:'Ödeme yapıldı'+(digerleri.length?` (ortak · ${digerleri.join(' & ')} ile)`:''),odeme:true});
  });
  return h.sort((x,y)=>(y.tarih+y.sira).localeCompare(x.tarih+x.sira));
}

      `<span style="margin-left:${i?-10:0}px;display:inline-block">${avatar(id,32)}</span>`).join('')}</div>

      <div style="font-weight:600;font-size:14px" class="ell">${esc(r.taraf.map(ad).join(' & '))}</div>

        onclick='borcOdeAc(${JSON.stringify(r.taraf)},${JSON.stringify(r.ne)},${Math.abs(r.v)})'>Ödedi</button>`:''}

  return `
  <div class="card">
    <h3>🥃 Borçlular Hesabı</h3>
    <div class="xs dim" style="margin-bottom:6px">Maçlardan doğan borçlar. Ödeme kaydedilince düşer ve akışa işlenir.</div>
    ${borclu.length?`<div class="xs" style="color:#DD8A8A;font-weight:700;margin:8px 0 2px">BORÇLU</div>
      ${borclu.map(satir).join('<div class="sep" style="margin:0 -14px"></div>')}`:''}
    ${alacakli.length?`<div class="sep"></div>
      <div class="xs" style="color:#8CC79B;font-weight:700;margin:2px 0">ALACAKLI</div>

  <div class="card">

    <button class="btn-g btn-full" onclick="borcOzetiAc()">📋 Hesap Özetini Kopyala</button>

  </div>
  <div class="card tight xs dim">Eşli batakta borç TARAFA yazılır: kaybeden çift birlikte

  acModal(`

      ${Object.entries(bakiye).filter(([,v])=>v!==0).map(([ne,v])=>
        `<span class="pill ${v<0?'red':'green'}">${bahisIkon(ne)} ${esc(ne)} ${v<0?Math.abs(v)+' borç':'+'+v+' alacak'}</span>`).join('')

function borcOzetiUret(){
  const g=aktifGrup()||{ad:'Masa',emoji:''};
  const t=borcTablosu();
  const kayit=Object.entries(t).filter(([,v])=>v!==0)
    .map(([k,v])=>{const i=k.indexOf('|');
      const taraf=tarafKisiler(k.slice(0,i));
      return {taraf, id:taraf[0], ne:k.slice(i+1), v};});
  const L=[`${g.emoji||''} ${String(g.ad).toLocaleUpperCase('tr-TR')} — HESAP ÖZETİ`,
           `${trh(bugun())} itibarıyla`,''];
  if(!kayit.length){ L.push('Masada açık borç bulunmamaktadır. Nadir görülen bir hâldir.'); return L.join('\n'); }
  const borclu=kayit.filter(r=>r.v<0).sort((a,b)=>a.v-b.v);
  const alacakli=kayit.filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  if(borclu.length){
    L.push('BORÇLULAR:');
    borclu.forEach(r=>L.push(`  • ${r.taraf.map(ad).join(' & ')} — ${Math.abs(r.v)} ${r.ne}${r.taraf.length>1?' (ortak)':''}`));
  }
  if(alacakli.length){
    L.push('');
    L.push('ALACAKLILAR:');
    alacakli.forEach(r=>L.push(`  • ${r.taraf.map(ad).join(' & ')} — ${r.v} ${r.ne}${r.taraf.length>1?' (ortak)':''}`));
  }
  L.push('');
  const enCok=borclu[0];
  if(enCok) L.push(`Zimmeti en kabarık olan ${ad(enCok.id)}'dir; ifa süresi bir sonraki celseye kadardır.`);
  L.push('İtiraz, ödeme belgesi ibrazıyla mümkündür.');
  return L.join('\n');
}
function borcOzetiAc(){
  const metin=borcOzetiUret();
  acModal(`<h2 class="serif" style="margin:0 0 10px">Hesap Özeti</h2>
    <div class="zabit" id="boMetin" style="font-size:13px">${esc(metin)}</div>

function mocksMasaAdiOku(){ try{ return localStorage.getItem(MOCKS_MASA_ON+'_ad')||''; }catch(e){ return ''; } }
function mocksAdresSec(no,ad){ try{ localStorage.setItem(MOCKS_MASA_ON,String(no)); localStorage.setItem(MOCKS_MASA_ON+'_ad',ad||''); }catch(e){} }
const mocksMenuUrl = ()=>'https://themocks.qr.menulux.com/?tableno='+encodeURIComponent(mocksMasaNo())+'#!/';
const MOCKS_ONBELLEK = 'kkd_mocks_menu';
const MOCKS_HESAP_ON = 'kkd_mocks_hesap';

let MOCKS = null;            // {para, kdv, gruplar:[{ad, urunler:[{id,ad,fiyat,foto}]}]}
let MOCKS_GRUP = 0;         // seçili kategori
let MOCKS_HESAP = mocksHesapOku();
/* MOCKS_MAC true iken kafe hesabı AÇIK MAÇA (celse.kafe) yazılır:
   tabelacı ekler, bulut'a gider, herkes görür, zabıta işler.
   false iken cihazdaki genel liste (MOCKS_HESAP). */
let MOCKS_MAC = false;
function mocksMacAktif(){ return MOCKS_MAC && DB.aktif && !DB.aktif.bitti; }
function mocksHesapRef(){
  if(mocksMacAktif()){ if(!Array.isArray(DB.aktif.kafe)) DB.aktif.kafe=[]; return DB.aktif.kafe; }
  return MOCKS_HESAP;
}
function mocksHesapKaydet(){
  if(mocksMacAktif()){ if(typeof kaydet==='function') kaydet(); }
  else mocksHesapYaz();
}
/* Açıcılar: maç modu (açık masaya yaz) ya da genel (cihaz). İç 'Tazele'
   mocksAc()'i çağırınca bayrak korunur. */
function mocksMacAc(){ MOCKS_MAC=true; mocksAc(); }
function mocksGenelAc(){ MOCKS_MAC=false; mocksAc(); }

/* Sık verilenler: kullanıcı listesi + otomatik öğrenilen sayaç.
   İkisi birleşip en üstte "Sık Sipariş" bölümü oluyor. */
const MOCKS_FAV_ON = 'kkd_mocks_fav';
const MOCKS_SIK = ['çay','büyük çay','kahve','türk kahve','oralet','su','kuruyemiş','fıstık','soda','çerez'];
let MOCKS_SAYAC = (()=>{ try{ return JSON.parse(localStorage.getItem(MOCKS_FAV_ON)||'{}'); }catch(e){ return {}; } })();
function mocksSayacYaz(){ try{ localStorage.setItem(MOCKS_FAV_ON,JSON.stringify(MOCKS_SAYAC)); }catch(e){} }

/* ---------------- menü çekme ---------------- */
function mocksHesapOku() {
  try { return JSON.parse(localStorage.getItem(MOCKS_HESAP_ON) || '[]'); }
  catch (e) { return []; }
}
function mocksHesapYaz() {
  try { localStorage.setItem(MOCKS_HESAP_ON, JSON.stringify(MOCKS_HESAP)); } catch (e) {}
}

function mocksAyristir(j) {
  const para = j.Currency || '₺', kdv = j.Tax || 0;
  const gruplar = (j.MenuGroup || [])
    .map(g => ({
      ad: g.Title,
      urunler: (g.Products || [])
        .filter(p => p.Status !== -1 && !p.Deleted)
        .map(p => ({
          id: p.ProductID,
          ad: p.Name || p.ProductName || '?',
          fiyat: Number(p.Price) || 0,
          desc: p.Description || '',
          foto: p.ImageUrl || ''
        }))
    }))
    .filter(g => g.urunler.length);
  return { para, kdv, gruplar, guncelleme: Date.now() };
}

async function mocksMenuGetir(zorla) {
  /* Önce önbellek (anında açılsın), sonra ağdan tazele. */
  if (!zorla) {
    try {
      const c = JSON.parse(localStorage.getItem(MOCKS_ONBELLEK) || 'null');
      if (c && c.gruplar) MOCKS = c;
    } catch (e) {}
  }
  try {
    const r = await fetch(MOCKS_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    MOCKS = mocksAyristir(await r.json());
    try { localStorage.setItem(MOCKS_ONBELLEK, JSON.stringify(MOCKS)); } catch (e) {}
    return true;
  } catch (e) {
    return !!MOCKS;      // ağ yoksa önbellekle idare et
  }
}

/* ---------------- hesap ---------------- */
const mocksTL = n => (Math.round(n) === n ? n : n.toFixed(2)) + ' ₺';
const mocksToplam = () => mocksHesapRef().reduce((t, x) => t + x.fiyat * x.adet, 0);
const mocksAdet = () => mocksHesapRef().reduce((t, x) => t + x.adet, 0);

function mocksEkle(id, ad, fiyat) {
  const h = mocksHesapRef();
  const v = h.find(x => x.id === id);
  if (v) v.adet++;
  else h.push({ id, ad, fiyat, adet: 1 });
  MOCKS_SAYAC[id]=(MOCKS_SAYAC[id]||0)+1; mocksSayacYaz();
  mocksHesapKaydet(); mocksCiz();
  toast(`${ad} eklendi`);
}
function mocksArtir(id, d) {
  const h = mocksHesapRef();
  const v = h.find(x => x.id === id); if (!v) return;
  v.adet += d;
  if (v.adet <= 0) { const i=h.indexOf(v); if(i>=0) h.splice(i,1); }
  mocksHesapKaydet(); mocksCiz();
}
function mocksTemizle() {
  const h = mocksHesapRef();
  if (!h.length) return;
  if (!confirm(mocksMacAktif()?'Bu masanın kafe hesabı sıfırlansın mı?':'Masa hesabı sıfırlansın mı? (Bu cihazdaki liste)')) return;
  h.length = 0;
  mocksHesapKaydet(); mocksCiz();
}

/* Sık sipariş: adı MOCKS_SIK'te geçenler + en çok eklenenler.
   Menüdeki gerçek ürünlerle eşleştirilir; olmayan atlanır. */
function mocksSikUrunler(){
  if(!MOCKS) return [];
  const hepsi=MOCKS.gruplar.flatMap(g=>g.urunler.map(u=>({...u,grup:g.ad})));
  const puan=u=>{
    let p=(MOCKS_SAYAC[u.id]||0)*10;                 // en çok eklediğin
    const ad=u.ad.toLocaleLowerCase('tr-TR');
    const kelime=ad.split(/[\s,()]+/);              // "su" -> "Sucuklu"a takılmasın
    if(MOCKS_SIK.some(k=>k.includes(' ')?ad.includes(k):kelime.includes(k))) p+=5;
    return p;
  };
  return hepsi.map(u=>({u,p:puan(u)})).filter(x=>x.p>0)
    .sort((a,b)=>b.p-a.p).slice(0,8).map(x=>x.u);
}

/* ---------------- ekran ---------------- */

    <div class="sm dim" style="margin-top:10px">The Mocks menüsü yükleniyor…</div></div></div>`);
  mocksMenuGetir().then(ok => {
    if (!ok) { const g = $('#mkGovde'); if (g) g.innerHTML = mocksHata(); return; }
    MOCKS_GRUP = Math.min(MOCKS_GRUP, MOCKS.gruplar.length - 1);
    mocksCiz();
  });
}
function mocksHata() {
  return `<h2 class="serif" style="margin:0 0 4px">The Mocks</h2>
    <div class="uyari" style="margin:10px 0">Menü şu an alınamadı — internet gidip gelmiş olabilir.

}

      <div><h2 class="serif" style="margin:0">The Mocks</h2>
        <div class="xs dim">Kitchen &amp; Mocktail Bar · canlı menü · KDV dahil</div></div>

        <button class="btn-xs btn-gh" style="flex-shrink:0" onclick="mocksMasaAc()">Değiştir</button>
      </div>

    ${macModu?`<div class="uyari" style="margin:0 0 10px">Bu hesap <b>açık masaya</b> yazılıyor:
      herkes görür, zabıta işler. Yalnız tabelayı tutan ekleyebilir.</div>`:''}
    ${hesap.length ? `<div class="card tight" style="margin:12px 0;border-color:var(--gold)">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <span class="sm" style="font-weight:700">🧾 ${macModu?'Bu Masanın Hesabı':'Masa Hesabı'}</span>
        <span class="serif" style="font-size:20px;color:var(--gold)">${mocksTL(top)}</span></div>
      ${hesap.map(x => `<div class="row" style="justify-content:space-between;padding:4px 0;gap:8px">
        <div class="grow sm ell">${esc(x.ad)} <span class="xs dim">${x.fiyat ? mocksTL(x.fiyat) : ''}</span></div>
        <div class="row" style="gap:6px;flex-shrink:0;align-items:center">
          <button class="btn-xs btn-gh" onclick="mocksArtir(${x.id},-1)">−</button>
          <span class="sm" style="min-width:20px;text-align:center;font-weight:700">${x.adet}</span>
          <button class="btn-xs btn-gh" onclick="mocksArtir(${x.id},1)">+</button>
          <span class="sm" style="min-width:56px;text-align:right;font-weight:600">${mocksTL(x.fiyat * x.adet)}</span>
        </div></div>`).join('')}
      <div class="two" style="margin-top:9px">
        <button class="btn-b btn-sm" onclick="mocksHesapPaylas()">📋 Hesabı Kopyala</button>
        <button class="btn-gh btn-sm" onclick="mocksTemizle()">Sıfırla</button>
      </div>
    </div>` : `<div class="xs dim" style="margin:12px 0">Aşağıdan seç; hesap burada birikir.
      Sipariş gitmez, yalnız ne içtiğinizin tutarını tutar.</div>`}

    ${(()=>{ const sik=mocksSikUrunler(); return sik.length?`
      <div class="xs dim" style="margin-bottom:6px;font-weight:700">⭐ SIK SİPARİŞ</div>
      <div class="row wrap" style="gap:6px;margin-bottom:12px">

    <div class="row wrap" style="gap:5px;margin-bottom:10px">

function mocksHesapPaylas() {
  const h = mocksHesapRef();
  if (!h.length) return;
  const L = ['🧾 THE MOCKS — Masa Hesabı', ''];
  h.forEach(x => L.push(`${x.adet}× ${x.ad}  ${mocksTL(x.fiyat * x.adet)}`));
  L.push('');
  L.push(`TOPLAM: ${mocksTL(mocksToplam())} (KDV dahil)`);
  kopyala(L.join('\n'));
}


//== mocksMasa
/* Siparis adresi (daire/masa no) ayari. Numara KULLANICIDAN gelir;
   kafenin kendi dogrulama ucuyla teyit edip adini gosteriyoruz. Yeni
   kayit ACMIYORUZ; yalniz var olani seciyoruz. Siparis gonderilmez. */
function mocksMasaAc(){
  const liste=mocksAdresler(), aktif=mocksMasaNo();
  acModal(`<h2 class="serif" style="margin:0 0 4px">Siparis Adresi</h2>
    <div class="xs dim" style="margin-bottom:12px">Daire ya da salon farketmez — kullandigin yerleri
      buraya kaydet, tek dokunusla sec. Numara masadaki/salondaki QR'da yazili ya da The Mocks'a sorarsin.
      Yeni kayit acilmaz; var olan numara hedef secilir.</div>

    ${liste.length?`<div class="xs dim" style="font-weight:700;margin-bottom:6px">KAYITLI ADRESLER</div>
      <div class="stack" style="margin-bottom:12px">${liste.map(a=>`
        <div class="row" style="gap:8px;padding:5px 0;align-items:center">
          <button class="btn-sm ${String(a.no)===String(aktif)?'btn-g':'btn-gh'}" style="flex:1;text-align:left;justify-content:flex-start"
            onclick="mocksAdresKullan('${esc(String(a.no))}',${JSON.stringify(a.ad)})">
            ${String(a.no)===String(aktif)?'✓ ':''}${esc(a.ad)} <span class="xs dim">no ${esc(String(a.no))}</span></button>
          <button class="btn-xs btn-gh" style="flex-shrink:0" onclick="mocksAdresSil('${esc(String(a.no))}')">✕</button>
        </div>`).join('')}</div>`:''}

    <div class="xs dim" style="font-weight:700;margin-bottom:6px">YENİ ADRES EKLE</div>
    <div class="field"><label class="fl">Daire / salon no</label>
      <input id="mkNo" inputmode="numeric" placeholder="örn. 241 ya da salon no"
        onkeydown="if(event.key==='Enter')mocksMasaDogrula()"></div>
    <div id="mkNoSonuc" class="xs" style="margin-top:8px"></div>
    <button class="btn-p btn-full" id="mkNoBtn" style="margin-top:12px" onclick="mocksMasaDogrula()">Dogrula ve Ekle</button>
    <button class="btn-gh btn-full btn-sm" style="margin-top:8px" onclick="mocksAc()">Kapat</button>`);
}
function mocksAdresKullan(no,ad){ mocksAdresSec(no,ad); toast(ad+' seçildi'); mocksAc(); }
function mocksAdresSil(no){
  const l=mocksAdresler().filter(a=>String(a.no)!==String(no));
  mocksAdresYaz(l);
  if(String(mocksMasaNo())===String(no)){ const y=l[0]; mocksAdresSec(y?y.no:'241', y?y.ad:''); }
  mocksMasaAc();
}
async function mocksMasaDogrula(){
  const no=($('#mkNo')?.value||'').trim();
  const sonuc=$('#mkNoSonuc'), btn=$('#mkNoBtn');
  if(!/^[0-9]+$/.test(no)){ if(sonuc){sonuc.textContent='Sadece rakam yaz';sonuc.style.color='#DD8A8A';} return; }
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>'; }
  try{
    const r=await fetch('https://menuluxmenuapi.azurewebsites.net/api/OnlineOrderAPI/GetTableByTableNo?customerID='+MOCKS_MUSTERI+'&tableNo='+encodeURIComponent(no));
    let j=null; try{ j=await r.json(); }catch(e){}
    if(!j||!j.TableID){
      if(sonuc){ sonuc.innerHTML='Bu numara The Mocks sisteminde <b>bulunamadi</b>. Dogru numarayi The Mocks\'a sor.'; sonuc.style.color='#DD8A8A'; }
      if(btn){ btn.disabled=false; btn.textContent='Dogrula ve Kaydet'; }
      return;
    }
    const ad=j.Name||j.TableName||('Daire '+no);
    const l=mocksAdresler().filter(a=>String(a.no)!==String(no));
    l.push({no,ad}); mocksAdresYaz(l);
    mocksAdresSec(no,ad);
    if(sonuc){ sonuc.innerHTML='✓ <b>'+esc(ad)+'</b> eklendi ve seçildi'; sonuc.style.color='var(--green)'; }
    toast(ad+' eklendi',true);
    setTimeout(mocksMasaAc,800);
  }catch(e){
    if(sonuc){ sonuc.textContent='Dogrulanamadi — internet gidip gelmis olabilir'; sonuc.style.color='#DD8A8A'; }
    if(btn){ btn.disabled=false; btn.textContent='Dogrula ve Kaydet'; }
  }
}

//== macKafe
/* Açık/biten maça bağlı kafe hesabı toplamı ve özeti (zabıt + PDF için) */
function macKafeToplam(c){ return (c&&Array.isArray(c.kafe)?c.kafe:[]).reduce((t,x)=>t+(Number(x.fiyat)||0)*(Number(x.adet)||0),0); }
function macKafeZabit(c){
  const k=c&&Array.isArray(c.kafe)?c.kafe:[]; if(!k.length) return '';
  const dokum=k.map(x=>`${x.adet} ${x.ad}`).join(', ');
  return `MASA HESABI: ${dokum}. Toplam ${macKafeToplam(c)} ₺ (The Mocks). Ödeme, defterin sahibi huzurunda yapılır.`;
}
/* Tabela ekranında gösterilen kısa kart */
function macKafeKart(c){
  if(!c) return '';
  const k=Array.isArray(c.kafe)?c.kafe:[];
  const yaz = c._hesap===OTURUM?.id && !c.bitti;   // yalnız tabelacı ekler
  if(!k.length && !yaz) return '';
  return `<div class="card tight">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div><div class="xs dim">☕ Masa Hesabı · The Mocks</div>
        <div class="serif" style="font-size:19px;color:var(--gold)">${k.length?macKafeToplam(c)+' ₺':'—'}</div></div>
      ${yaz?`<button class="btn-sm btn-b" onclick="mocksMacAc()">+ Çay / Kahve / Ekle</button>`:''}
    </div>
    ${k.length?`<div class="xs dim" style="margin-top:6px">${k.map(x=>`${x.adet}× ${esc(x.ad)}`).join(' · ')}</div>`:''}
  </div>`;
}

//== rapor
/* =========================================================
   GENEL SİCİL KARARI — yazdırılabilir PDF rapor

   İstek (kullanıcı): "Hesap özeti falan PDF olarak çıkamaz mı, güzelce
   bir rapor şeklinde, mahkeme kararı gibi de olabilir, fotolar falan
   her şey."

   NASIL: dış kütüphane YOK (CSP dışarıdan yüklemeye izin vermiyor).
   Rapor, tam ekran bir katman (#raporHost) olarak çiziliyor; "Yazdır"
   deyince window.print() çalışıyor, @media print yalnız raporu
   bırakıyor. Telefonda çıkan yazdırma ekranından "PDF olarak kaydet"
   seçilir. Bilgisayarda "Hedef: PDF".

   İÇERİK: kapak (dava no + tarih), kadro (fotoğraflı), Batak ve 101
   sicil tabloları, ünvanlar (şeref/utanç), borç tablosu, efsaneler.
   Hepsi mevcut veriden; ekranda ne görünüyorsa rapor onu yazıyor.
   ========================================================= */

function raporTarih(){
  const d=new Date();
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
}
function raporDavaNo(){
  const g=aktifGrup()||{};
  const kod=(g.kod||'0000').replace(/[^A-Z0-9]/gi,'').slice(0,4).toUpperCase();
  return `${new Date().getFullYear()}/${kod}`;
}

/* fotoğraflı avatar — baskıda kesin görünsün diye img etiketiyle */
function raporAvatar(id,b){
  const o=oy(id); b=b||46;
  if(o.foto) return `<img src="${esc(o.foto)}" style="width:${b}px;height:${b}px;border-radius:50%;
    object-fit:cover;border:1px solid #cbb78a" alt="">`;
  return `<div style="width:${b}px;height:${b}px;border-radius:50%;background:${o.renk||'#5a524c'};
    color:#fff;display:flex;align-items:center;justify-content:center;
    font:700 ${Math.round(b*.42)}px Georgia,serif">${esc(bas(o.ad))}</div>`;
}

/* --- sicil tablosu --- */
function raporSicil(oyun){
  const v=Object.values(istatistik(oyun)).filter(p=>p.celse>0)
    .sort((a,b)=>b.gal-a.gal||b.oran-a.oran||a.toplamPuan-b.toplamPuan);
  if(!v.length) return `<p class="rbos">Bu oyundan deftere geçmiş maç bulunmamaktadır.</p>`;
  const bat=oyun==='batak';
  const bas2=bat
    ? ['Oyuncu','Maç','Galibiyet','%','İhale','Tutan','Batan','Toplam Puan']
    : ['Oyuncu','Maç','Birincilik','%','İkincilik','Sonculuk','Toplam Ceza'];
  const sat=p=>bat
    ? [ad(p.id),p.celse,p.gal,Math.round(p.oran*100),p.ihale,p.ihaleTam,p.ihaleBat,p.toplamPuan]
    : [ad(p.id),p.celse,p.gal,Math.round(p.oran*100),p.ikinci,p.son,p.toplamPuan];
  return `<table class="rtab"><thead><tr>${bas2.map((h,i)=>`<th class="${i?'rsag':''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${v.map(p=>{const c=sat(p);
      return `<tr><td>${esc(c[0])}</td>${c.slice(1).map(x=>`<td class="rsag">${x}</td>`).join('')}</tr>`;}).join('')}</tbody></table>`;
}

/* --- ünvanlar --- */
function raporUnvan(oyun){
  const r=muayyideler(oyun).concat(genelMuayyideler());
  if(!r.length) return '';
  const sat=x=>`<div class="runv"><span class="rk">${x.k}</span>
    <b>${esc(x.ad)}</b> — <span class="rgold">${esc(unvanAd(x.kim))}</span>
    <div class="rmini">${esc(x.aciklama||'')}</div></div>`;
  const iyi=r.filter(x=>x.tip!=='kotu'), kotu=r.filter(x=>x.tip==='kotu');
  return `${iyi.length?`<h3 class="rh3">Şeref Levhası</h3>${iyi.map(sat).join('')}`:''}
    ${kotu.length?`<h3 class="rh3">Utanç Duvarı</h3>${kotu.map(sat).join('')}`:''}`;
}

/* --- borç --- */
function raporBorc(){
  const t=(typeof borcTablosu==='function')?borcTablosu():{};
  const kayit=Object.entries(t).filter(([,v])=>v!==0).map(([k,v])=>{
    const i=k.indexOf('|');
    return {taraf:tarafKisiler(k.slice(0,i)).map(ad).join(' & '),ne:k.slice(i+1),v};});
  if(!kayit.length) return `<p class="rbos">Taraflar arasında ödenmemiş bir zimmet bulunmamaktadır.</p>`;
  const borclu=kayit.filter(r=>r.v<0).sort((a,b)=>a.v-b.v);
  const alacakli=kayit.filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const sat=(r,işaret)=>`<tr><td>${esc(r.taraf)}</td><td>${esc(r.ne)}</td>
    <td class="rsag">${işaret}${Math.abs(r.v)}</td></tr>`;
  return `<table class="rtab"><thead><tr><th>Taraf</th><th>Kalem</th><th class="rsag">Adet</th></tr></thead><tbody>
    ${borclu.length?`<tr class="rgrp"><td colspan="3">BORÇLU</td></tr>${borclu.map(r=>sat(r,'−')).join('')}`:''}
    ${alacakli.length?`<tr class="rgrp"><td colspan="3">ALACAKLI</td></tr>${alacakli.map(r=>sat(r,'+')).join('')}`:''}
  </tbody></table>`;
}

//== talik
/* =========================================================
   CELSENİN TALİKİ — oyun bitmeden ara vermek

   Oyun her zaman aynı gece bitmiyor: gece ilerliyor, kalabalık
   dağılıyor, yer kapanıyor. Eskiden tek çıkış yolu "İptal" idi
   ve o tabelayı SİLİYORDU. Artık celse TALİK EDİLİYOR: tabela
   olduğu gibi duruyor, masa "talik edildi" görünüyor, oturunca
   kaldığı elden devam ediliyor.

   VERİ — şema değişmedi, hepsi celse (JSONB) içinde:
     c.talik        = {tarih, saat, kim, not}   → şu an askıda
     c.talikGecmisi = [ {tarih,saat,kim,not, devamTarih,devamSaat} ]

   Akış kaydı tip='mesaj' + veri.talik ile atılıyor; akis.tip
   sütununda CHECK listesi var ('mesaj','zabit','unvan',
   'dogumgunu','iddia','cagri') ve yeni tip eklemek SQL
   çalıştırmayı gerektirirdi. Gerek yok.

   YETKİ: arayı da devamı da TABELAYI TUTAN verir. Veritabanı
   tarafında da böyle — maclar satırını yalnız tabelacı
   güncelleyebiliyor (yama 07). Düğmeyi gizlemek süs; asıl
   engel orada.
   ========================================================= */

const TALIK_SEBEP = ['Gece ilerledi','Yemek arası','Yarın devam',
                     'Kalabalık dağıldı','Yer kapanıyor','Sabah işi var'];

const talikSaat = () => { const d=new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const talikSayisi = c => (c?.talikGecmisi||[]).length + (c?.talik?1:0);
const yazilanEl   = c => (c?.partiler||[]).reduce((t,p)=>t+((p.eller||[]).length),0);

/* Tabela ekranlarının başlığındaki ⏸️ düğmesi */
const talikDugme = () => `<button class="btn-xs btn-gh" onclick="talikAc()">⏸️ Ara</button>`;

function talikSebepSec(el){
  const secili=el.classList.contains('on');
  el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  const n=$('#tlNot'); if(!n) return;
  if(secili){ n.value=''; return; }
  el.classList.add('on'); n.value=el.dataset.s||'';
}

//== talikVer
async function talikVer(){
  const c=DB.aktif; if(!c) return;
  const btn=document.querySelector('#modalHost .btn-g');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>'; }

  /* Bekleyen gecikmeli yazma taliki ezmesin: önce onu boşalt. */
  clearTimeout(_yazZaman);
  await aktifYaz();

  c.talik={tarih:bugun(),saat:talikSaat(),kim:DB.ben||null,
           not:($('#tlNot')?.value||'').trim()};
  const {error}=await sb.from('maclar').update({celse:aktifBelge(c)}).eq('id',c.id);
  if(error){
    delete c.talik;
    if(btn){ btn.disabled=false; btn.textContent='⏸️ Ara Ver, Sonra Devam Ederiz'; }
    return toast(hataMetni(error),true);
  }

  const o=macOzet(c);
  akisEkle('mesaj', talikMetni(c), {talik:'ara',mac_id:c.id,oyun:c.oyun,
    masaAd:c.masaAd||'',skor:o.skor,sebep:c.talik.not||''}).catch(()=>{});

  kapatModal(); macBirak();
  toast('Celse talik edildi. Masalar listesinde seni bekliyor.',true);
}

//== talikDevam
async function talikDevam(id){
  const c=DB.acik.find(x=>x.id===id);
  if(!c||!c.talik) return;
  if(c._hesap!==OTURUM.id){
    const kim=DB.oyuncular.find(x=>x.profilId===c._hesap&&x.masaId===c.grupId);
    return toast(`Devam kararını tabelayı tutan ${kim?.ad||'kişi'} verir`,true);
  }
  const eski=c.talik;
  c.talikGecmisi=(c.talikGecmisi||[]).concat([Object.assign({},eski,
    {devamTarih:bugun(),devamSaat:talikSaat()})]);
  delete c.talik;

  const {error}=await sb.from('maclar').update({celse:aktifBelge(c)}).eq('id',c.id);
  if(error){ c.talik=eski; c.talikGecmisi.pop(); return toast(hataMetni(error),true); }

  akisEkle('mesaj', talikDevamMetni(c,eski), {talik:'devam',mac_id:c.id,
    oyun:c.oyun,masaAd:c.masaAd||''}).catch(()=>{});
  macSec(id);
  toast(`Celseye devam edildi. ${yazilanEl(c)}. elden sonrası yazılacak.`,true);
}

/* Tabelacı arayı bitirmeye üşenip doğrudan sayı yazmaya başladıysa
   ara fiilen bitmiştir; kaydet() bunu görüp kendi kapatır.
   Burada RENDER YAPILMAZ — mobilde yazarken odak kaçar. */
function talikKendiCozuldu(c){
  const eski=c.talik; if(!eski) return;
  c.talikGecmisi=(c.talikGecmisi||[]).concat([Object.assign({},eski,
    {devamTarih:bugun(),devamSaat:talikSaat()})]);
  delete c.talik;
  akisEkle('mesaj', talikDevamMetni(c,eski), {talik:'devam',mac_id:c.id,
    oyun:c.oyun,masaAd:c.masaAd||''}).catch(()=>{});
  toast('Yazmaya başladın; ara kendiliğinden kapandı.');
}

/* Akışa düşen mizahi metinler */

  const o=macOzet(c), n=yazilanEl(c), s=c.talik?.not;

  return `▶️ ${c.oyun==='batak'?'BATAK':'101'} celsesine DEVAM EDİLDİ. ${ne} `
       + `Tabela ${o.skor} ile açılmış, ${yazilanEl(c)}. elden sonrası yazılacaktır. `
       + rast(['Kimsenin sayıyı unutmuş olması mazeret teşkil etmez.',
               'Tabela hafızadan üstündür; itirazlar reddedilmiştir.',
               'Aradaki iddialar zamanaşımına uğramamıştır.']);
}

  return `<div class="row" style="gap:10px;align-items:flex-start">

        <span class="pill ${c.oyun==='batak'?'green':'blue'}">${c.oyun==='batak'?'BATAK':'101'}</span>
