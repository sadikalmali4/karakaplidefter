      <div class="xs dim" style="margin-top:5px">Masa unutmasın diye. O gün oynanan celsede zabta işlenir.</div></div>
    <input type="file" id="fotoInp" accept="image/*" style="display:none" onchange="fotoSec(this)">
    <button class="btn-p btn-full" id="pBtn" style="margin-top:16px"
      onclick="oyuncuKaydet('${id||''}',${benimIcin?'true':'false'})">${o?'Kaydet':'Ekle'}</button>`);
}
function fotoSec(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const B=320, cv=document.createElement('canvas'); cv.width=B; cv.height=B;
      const g=cv.getContext('2d'), k=Math.min(im.width,im.height);
      g.drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,B,B);
      _foto=cv.toDataURL('image/jpeg',.8);
      cv.toBlob(b=>{_fotoBlob=b;},'image/jpeg',.8);
      const b=$('#fotoBtn'); if(b){b.style.backgroundImage=`url('${_foto}')`;b.style.borderStyle='solid';b.innerHTML='';}
    };
    im.src=r.result;
  };
  r.readAsDataURL(f); inp.value='';
}
function fotoSil(){
  _foto=null; _fotoBlob=null;
  const b=$('#fotoBtn');
  if(b){b.style.backgroundImage='';b.style.borderStyle='dashed';b.innerHTML='Fotoğraf<br>ekle';}
}
async function oyuncuKaydet(id,benimIcin){
  const n=$('#pAd').value.trim();
  if(!n) return toast('Ad gerekli',true);
  const cak=DB.oyuncular.some(o=>o.masaId===DB.aktifGrup&&o.id!==id&&o.aktif&&
                                 o.ad.toLocaleLowerCase('tr-TR')===n.toLocaleLowerCase('tr-TR'));
  if(cak) return toast('Bu isim grupta zaten var',true);
  const dg=$('#pDogum')?.value||null;
  const btn=$('#pBtn'); btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>';
  try{
    let foto_url = id ? (oy(id).foto||null) : null;
    if(_fotoBlob){
      const yol=`masa/${DB.aktifGrup}/${(id||yid())}_${Date.now()}.jpg`;
      const {error:ye}=await sb.storage.from('avatarlar')
        .upload(yol,_fotoBlob,{contentType:'image/jpeg',upsert:true});
      if(ye) throw ye;
      foto_url=sb.storage.from('avatarlar').getPublicUrl(yol).data.publicUrl;
    }else if(_foto===null&&id){ foto_url=null; }

    if(id){
      const {error}=await sb.from('oyuncular').update({ad:n,foto_url,dogum:dg}).eq('id',id);
      if(error) throw error;
    }else{
      await oyuncuEkle(n,foto_url,dg,!!benimIcin);
    }
    _foto=null; _fotoBlob=null;
    await verileriGetir(); kapatModal(); render(); toast('Kaydedildi');
  }catch(e){ toast(hataMetni(e),true); btn.disabled=false; btn.textContent='Kaydet'; }
}
async function oyuncuEkle(adi,foto_url,dogum,benim,renk){
  const n=DB.oyuncular.filter(o=>o.masaId===DB.aktifGrup).length;
  const {data,error}=await sb.from('oyuncular').insert({
    masa_id:DB.aktifGrup, ad:adi, foto_url:foto_url||null, dogum:dogum||null,
    renk:renk||RENKLER[n%RENKLER.length], profil_id: benim?OTURUM.id:null
  }).select('id').single();
  if(error) throw error;
  return data.id;
}

/* ---------- yedek ---------- */
/* TAM yedek. Ücretsiz katmanda veritabanının geri dönüşü (PITR) yok;
   biri masayı yanlışlıkla silerse tek dayanağımız bu dosya. O yüzden
   akış (zabıtlar, mesajlar, BORÇ ÖDEMELERİ) ve tahmin verisi de giriyor —
   önceki hâlde bunlar dışarı çıkmıyordu. */
function yedekAl(){
  const g=aktifGrup();
  const hIds=(DB.haftalar||[]).filter(h=>h.masaId===DB.aktifGrup).map(h=>h.id);
  const kars=(DB.karsilasmalar||[]).filter(k=>hIds.includes(k.haftaId));
  const kIds=kars.map(k=>k.id);
  const veri={
    v:5, kaynak:'bulut', alindi:new Date().toISOString(),
    masa:g?{ad:g.ad,emoji:g.emoji,kod:g.kod,kuran:g.kuran}:null,
    ben:DB.ben, ayar:DB.ayar,
    uyeler:(MASA_UYELERI||[]).map(u=>({profilId:u.profil_id,rol:u.rol,
             ad:u.profiller?.ad||null})),
    oyuncular:DB.oyuncular.filter(o=>o.masaId===DB.aktifGrup),
    celseler:DB.celseler.filter(c=>c.grupId===DB.aktifGrup),
    acik:(DB.acik||[]).filter(c=>c.grupId===DB.aktifGrup),   // yarım kalan tabelalar
    iddialar:DB.iddialar.filter(i=>i.grupId===DB.aktifGrup),
    akis:(DB.akis||[]).filter(a=>a.grupId===DB.aktifGrup),   // zabıtlar + ödemeler burada
    haftalar:(DB.haftalar||[]).filter(h=>h.masaId===DB.aktifGrup),
    karsilasmalar:kars,
    tahminler:(DB.tahminler||[]).filter(t=>kIds.includes(t.karsilasmaId))
  };
  const say=`${veri.oyuncular.length} oyuncu · ${veri.celseler.length} maç · `+
            `${veri.iddialar.length} iddia · ${veri.akis.length} akış · `+
            `${veri.haftalar.length} tahmin haftası`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(veri,null,2)],{type:'application/json'}));
  a.download=`${(g?.ad||'masa').replace(/[^\wğüşıöçĞÜŞİÖÇ ]/g,'')}-${bugun()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Yedek indirildi: '+say,true);
}
/* Eski tek-dosya prototipin (localStorage) yedeğini bu masaya taşır.
   Oyuncular ADA göre eşlenir; masada olmayan ad yeni oyuncu olarak açılır. */
function yedekYukle(inp){
  const f=inp.files[0]; if(!f) return;
  if(!kurucuMu()){ inp.value=''; return toast('İçe aktarmayı yalnız grubu kuran yapabilir',true); }
  const r=new FileReader();
  r.onload=async()=>{
    let d;
    try{ d=JSON.parse(r.result); }catch(e){ return toast('Dosya okunamadı',true); }
    if(!d||!Array.isArray(d.oyuncular)||!Array.isArray(d.celseler)) return toast('Bu bir defter yedeği değil',true);
    const gelen=d.celseler.filter(c=>c.bitti);
    if(!confirm(`Yedekte ${d.oyuncular.length} oyuncu, ${gelen.length} kapanmış maç var.\nBu masaya EKLENECEK (mevcut kayıtlar silinmez). Devam?`)) return;
    try{
      const harita={};
      for(const o of d.oyuncular){
        const varOlan=DB.oyuncular.find(x=>x.masaId===DB.aktifGrup&&
          x.ad.toLocaleLowerCase('tr-TR')===String(o.ad||'').toLocaleLowerCase('tr-TR'));
        harita[o.id]= varOlan ? varOlan.id : await oyuncuEkle(o.ad||'Oyuncu',null,o.dogum||null,false);
      }
      let n=0;
      for(const c of gelen){
        const y=celseHaritala(JSON.parse(JSON.stringify(c)),harita);
        const {error}=await sb.from('maclar').insert({
          masa_id:DB.aktifGrup, oyun:y.oyun, giris:y.giris||'detay', tarih:y.tarih||bugun(),
          yer:y.yer||null, tabelaci_id:OTURUM.id, parti_hedef:Math.min(5,Math.max(1,y.partiHedef||1)),
          mod:y.oyun==='101'?(y.mod||'tek'):null, celse:y, bitti:true,
          kazanan:y.kazanan??null, zabit:y.zabit||null, aciklama:y.not||null });
        if(error) throw error;
        n++;
      }
      await yenile(true);
      toast(`${n} maç içeri alındı.`,true);
    }catch(e){ toast(hataMetni(e),true); }
  };
  r.readAsText(f); inp.value='';
}
function celseHaritala(c,h){
  const m=id=>h[id]||id;
  ['id','grupId','_hesap'].forEach(k=>delete c[k]);
  if(c.tabelaci) c.tabelaci=m(c.tabelaci);
  if(c.takimlar) c.takimlar.forEach(t=>t.oyuncular=t.oyuncular.map(m));
  if(c.oyuncular) c.oyuncular=c.oyuncular.map(m);
  if(c.esler) c.esler=c.esler.map(p=>p.map(m));
  if(c.oyun==='101'&&typeof c.kazanan==='string') c.kazanan=m(c.kazanan);
  if(c.hizli){
    if(Array.isArray(c.hizli.sira)) c.hizli.sira=c.hizli.sira.map(m);
    if(c.hizli.puan&&!Array.isArray(c.hizli.puan)){
      const p={}; Object.keys(c.hizli.puan).forEach(k=>p[m(k)]=c.hizli.puan[k]); c.hizli.puan=p;
    }
  }
  (c.partiler||[]).forEach(pt=>{
    if(Array.isArray(pt.kazanan)) pt.kazanan=pt.kazanan.map(m);
    (pt.eller||[]).forEach(el=>{
      if(el.durum){ const d={}; Object.keys(el.durum).forEach(k=>d[m(k)]=el.durum[k]); el.durum=d; }
    });
  });
  return c;
}
async function uyeKarar(profilId,durum){
  const {error}=await sb.from('masa_uyeleri').update({durum})
    .eq('masa_id',DB.aktifGrup).eq('profil_id',profilId);
  if(error) return toast(hataMetni(error),true);
  await yenile(true);

async function girisYap(){

async function masaKur(){

  const emoji=document.querySelector('#yMEmoji .chip.on')?.dataset.e||GRUP_EMOJI[0];
  try{
    /* Masa kurma sunucudaki masa_kur() ile yapılır: masa ve kurucu üyeliği
       aynı işlemde oluşur. Doğrudan insert edilirse RETURNING okuma kuralına
       takılır (üyelik henüz görünmediği için). Bkz. yama 01. */
    const {data,error}=await sb.rpc('masa_kur',{p_ad:adi,p_emoji:emoji});
    if(error) throw error;
    const yeni=Array.isArray(data)?data[0]:data;
    if(!yeni) throw new Error('Grup kurulamadı');
    localStorage.setItem('kkd_aktif_masa',yeni.id);
    DB.aktifGrup=yeni.id;
    await verileriGetir();

    if(!DB.ben&&PROFIL?.ad) await oyuncuEkle(PROFIL.ad,null,null,true);
    await verileriGetir(); kanalKur();
    DURUM='hazir'; kapatModal(); render();
    kodPaylas(grup(yeni.id));
  }catch(e){ toast(hataMetni(e),true); }

function akisKisi(profilId){
  const o=DB.oyuncular.find(x=>x.masaId===DB.aktifGrup&&x.profilId===profilId);
  if(o) return {ad:o.ad,foto:o.foto,renk:o.renk};
  const u=MASA_UYELERI.find(x=>x.profil_id===profilId);
  return {ad:u?.profiller?.ad||'birisi',foto:u?.profiller?.foto_url||null,renk:u?.profiller?.renk||'#5a524c'};
}
function avatarKisi(k,b){
  b=b||30;
  if(k.foto) return `<div class="avatar" style="width:${b}px;height:${b}px;background-image:url('${esc(k.foto)}')"></div>`;
  return `<div class="avatar" style="background:${esc(k.renk)};width:${b}px;height:${b}px;font-size:${Math.round(b*.43)}px">${esc(bas(k.ad))}</div>`;
}
function ne_zaman(iso){
  const t=new Date(iso), fark=(Date.now()-t.getTime())/1000;
  if(fark<60) return 'az önce';
  if(fark<3600) return Math.floor(fark/60)+' dk';
  if(fark<86400) return Math.floor(fark/3600)+' sa';
  if(fark<172800) return 'dün';
  const g=String(t.getDate()).padStart(2,'0'), a=String(t.getMonth()+1).padStart(2,'0');
  return `${g}.${a}`;
}

/* --------- yazma --------- */
async function akisEkle(tip,metin,veri,yanitId){
  const {data,error}=await sb.from('akis').insert({
    masa_id:DB.aktifGrup, tip, yazan_id:OTURUM.id,
    metin:metin||null, veri:veri||{}, yanit_id:yanitId||null
  }).select('id,tip,yazan_id,metin,veri,olusturma,yanit_id').single();
  if(error){ toast(hataMetni(error),true); return null; }
  DB.akis.unshift({id:data.id,grupId:DB.aktifGrup,tip:data.tip,yazanId:data.yazan_id,
    metin:data.metin,veri:data.veri||{},olusturma:data.olusturma,yanitId:data.yanit_id,tepkiler:[]});
  return data.id;
}
let _akFotoData=null, _akFotoBlob=null;
function akFotoSec(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const im=new Image();
    im.onload=()=>{
      /* En uzun kenar 1200 px; oran korunur (kare kırpma yok — foto). */
      const enb=1200, o=Math.min(1,enb/Math.max(im.width,im.height));
      const w=Math.round(im.width*o), h=Math.round(im.height*o);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      _akFotoData=cv.toDataURL('image/jpeg',.82);
      cv.toBlob(b=>{_akFotoBlob=b;},'image/jpeg',.82);
      const el=$('#akFotoOnizle'); if(el) el.innerHTML=`<div style="position:relative;display:inline-block">
        <img src="${_akFotoData}" style="max-width:100%;max-height:200px;border-radius:10px;border:1px solid var(--line)">
        <button class="btn-xs btn-dn" style="position:absolute;top:6px;right:6px" onclick="akFotoSil()">✕</button></div>`;
    }; im.src=r.result; };
  r.readAsDataURL(f); inp.value='';
}

async function tepkiVer(akisId,emoji,sessiz){
  const a=DB.akis.find(x=>x.id===akisId); if(!a) return;
  a.tepkiler=a.tepkiler||[];
  const varMi=a.tepkiler.find(t=>t.profilId===OTURUM.id&&t.emoji===emoji);
  if(varMi){
    a.tepkiler=a.tepkiler.filter(t=>!(t.profilId===OTURUM.id&&t.emoji===emoji));

    const {error}=await sb.from('akis_tepkileri').delete()
      .eq('akis_id',akisId).eq('profil_id',OTURUM.id).eq('emoji',emoji);
    if(error) toast(hataMetni(error),true);
  }else{
    a.tepkiler.push({profilId:OTURUM.id,emoji});
    if(!sessiz) render();
    const {error}=await sb.from('akis_tepkileri')
      .insert({akis_id:akisId,profil_id:OTURUM.id,emoji});
    if(error) toast(hataMetni(error),true);
  }

async function kadroKur(){
  const btn=$('#kdBtn'); if(btn){btn.disabled=true;}
  let eklenen=0, hata=0;
  try{
    const k=await fetch('kurulum/kadro.json',{cache:'no-store'}).then(r=>r.json());
    const varOlan=DB.oyuncular.filter(o=>o.masaId===DB.aktifGrup)
      .map(o=>o.ad.toLocaleLowerCase('tr-TR'));
    const bendeOyuncuVar=!!DB.ben;
    const yeni=k.oyuncular.filter(o=>!varOlan.includes(o.ad.toLocaleLowerCase('tr-TR')));

    for(let i=0;i<yeni.length;i++){
      const o=yeni[i];
      if(btn) btn.innerHTML=`<span class="yukleniyor"></span> ${i+1}/${yeni.length} · ${esc(o.ad)}`;
      try{
        let foto_url=null;
        if(o.foto){
          const blob=await fetch('kurulum/'+o.foto,{cache:'no-store'}).then(r=>r.blob());
          const yol=`masa/${DB.aktifGrup}/${o.kad||yid()}_${Date.now()}.jpg`;
          const {error:ye}=await sb.storage.from('avatarlar')
            .upload(yol,blob,{contentType:'image/jpeg',upsert:true});
          if(ye) throw ye;
          foto_url=sb.storage.from('avatarlar').getPublicUrl(yol).data.publicUrl;
        }
        /* "ben" işaretli oyuncu bu hesaba bağlanır — ama zaten bağlıysam dokunma */
        /* Lakap ada GÖMÜLMÜYOR: ayar.lakaplar'da tutulur, aşağıda işlenir.
           Ada gömülse her zabıtta tırnak içinde çıkar, metni kirletir. */
        await oyuncuEkle(o.ad,foto_url,o.dogum||null,!!o.ben&&!bendeOyuncuVar,o.renk||null);
        eklenen++;
      }catch(e){ hata++; console.warn(o.ad,e); }
    }
    /* lakapları ada göre eşleştirip ayara yaz (oyuncular oluştuktan sonra) */
    if(kurucuMu()){
      await verileriGetir();
      const m=Object.assign({},lakaplar());
      let lk=0;
      for(const o of k.oyuncular){
        if(!o.lakap) continue;
        const oy=grupOyunculari().find(x=>
          x.ad.toLocaleLowerCase('tr-TR')===o.ad.toLocaleLowerCase('tr-TR'));
        if(oy && m[oy.id]!==o.lakap){ m[oy.id]=o.lakap; lk++; }
      }
      if(lk){ DB.ayar.lakaplar=m; await ayarYaz(true); }
    }
  }catch(e){ toast(hataMetni(e),true); }
  await verileriGetir(); kapatModal(); render();
  toast(hata?`${eklenen} oyuncu eklendi, ${hata} tanesi olmadı.`:`${eklenen} oyuncu eklendi.`,!!hata);
}

/* =========================================================
   DAVET — kişiye özel link, onay beklemeden içeri
   ========================================================= */
let DAVET=null;

/* Davet, sayfa yenilenince kaybolmamalı.
   Mobilde bu çok oluyor: kişi linke dokunuyor, WhatsApp'ın içindeki
   tarayıcı açılıyor, uygulamayı arka plana atıp dönünce sekme yeniden
   yükleniyor. Adres çubuğunu temizlediğimiz için kod da gidiyordu ve
   kişiye "grup kodu" sorulmaya başlıyordu. O yüzden daveti saklıyoruz. */
const DAVET_ANAHTAR='kkd_davet';
const DAVET_OMUR=7*24*3600*1000;          // 7 gün

function davetYaz(d){ try{ localStorage.setItem(DAVET_ANAHTAR,JSON.stringify(d)); }catch(e){} }
function davetSil(){ try{ localStorage.removeItem(DAVET_ANAHTAR); }catch(e){} }

function davetOku(){
  const q=new URLSearchParams(location.search);
  const kod=q.get('kod');
  if(kod){
    DAVET={kod:kod.toUpperCase(),oyuncu:q.get('oyuncu')||null,
           ad:q.get('ad')||'',kad:q.get('kad')||'',ts:Date.now()};
    davetYaz(DAVET);
    /* adres çubuğunu temizle: link paylaşılınca kimlik bilgisi taşınmasın */
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
  }else{
    /* linkte yok ama saklanmış bir davet olabilir */
    try{
      const d=JSON.parse(localStorage.getItem(DAVET_ANAHTAR)||'null');
      if(d&&d.kod&&(Date.now()-(d.ts||0))<DAVET_OMUR) DAVET=d;
      else if(d) davetSil();          // bayat davet sonraki oturumu kaçırmasın
    }catch(e){ davetSil(); }
  }
  if(DAVET&&(DAVET.ad||DAVET.kad)) GIRIS_MOD='kayit';
}

async function davetiIsle(){
  if(!DAVET||!OTURUM) return;
  const d=DAVET; DAVET=null;
  try{
    if(d.oyuncu){
      const {data,error}=await sb.rpc('davetle_katil',{p_kod:d.kod,p_oyuncu:d.oyuncu});
      if(error) throw error;
      const r=Array.isArray(data)?data[0]:data;
      DB.aktifGrup=r.masa_id;
      localStorage.setItem('kkd_aktif_masa',r.masa_id);
      davetSil();                     // kullanıldı
      await verileriGetir(); kanalKur();
      toast(`Hoş geldin ${r.oyuncu_ad}. ${r.masa_ad} grubundasın.`);
    }else{
      const {data,error}=await sb.rpc('masaya_katil',{p_kod:d.kod});
      if(error) throw error;
      const r=Array.isArray(data)?data[0]:data;
      davetSil();
      await verileriGetir(); kanalKur();
      toast(r?.durum==='onayli'?`${r.masa_ad} grubundasın.`
        :`${r?.masa_ad||'Grup'} için istek gönderildi, kurucu onaylayacak.`, r?.durum!=='onayli');
    }
  }catch(e){
    /* İnternet koptuysa davet dursun, bir dahaki açılışta yine denenir.
       Ama davet geçersizse boşuna sormaya devam etmesin. */
    const m=String(e&&e.message||'');
    if(/kod|bulunamad|gecersiz|geçersiz|kullanıl/i.test(m)) davetSil();
    else DAVET=d;
    toast(hataMetni(e),true);
  }
}

let GECMIS_OYUN='batak';
let GC_A=[], GC_B=[], GC_SIRA=[], GC_PUAN={};

function gecmisAc(oyun){

/* ---------------- BATAK ---------------- */
function gcBatakGovde(){
  const oyn=grupOyunculari();
  const cip=(takim)=>oyn.map(p=>{
    const bende=(takim==='A'?GC_A:GC_B).includes(p.id);
    const otekide=(takim==='A'?GC_B:GC_A).includes(p.id);
    return `<div class="chip ${bende?'on':''}" style="${otekide?'opacity:.3;pointer-events:none':''}"
      onclick="gcTakim('${takim}','${p.id}')">${avatar(p.id,20)}${esc(p.ad)}</div>`;
  }).join('');

  const pa=GC_PUAN.A, pb=GC_PUAN.B;
  const kz = (Number.isFinite(pa)&&Number.isFinite(pb)&&pa!==pb) ? (pa>pb?0:1)
           : (GC_PUAN.kazanan!=null?GC_PUAN.kazanan:null);
  const T=l=>l.length?l.map(ad).join(' & '):'—';

  return `
  <div class="field"><label class="fl"><span class="pill green">A</span> A takımı — 2 kişi
    <span class="dim" style="text-transform:none;letter-spacing:0">(${GC_A.length}/2)</span></label>

    <span class="dim" style="text-transform:none;letter-spacing:0">(${GC_B.length}/2)</span></label>
    <div class="row wrap">${cip('B')}</div></div>

  <div class="card tight" style="margin:12px 0 0;background:var(--panel2)">
    <div class="row" style="justify-content:space-between;gap:8px">
      <div class="sm"><span class="pill green">A</span> ${esc(T(GC_A))}</div>
      <div class="sm"><span class="pill blue">B</span> ${esc(T(GC_B))}</div>
    </div></div>

  <div class="field" style="margin-top:12px"><label class="fl">Toplam puan</label>
    <div class="two">
      <div><input type="number" inputmode="numeric" placeholder="A puanı" value="${pa??''}"
        onchange="gcPuan('A',this.value)"></div>
      <div><input type="number" inputmode="numeric" placeholder="B puanı" value="${pb??''}"
        onchange="gcPuan('B',this.value)"></div>
    </div>
    <div class="xs dim" style="margin-top:5px">Eski defterdeki toplamı yaz. Kazanan buradan anlaşılır.</div></div>

  ${kz!=null?`<div class="uyari" style="margin-top:12px">🏆 Kazanan: <b>${esc(T(kz===0?GC_A:GC_B))}</b>
    ${(Number.isFinite(pa)&&Number.isFinite(pb))?`(${pa}–${pb})`:''}</div>`
   :`<div class="field" style="margin-top:12px"><label class="fl">Kazanan takım</label>
      <div class="seg">
        <button class="${GC_PUAN.kazanan===0?'on':''}" onclick="gcPuan('kazanan',0)">A takımı</button>
        <button class="${GC_PUAN.kazanan===1?'on':''}" onclick="gcPuan('kazanan',1)">B takımı</button></div>
      <div class="xs dim" style="margin-top:5px">Puanı hatırlamıyorsan sadece kazananı seç, yeter.</div></div>`}

  <details style="margin-top:10px"><summary>Parti skorunu da yazayım</summary><div class="two">
    <div><label class="fl">A parti</label><input type="number" min="0" max="9" placeholder="2"
      value="${GC_PUAN.pA??''}" onchange="gcPuan('pA',this.value)"></div>
    <div><label class="fl">B parti</label><input type="number" min="0" max="9" placeholder="1"
      value="${GC_PUAN.pB??''}" onchange="gcPuan('pB',this.value)"></div>
  </div></details>`;
}
function gcTakim(takim,id){
  const bu = takim==='A'?GC_A:GC_B;
  const i=bu.indexOf(id);
  if(i>=0) bu.splice(i,1);
  else{
    if(bu.length>=2) return toast('Takımda 2 kişi olur — birini çıkar',true);
    bu.push(id);
  }
  gcCiz();
}
function gcPuan(alan,v){
  if(alan==='kazanan') GC_PUAN.kazanan=Number(v);
  else{
    const n=parseInt(v,10);
    GC_PUAN[alan]=Number.isFinite(n)?n:undefined;
  }
  gcCiz();
}

function gcYzSec(id){
  const i=GC_SIRA.indexOf(id);
  if(i>=0) GC_SIRA.splice(i,1);
  else{
    if(GC_SIRA.length>=6) return toast('En fazla 6 oyuncu',true);
    GC_SIRA.push(id);
  }
  gcCiz();
}
function gcYzPuan(id,v){
  const n=Number(v);
  GC_PUAN[id]= (v===''||v==null)?undefined:(Number.isFinite(n)?n:0);
}
function gcTasi(i,d){
  const j=i+d;
  if(j<0||j>=GC_SIRA.length) return;
  [GC_SIRA[i],GC_SIRA[j]]=[GC_SIRA[j],GC_SIRA[i]];
  gcCiz();
}

/* ---------------- kaydet ---------------- */
async function gecmisKaydet(){
  const o=GECMIS_OYUN, tarih=$('#gcTarih').value;
  if(!tarih) return toast('Tarih gerekli',true);
  if(tarih>bugun()) return toast('İleri tarihli maç olmaz',true);

  const c={oyun:o,giris:'hizli',masaAd:'Geçmiş',tarih,yer:$('#gcYer').value.trim(),
           tabelaci:DB.ben||null,partiHedef:o==='batak'?2:1,not:$('#gcNot').value.trim(),
           bahis:bahisOku(),partiler:[{eller:[],kazanan:null}]};

  if(o==='batak'){
    if(GC_A.length!==2||GC_B.length!==2) return toast('Her takımda 2 kişi olmalı',true);
    const pa=GC_PUAN.A, pb=GC_PUAN.B;
    let kz;
    if(Number.isFinite(pa)&&Number.isFinite(pb)&&pa!==pb) kz = pa>pb?0:1;
    else if(GC_PUAN.kazanan===0||GC_PUAN.kazanan===1) kz = GC_PUAN.kazanan;
    else return toast('Kazanan takımı seç ya da puanları yaz',true);

    let sA=GC_PUAN.pA, sB=GC_PUAN.pB;
    if(!Number.isFinite(sA)||!Number.isFinite(sB)||sA===sB){ sA=kz===0?2:1; sB=kz===0?1:2; }
    else if((sA>sB)!==(kz===0)) return toast('Parti skoru kazanan takımla çelişiyor',true);

    c.takimlar=[{ad:'A',oyuncular:GC_A.slice()},{ad:'B',oyuncular:GC_B.slice()}];
    c.hizli={partiSkor:[sA,sB],puan:[Number.isFinite(pa)?pa:0,Number.isFinite(pb)?pb:0]};
    c.kazanan=kz;
    if(!c.tabelaci) c.tabelaci=GC_A[0];
  }else{
    if(GC_SIRA.length<3) return toast('101 için en az 3 oyuncu gerekli',true);
    const puan={};
    GC_SIRA.forEach(id=>{ puan[id]= GC_PUAN[id]===undefined?null:GC_PUAN[id]; });
    c.mod='tek'; c.oyuncular=GC_SIRA.slice(); c.esler=null;
    c.hizli={sira:GC_SIRA.slice(),puan};
    c.kazanan=GC_SIRA[0];
    if(!c.tabelaci) c.tabelaci=GC_SIRA[0];
  }

  const btn=$('#gcBtn'); btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>';
  try{
    c.zabit=zabitUret(c);
    const {data,error}=await sb.from('maclar').insert({
      masa_id:DB.aktifGrup, oyun:o, giris:'hizli', tarih, yer:c.yer||null,
      tabelaci_id:OTURUM.id, parti_hedef:c.partiHedef, mod:o==='101'?'tek':null,
      celse:JSON.parse(JSON.stringify(c)), bitti:true,
      kazanan:c.kazanan??null, zabit:c.zabit, aciklama:c.not||null
    }).select('id,olusturma').single();
    if(error) throw error;
    Object.assign(c,{id:data.id,grupId:DB.aktifGrup,bitti:true,_hesap:OTURUM.id,_sira:data.olusturma});
    DB.celseler.push(c);
    /* Geçmiş maçlar akışa DÜŞMEZ: arka arkaya 20 tane girilince akış çöp olur. */
    GC_A=[];GC_B=[];GC_SIRA=[];GC_PUAN={};
    kapatModal(); ARSIV_FILTRE='hepsi'; git('arsiv');
    toast(`${trh(tarih)} maçı deftere geçti. Sicil yeniden hesaplandı.`,true);
  }catch(e){
    toast(hataMetni(e),true);
    btn.disabled=false; btn.textContent='Deftere Geçir';
  }
}

/* =========================================================
   ARAMIZDA — ikili sicil, kabuslar, eş uyumu
   "Kim kime karşı ne durumda" masada en çok konuşulan şey;
   burada kayda geçer ve kimse hafızasına güvenemez.
   ========================================================= */

/* Her İKİLİ için karşılıklı sicil: a, b'ye karşı kaç kazandı/kaybetti */
function ikiliSicil(oyun){
  const m={};                                  // "a|b" (a<b) → {a:kazanma, b:kazanma}
  const anahtar=(x,y)=>x<y?`${x}|${y}`:`${y}|${x}`;
  const kur=(x,y)=>{const k=anahtar(x,y); return m[k]=m[k]||{k,x:(x<y?x:y),y:(x<y?y:x),xg:0,yg:0};};

  for(const c of grupCelseleri().filter(c=>c.oyun===oyun)){
    if(oyun==='batak'){
      const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) continue;
      const A=c.takimlar[0].oyuncular, B=c.takimlar[1].oyuncular;
      A.forEach(a=>B.forEach(b=>{
        const r=kur(a,b);
        const aKazandi = kz===0;
        if((r.x===a)===aKazandi) r.xg++; else r.yg++;
      }));
    }else{
      const sr=yzMac(c).sira;
      for(let i=0;i<sr.length;i++) for(let j=i+1;j<sr.length;j++){
        const p=sr[i], q=sr[j], r=kur(p.id,q.id);       // p daha iyi sırada
        if(r.x===p.id) r.xg++; else r.yg++;
      }
    }
  }
  return Object.values(m).filter(r=>r.xg+r.yg>0);
}

/* Batak: EŞ olarak birlikte oynayan ikililerin uyumu */
function esSicil(){
  const m={};
  const kur=(x,y)=>{const k=x<y?`${x}|${y}`:`${y}|${x}`; return m[k]=m[k]||{x,y,g:0,mgl:0};};
  for(const c of grupCelseleri().filter(c=>c.oyun==='batak')){
    const kz=c.kazanan??batakMac(c).macKazanan; if(kz==null) continue;
    c.takimlar.forEach((t,ti)=>{
      if(t.oyuncular.length<2) return;
      const r=kur(t.oyuncular[0],t.oyuncular[1]);
      if(ti===kz) r.g++; else r.mgl++;
    });
  }
  return Object.values(m).filter(r=>r.g+r.mgl>0);
}

const husumetLafi=f=>
  f>=4 ? 'artık sahibi sayılır'
: f===3 ? 'üstünlük tescillidir'
: f===2 ? 'ağırlığını koymuştur'
: f===1 ? 'kıl payı önde'
: 'kimse öne geçemedi, husumet sürüyor';

function aramizdaKart(oyun){
  const ik=ikiliSicil(oyun);
  if(!ik.length) return '';

  /* en çok karşı karşıya gelenler */
  const ezeli=ik.slice().sort((a,b)=>(b.xg+b.yg)-(a.xg+a.yg)).slice(0,5);

  /* herkesin kabusu: en çok kaybettiği rakip (en az 3 karşılaşma) */
  const kabus={};
  ik.forEach(r=>{
    const ekle=(kim,rakip,g,mg)=>{
      if(g+mg<3||mg<=g) return;
      const f=mg-g;
      if(!kabus[kim]||f>kabus[kim].f) kabus[kim]={rakip,g,mg,f};
    };
    ekle(r.x,r.y,r.xg,r.yg);
    ekle(r.y,r.x,r.yg,r.xg);
  });
  const kabusList=Object.entries(kabus).sort((a,b)=>b[1].f-a[1].f).slice(0,5);

  /* batak eş uyumu */
  const es=oyun==='batak'?esSicil().filter(r=>r.g+r.mgl>=2):[];
  const kanka=es.slice().sort((a,b)=>(b.g-b.mgl)-(a.g-a.mgl))[0];
  const ugursuz=es.slice().sort((a,b)=>(a.g-a.mgl)-(b.g-b.mgl))[0];

  const satir=r=>{
    const one=r.xg>=r.yg, ilk=one?r.x:r.y, son=one?r.y:r.x;
    const g=one?r.xg:r.yg, mg=one?r.yg:r.xg;
    return `<div class="row" style="padding:7px 0;gap:8px">
      ${avatar(ilk,26)}
      <div class="grow" style="min-width:0">
        <div style="font-size:13.5px;font-weight:600" class="ell">${esc(ad(ilk))} <span class="dim">vs</span> ${esc(ad(son))}</div>
        <div class="xs dim">${g+mg} karşılaşma · ${esc(husumetLafi(g-mg))}</div></div>
      ${avatar(son,26)}
      <div style="min-width:62px;text-align:right">
        <div class="serif" style="font-size:16px">
          <b class="${g>mg?'pos':'zero'}">${g}</b><span class="dim">–</span><b class="${mg>g?'neg':'zero'}">${mg}</b></div>
        <div class="bar" style="margin-top:3px"><i style="width:${Math.round(g/Math.max(1,g+mg)*100)}%;background:var(--gold)"></i></div>
      </div>
    </div>`;
  };

  return `
  <div class="card">
    <h3>⚔️ Aramızda · ${oyun==='batak'?'Batak':'101'}</h3>
    <div class="xs dim" style="margin-bottom:8px">En çok karşı karşıya gelenler. Rakamlar hafızadan güçlüdür.</div>
    ${ezeli.map(satir).join('<div class="sep" style="margin:0 -14px"></div>')}
  </div>

  ${kabusList.length?`<div class="card">
    <h3>😰 Kabuslar</h3>
    <div class="xs dim" style="margin-bottom:8px">Karşısına oturunca eli titreyenler. En az 3 karşılaşma şartı vardır.</div>
    ${kabusList.map(([kim,k])=>`<div class="row" style="padding:7px 0;gap:9px">
      ${avatar(kim,28)}
      <div class="grow" style="min-width:0">
        <div style="font-size:13.5px;font-weight:600" class="ell">${esc(ad(kim))}</div>
        <div class="xs" style="color:#DD8A8A">kabusu: <b>${esc(ad(k.rakip))}</b> · ${k.g}–${k.mg}</div></div>
      ${avatar(k.rakip,28)}
    </div>`).join('')}
  </div>`:''}

  ${(kanka&&kanka.g>kanka.mgl)||(ugursuz&&ugursuz.mgl>ugursuz.g)?`<div class="card">
    <h3>🤝 Eş Uyumu</h3>
    ${(kanka&&kanka.g>kanka.mgl)?`<div class="rozet" style="margin-bottom:8px"><div class="k">🫂</div>
      <div class="grow"><div style="font-weight:700;font-size:13.5px">Kanka</div>
        <div style="font-size:12.5px;color:var(--gold)">${esc(ad(kanka.x))} &amp; ${esc(ad(kanka.y))}</div>
        <div class="xs muted">Eş olarak ${kanka.g} galibiyet, ${kanka.mgl} yenilgi. Birbirini gözünden anlamaktadırlar.</div></div></div>`:''}
    ${(ugursuz&&ugursuz.mgl>ugursuz.g)?`<div class="rozet"><div class="k">🪦</div>
      <div class="grow"><div style="font-weight:700;font-size:13.5px">Uğursuz Eşleşme</div>
        <div style="font-size:12.5px;color:#DD8A8A">${esc(ad(ugursuz.x))} &amp; ${esc(ad(ugursuz.y))}</div>
        <div class="xs muted">Eş olarak ${ugursuz.g} galibiyet, ${ugursuz.mgl} yenilgi. Bu ikilinin bir daha eş düşmemesi masanın yararınadır.</div></div></div>`:''}
  </div>`:''}`;
}

/* Zabıta iliştirilen rekabet notu: bu maç ikili siciller ne yaptı */
function aramizdaNotu(c){
  const ik=ikiliSicil(c.oyun);
  if(!ik.length) return '';
  const ilgili = c.oyun==='batak' ? c.takimlar.flatMap(t=>t.oyuncular) : (c.oyuncular||[]);
  const bizim=ik.filter(r=>ilgili.includes(r.x)&&ilgili.includes(r.y));
  const carpici=bizim.filter(r=>Math.abs(r.xg-r.yg)>=3)
    .sort((a,b)=>Math.abs(b.xg-b.yg)-Math.abs(a.xg-a.yg))[0];
  if(!carpici) return '';
  const one=carpici.xg>carpici.yg;
  const ilk=one?carpici.x:carpici.y, son=one?carpici.y:carpici.x;
  const g=one?carpici.xg:carpici.yg, mg=one?carpici.yg:carpici.xg;
  return `${ad(ilk)}, ${ad(son)} karşısında ${g}-${mg} öne geçmiştir. ${ad(son)}'in bu husustaki beyanları kayda geçirilmemiştir.`;
}

async function efsaneSil(i){
  if(!kurucuMu()) return toast('Yetkin yok',true);
  const e=efsaneler()[i]; if(!e) return;
  if(!confirm(`"${e.baslik}" silinsin mi?`)) return;
  DB.ayar.efsaneler=efsaneler().filter((_,j)=>j!==i);
  await ayarYaz(true);
  render(); toast('Silindi');
}

async function efsaneSeed(){
  if(!kurucuMu()) return toast('Yetkin yok',true);
  try{
    const d=await fetch('kurulum/efsaneler.json',{cache:'no-store'}).then(r=>r.json());
    // Aynı başlıklı efsane varsa ÜZERİNE BİRLEŞTİR: sonradan eklenen
    // fotoğraf/video/vurgu alanları mevcut kayda da işlensin.
    const mevcut=efsaneler().slice();
    let yeni=0, guncel=0;
    for(const e of (d.efsaneler||[])){
      const j=mevcut.findIndex(x=>x.baslik===e.baslik);
      if(j<0){ mevcut.push(e); yeni++; }
      else{
        const onceki=JSON.stringify(mevcut[j]);
        mevcut[j]=Object.assign({},mevcut[j],e);
        if(JSON.stringify(mevcut[j])!==onceki) guncel++;
      }
    }
    if(!yeni&&!guncel) return toast('Hazır efsaneler zaten güncel');
    DB.ayar.efsaneler=mevcut;
    await ayarYaz(true);
    render();
    toast(`${yeni} efsane eklendi, ${guncel} tanesi güncellendi.`);
  }catch(e){ toast('Efsane dosyası okunamadı',true); }
}

/* --------- maç kurulumunda uyarı ---------
   Aynı takıma düşen ikili hakkında yazılmış efsane varsa göster. */
function efsaneUyari(takimlar){
  const l=efsaneler().filter(e=>(e.adlar||[]).length>=2);
  if(!l.length||!takimlar) return '';
  const cikti=[];
  for(const e of l){
    const ids=(e.adlar||[]).map(a=>adaGoreOyuncu(a)?.id).filter(Boolean);
    if(ids.length<2) continue;
    const ayniTakim=takimlar.some(t=>ids.every(id=>t.includes(id)));
    if(ayniTakim) cikti.push(e);
  }
  if(!cikti.length) return '';
  return cikti.map(e=>`<div class="uyari" style="margin-top:10px">
    ⚠️ <b>${esc(e.baslik)}</b> — ${esc(e.metin)}</div>`).join('');
}

//== anilar
/* =========================================================
   ANILAR ALBÜMÜ — grubun fotoğraf hafızası

   İstek (kullanıcı, 03.09.2026): arkadaş grubu için anılar albümü.

   Akışta paylaşılan bütün fotoğraflar (veri.foto) tek bir ızgarada

function anilarFotolari(){

    .filter(a=>a.grupId===DB.aktifGrup && a.veri && a.veri.foto)

/* Albüme doğrudan foto ekleme — akışa foto'lu mesaj olarak yazar */
let _anFotoData=null, _anFotoBlob=null;
function anilarEkle(){ document.getElementById('anFotoInp')?.click(); }
function anilarFotoSec(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const im=new Image();
    im.onload=()=>{
      const enb=1200, o=Math.min(1,enb/Math.max(im.width,im.height));
      const w=Math.round(im.width*o), h=Math.round(im.height*o);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      _anFotoData=cv.toDataURL('image/jpeg',.82);
      cv.toBlob(b=>{_anFotoBlob=b;},'image/jpeg',.82);
      const el=$('#anOnizle'); if(el) el.innerHTML=`
        <div style="margin-top:10px"><img src="${_anFotoData}"
          style="max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line)"></div>
        <input id="anNot" maxlength="80" placeholder="Bir not… (isteğe bağlı)" style="margin-top:8px">
        <div class="two" style="margin-top:8px">
          <button class="btn-p btn-sm" id="anBtn" onclick="anilarKaydet()">Albüme Ekle</button>
          <button class="btn-gh btn-sm" onclick="anilarVaz()">Vazgeç</button>
        </div>`;
    }; im.src=r.result; };
  r.readAsDataURL(f); inp.value='';
}
function anilarVaz(){ _anFotoData=null; _anFotoBlob=null; const el=$('#anOnizle'); if(el) el.innerHTML=''; }
async function anilarKaydet(){
  if(!_anFotoBlob) return;
  const not=($('#anNot')?.value||'').trim();
  const btn=$('#anBtn'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>'; }
  try{
    const yol=`masa/${DB.aktifGrup}/anilar/${OTURUM.id}_${Date.now()}.jpg`;
    const {error}=await sb.storage.from('avatarlar')
      .upload(yol,_anFotoBlob,{contentType:'image/jpeg',upsert:true});
    if(error) throw error;
    const url=sb.storage.from('avatarlar').getPublicUrl(yol).data.publicUrl;
    const id=await akisEkle('mesaj',not,{foto:url,anilar:true});
    if(!id) throw new Error('kaydedilemedi');
    anilarVaz(); render(); toast('Anı albüme eklendi',true);
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Albüme Ekle'; }
    toast('Eklenemedi: '+hataMetni(e),true);
  }
}

//== ceza
/* =========================================================
   CEZA DEFTERİ — masanın mizahi müeyyideleri

   İstek (kullanıcı, 03.09.2026): arkadaş grubu için ceza defteri.
   "Kim ne yaptı, cezası ne." Uygulamanın hukuk-mizah diline birebir
   oturuyor.

   VERİ — şema değişmedi: akış 'mesaj' + veri.ceza = {kim, sebep, ceza,
   infaz}. Ödeme/borç gibi kısıtlı DEĞİL; masanın her üyesi ceza
   yazabilir (yama 11 yalnız veri.odeme/borcKaydi'yi kurucuya kısıyor).
   İnfaz işaretini yazan kişi kaldırır (akış düzeltme kuralı: kendi
   satırın).
   ========================================================= */

const CEZA_ORNEK = [
  'Bir tur çay ısmarlar',
  'Kaçmakan hesabı öder',
  'Sonraki maçta eş seçemez',
  'Bir el herkese kağıt dağıtır',
  'Telefonu masaya koyar; kaldırırsa ceza katlanır',
  'Bir hafta "Dayı" der',
  'Nargileyi o söyler'
];

function cezalar(){
  return (DB.akis||[])
    .filter(a=>a.grupId===DB.aktifGrup && a.veri && a.veri.ceza)
    .sort((a,b)=>String(b.olusturma).localeCompare(String(a.olusturma)));
}

function cezaKart(){
  const list=cezalar();
  const bekleyen=list.filter(a=>!a.veri.ceza.infaz);
  const bitmis=list.filter(a=>a.veri.ceza.infaz);

  const sat=a=>{
    const c=a.veri.ceza, benimki=a.yazanId===OTURUM.id||kurucuMu();
    const kesen=akisKisi(a.yazanId);
    return `<div class="rozet" style="margin:2px 0;align-items:flex-start">
      ${c.kim?avatar(c.kim,30):'<div class="k">⚖️</div>'}
      <div class="grow" style="min-width:0">
        <div style="font-weight:700;font-size:13.5px">${c.kim?esc(ad(c.kim)):'Masa'}
          ${c.infaz?'<span class="pill green" style="margin-left:4px">infaz edildi</span>':'<span class="pill" style="margin-left:4px">bekliyor</span>'}</div>
        <div class="sm" style="margin-top:2px">${esc(c.sebep||'')}</div>
        <div class="xs" style="color:var(--gold);margin-top:2px">⚖️ ${esc(c.ceza||'')}</div>
        <div class="xs dim" style="margin-top:2px">${esc(kesen.ad)} kaydetti · ${ne_zaman(a.olusturma)}</div>
      </div>
      ${benimki?`<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
        <button class="btn-xs ${c.infaz?'btn-gh':'btn-g'}" onclick="cezaInfaz('${a.id}',${c.infaz?'false':'true'})">${c.infaz?'Geri al':'İnfaz et'}</button>
        <button class="btn-xs btn-dn" onclick="akisSil('${a.id}')">Sil</button></div>`:''}
    </div>`;
  };

  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div><h3 style="margin:0">⚖️ Ceza Defteri</h3>
        <div class="xs dim">Masanın müeyyideleri. İtiraz, çay demlenmiş iken yapılır.</div></div>
      <button class="btn-b btn-sm" style="flex-shrink:0" onclick="cezaEkleAc()">+ Ceza Kes</button>
    </div>
    ${!list.length?`<div class="sep"></div><div class="sm dim">Henüz kimse ceza yemedi.
      İlk müeyyideyi kesmek sana düşer.</div>`:''}
    ${bekleyen.length?`<div class="sep"></div>
      <div class="xs" style="color:#DD8A8A;font-weight:700;margin:4px 0">İNFAZ BEKLEYEN (${bekleyen.length})</div>
      <div class="stack">${bekleyen.map(sat).join('')}</div>`:''}
    ${bitmis.length?`<details style="margin-top:10px"><summary>İnfaz edilenler (${bitmis.length})</summary>
      <div class="stack" style="margin-top:8px">${bitmis.map(sat).join('')}</div></details>`:''}
  </div>`;
}

function cezaEkleAc(){
  const oyn=DB.oyuncular.filter(o=>o.masaId===DB.aktifGrup&&o.aktif);
  acModal(`<h2 class="serif" style="margin:0 0 4px">Ceza Kes</h2>
    <div class="xs dim" style="margin-bottom:12px">Kim, ne yaptı, cezası ne? Masa görür, defterе geçer.</div>
    <div class="field"><label class="fl">Kime</label>
      <div class="row wrap" id="czKim" style="gap:6px">
        ${oyn.map(o=>`<span class="chip" data-id="${o.id}" onclick="chipTek(this)">${esc(o.ad)}</span>`).join('')}
      </div></div>
    <div class="field"><label class="fl">Ne yaptı? (gerekçe)</label>
      <input id="czSebep" maxlength="80" placeholder="Örn. masaya geç geldi"></div>
    <div class="field"><label class="fl">Ceza</label>
      <input id="czCeza" maxlength="80" placeholder="Örn. bir tur çay ısmarlar">
      <div class="row wrap" style="gap:5px;margin-top:7px">
        ${CEZA_ORNEK.map(c=>`<span class="chip" onclick="document.getElementById('czCeza').value=${JSON.stringify(c)}">${esc(c)}</span>`).join('')}
      </div></div>
    <button class="btn-p btn-full" id="czBtn" style="margin-top:14px" onclick="cezaKaydet()">Deftere Geçir</button>
    <button class="btn-gh btn-full btn-sm" style="margin-top:8px" onclick="kapatModal()">Vazgeç</button>`);
}

async function cezaKaydet(){
  const kim=document.querySelector('#czKim .chip.on')?.dataset.id||null;
  const sebep=($('#czSebep')?.value||'').trim();
  const ceza=($('#czCeza')?.value||'').trim();
  if(!sebep) return toast('Gerekçe yaz',true);
  if(!ceza) return toast('Ceza yaz',true);
  const btn=$('#czBtn'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="yukleniyor"></span>'; }
  const metin=`${kim?ad(kim):'Masa'} — ${sebep}. Müeyyide: ${ceza}.`;
  const id=await akisEkle('mesaj',metin,{ceza:{kim,sebep,ceza,infaz:false}});
  if(!id){ if(btn){ btn.disabled=false; btn.textContent='Deftere Geçir'; } return; }
  kapatModal(); render(); toast('Ceza deftere geçti',true);
}

async function cezaInfaz(id,durum){
  const a=(DB.akis||[]).find(x=>x.id===id); if(!a||!a.veri.ceza) return;
  const yeni=Object.assign({},a.veri,{ceza:Object.assign({},a.veri.ceza,{infaz:durum})});
  const {error}=await sb.from('akis').update({veri:yeni}).eq('id',id);
  if(error) return toast(hataMetni(error),true);
  a.veri=yeni; render();
  toast(durum?'İnfaz edildi':'İnfaz geri alındı');
}

/* =========================================================
   TABELA — kâğıttaki hâliyle
   İki sütun, alt alta sayılar, altta toplam. Bir sütun hedefe
   (61) varınca parti biter. Artırma/azaltma düğmesi yok; sayı
   doğrudan yazılır. Batakta eksi de yazılabilir (örn. -7).

   Satırlar parti.eller içine {ham:[a,b]} olarak girer; böylece
   parti/maç/zabıt motorları hiç değişmeden çalışır.

   Hücre değişince TAM ÇİZİM YAPILMAZ — yalnız toplam ve yeni satır
   güncellenir. Yoksa mobilde her dokunuşta odak kaçar.
   ========================================================= */

/* Batak'ta ceza/ödül YOKTUR (ev kuralı, 02.09.2026): iki sütun, yazılan sayı,
   altta toplam. Ceza/ödül yalnız 101'de var. */
const TB_IZGARA='display:grid;grid-template-columns:26px 1fr 1fr;gap:7px;align-items:center';

function hamSatirlar(p){
  return (p.eller||[]).map(el=>{
    if(Array.isArray(el.ham)) return [Number(el.ham[0])||0, Number(el.ham[1])||0];
    const x=batakElPuan(el,DB.ayar.batak);      // detaylı satır da gösterilebilsin
    return [x[0],x[1]];
  });
}
function tbAktifParti(){ return batakMac(DB.aktif).aktif; }

function tbHucre(r,i,deger,kilit){
  return `<input type="number" inputmode="numeric" data-r="${r}" data-i="${i}"
    value="${deger===''?'':deger}" ${kilit?'disabled':''} placeholder="·"
    onchange="tbYaz(${r},${i},this.value)" onkeydown="tbTus(event,${r},${i})"
    style="width:100%;text-align:center;font:600 17px/1 Georgia,serif;padding:9px 2px;
      background:${kilit?'transparent':'var(--panel2)'};
      border-color:${kilit?'transparent':'var(--line)'}">`;
}
function tbSatirHtml(r,cift,kilit){
  return `<div style="${TB_IZGARA};margin-bottom:5px" data-satir="${r}">
    <div class="xs dim center">${r+1}</div>
    ${tbHucre(r,0,cift?cift[0]:'',kilit)}${tbHucre(r,1,cift?cift[1]:'',kilit)}
  </div>`;
}
function tbToplamHtml(){
  const c=DB.aktif, a=DB.ayar.batak, parti=tbAktifParti();
  const {top}=batakPartiToplam(parti);
  const pKz=batakPartiKazanan(parti);
  const yuz=i=>Math.min(100,Math.max(0,top[i]/a.hedef*100));
  return `<div style="${TB_IZGARA}">
    <div class="xs dim center">Σ</div>
    ${[0,1].map(i=>`<div class="center">
      <div class="serif" style="font-size:30px;line-height:1;
        color:${pKz===i?'var(--gold)':(top[i]<0?'var(--red)':'var(--ink)')}">${top[i]}</div>
      <div class="bar" style="margin-top:6px"><i style="width:${yuz(i)}%;
        background:${i?'var(--blue)':'var(--accent2)'}"></i></div>
    </div>`).join('')}
  </div>
  <div class="xs dim center" style="margin-top:7px">hedef ${a.hedef} · ${parti.eller.length} el yazıldı</div>`;
}

function batakTabela(){
  const c=DB.aktif, a=DB.ayar.batak, m=batakMac(c);
  const parti=m.aktif, pIdx=m.aktifIdx;
  const {top}=batakPartiToplam(parti);
  const pKz=batakPartiKazanan(parti);
  const pAd=partiAd(c,pIdx), cikis=pAd==='Çıkıştırma';
  const T=i=>c.takimlar[i].oyuncular.map(ad).join(' & ');
  const satir=hamSatirlar(parti);
  const bitti=pKz!==null;

  return `
  ${MISAFIR?'':macSerit(c)}
  ${MISAFIR?'':kurtarmaKontrol(c)}
  ${MISAFIR?'':misafirCagriKart(c)}
  ${talikBanner(c)}
  ${MISAFIR?'':macKafeKart(c)}
  <div class="card ${cikis?'cikis':''}">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
      <div style="flex:1 1 150px;min-width:0"><div class="serif" style="font-size:17px">${cikis?'🔥 ':''}${pAd}</div>
        <div class="xs dim">${trh(c.tarih)}${c.yer?' · '+esc(c.yer):''}${c.tabelaci?' · ✍️ '+esc(ad(c.tabelaci)):''}</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;flex:1 1 auto;min-width:0;justify-content:flex-end">
        ${MISAFIR?'':`<button class="btn-xs btn-gh" onclick="macBirak()">← Masalar</button>
        <button class="btn-xs btn-gh" onclick="devretAc()">✍️ Devret</button>
        <button class="btn-xs btn-gh" onclick="misafirPaylasAc()">📱 Paylaş</button>
        ${talikDugme()}
        <button class="btn-xs btn-dn" onclick="celseIptal()">İptal</button>`}
      </div>
    </div>

    <div class="sep"></div>

    <div style="${TB_IZGARA};align-items:end">
      <div></div>
      ${[0,1].map(i=>`<div class="center">
        <div><span class="pill ${i?'blue':'green'}">${c.takimlar[i].ad}</span></div>
        <div class="xs" style="font-weight:600;margin-top:3px;line-height:1.3">${esc(T(i))}</div>
      </div>`).join('')}
    </div>

    <div style="height:1px;background:var(--line);margin:9px 0"></div>

    <div id="tbGovde">
      ${satir.map((cift,r)=>tbSatirHtml(r,cift,bitti)).join('')}
      ${bitti?'':tbSatirHtml(satir.length,null,false)}

    <div style="height:2px;background:var(--line);margin:8px 0"></div>
    <div id="tbToplam">${tbToplamHtml()}</div>

    ${satir.length&&!bitti?`<button class="btn-sm btn-dn btn-full" style="margin-top:11px"
      onclick="tbSonSatirSil()">Son satırı sil</button>`:''}

    ${bitti?`<div class="sep"></div><div class="center">
      <div class="serif" style="color:var(--gold);font-size:16px">${esc(T(pKz))} partiyi aldı</div>
      <div class="xs dim" style="margin-top:2px">${top[pKz]} – ${top[1-pKz]}</div>
      ${/* batakMac, kapatılmamış partiyi de sayıyor — üstüne +1 eklenirse
            ilk partide maç bitmiş sanılır. Olduğu gibi karşılaştır. */''}
      ${m.partiSkor[pKz]>=c.partiHedef
        ?(MISAFIR
          ?`<div class="xs dim center" style="margin-top:11px">Parti doldu. Maçı <b>tabelacı</b> bitirir.</div>`
          :`<button class="btn-g btn-full" style="margin-top:11px" onclick="partiKapat(true)">Maçı Bitir → Zabıt</button>`)
        :`<button class="btn-g btn-full" style="margin-top:11px" onclick="partiKapat(false)">Partiyi Kapat → Sonraki Parti</button>`}
      </div>`:''}
  </div>

  ${sureKarti(c)}
  ${gecmisPartiler(c)}

  ${!MISAFIR&&!bitti&&satir.length?`<div class="card tight center">
    <button class="btn-gh btn-sm" onclick="celseKapat()">Yarıda kes, tabelayı olduğu gibi kapat</button></div>`:''}
  <div class="card tight center xs dim">Sayıyı olduğu gibi yaz; batakta eksi de yazılır (örn. −7).
    İhale, koz ve şlem dökümü tutulacaksa masa <b>İhaleli</b> açılmalı.</div>`;
}

/* =========================================================
   101 TABELASI — oyuncu başına bir sütun
   Her el o oyuncunun aldığı sayı doğrudan yazılır (bitirdi −101,
   açamadı +200, elinde kalan +X … hangisi olduysa sayısı yazılır).
   elSayisi (11) el dolunca parti biter; toplamı en DÜŞÜK olan alır.
   ========================================================= */
function yzIzgara(n){ return `display:grid;grid-template-columns:24px repeat(${n},minmax(58px,1fr));gap:6px;align-items:center`; }

function yzHamSatir(el,c){
  if(el && el.ham) return c.oyuncular.map(id=>Number(el.ham[id])||0);
  return c.oyuncular.map(id=>yzElPuan(el,id));
}
function yzHucre(r,id,deger,kilit){
  return `<input type="number" inputmode="numeric" data-r="${r}" data-oy="${id}"
    value="${deger===''?'':deger}" ${kilit?'disabled':''} placeholder="·"
    onchange="yzTbYaz(${r},'${id}',this.value)" onkeydown="yzTbTus(event,${r},'${id}')"
    style="width:100%;text-align:center;font:600 15px/1 Georgia,serif;padding:9px 1px;
      background:${kilit?'transparent':'var(--panel2)'};
      border-color:${kilit?'transparent':'var(--line)'}">`;
}
function yzTbSatirHtml(r,degerler,kilit,c){
  return `<div style="${yzIzgara(c.oyuncular.length)};margin-bottom:5px" data-satir="${r}">
    <div class="xs dim center">${r+1}</div>
    ${c.oyuncular.map((id,k)=>yzHucre(r,id,degerler?degerler[k]:'',kilit)).join('')}
  </div>`;
}
function yzTbToplamHtml(){
  const c=DB.aktif, a=DB.ayar.yz, parti=yzMac(c).aktif;
  const top=yzPartiToplam(parti,c);
  const N=a.elSayisi||11, doldu=parti.eller.length>=N;
  const en=Math.min(...c.oyuncular.map(id=>top[id]));
  return `<div style="${yzIzgara(c.oyuncular.length)}">
    <div class="xs dim center">Σ</div>
    ${c.oyuncular.map(id=>`<div class="center serif" style="font-size:22px;line-height:1;
      color:${doldu&&top[id]===en?'var(--gold)':(top[id]<0?'var(--green)':'var(--ink)')}">${top[id]}</div>`).join('')}
  </div>
  <div class="xs dim center" style="margin-top:7px">${parti.eller.length} / ${N} el · düşük puan iyidir</div>`;
}

function yzTabela(){
  const c=DB.aktif, a=DB.ayar.yz, m=yzMac(c);
  const parti=m.aktif, pIdx=m.aktifIdx;
  const N=a.elSayisi||11;
  const pAd=partiAd(c,pIdx), cikis=pAd==='Çıkıştırma';
  const satir=(parti.eller||[]).map(el=>yzHamSatir(el,c));
  const doldu=parti.eller.length>=N;
  const top=yzPartiToplam(parti,c);
  const pKz=doldu?yzPartiKazanan(parti,c):null;
  const sonParti=doldu&&pKz&&((m.partiKaz[pKz[0]]||0)>=c.partiHedef);

  return `
  ${MISAFIR?'':macSerit(c)}
  ${MISAFIR?'':kurtarmaKontrol(c)}
  ${MISAFIR?'':misafirCagriKart(c)}
  ${talikBanner(c)}
  ${MISAFIR?'':macKafeKart(c)}
  <div class="card ${cikis?'cikis':''}">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
      <div style="flex:1 1 150px;min-width:0"><div class="serif" style="font-size:17px">${cikis?'🔥 ':''}${pAd}</div>
        <div class="xs dim">${trh(c.tarih)}${c.yer?' · '+esc(c.yer):''}${c.tabelaci?' · ✍️ '+esc(ad(c.tabelaci)):''}
          ${c.mod==='esli'?' · eşli':''}</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;flex:1 1 auto;min-width:0;justify-content:flex-end">
        ${MISAFIR?'':`<button class="btn-xs btn-gh" onclick="macBirak()">← Masalar</button>
        <button class="btn-xs btn-gh" onclick="devretAc()">✍️ Devret</button>
        <button class="btn-xs btn-gh" onclick="misafirPaylasAc()">📱 Paylaş</button>
        ${talikDugme()}
        <button class="btn-xs btn-dn" onclick="celseIptal()">İptal</button>`}
      </div>
    </div>

    <div class="sep"></div>

    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <div style="min-width:${24+c.oyuncular.length*64}px">
        <div style="${yzIzgara(c.oyuncular.length)};align-items:end">
          <div></div>
          ${c.oyuncular.map(id=>`<div class="center">
            ${avatar(id,22)}
            <div class="xs ell" style="font-weight:600;margin-top:3px">${esc(ad(id))}</div>
          </div>`).join('')}
        </div>

        <div style="height:1px;background:var(--line);margin:9px 0"></div>

        <div id="yzGovde">
          ${satir.map((d,r)=>yzTbSatirHtml(r,d,doldu,c)).join('')}
          ${doldu?'':yzTbSatirHtml(satir.length,null,false,c)}
        </div>

        <div style="height:2px;background:var(--line);margin:8px 0"></div>
        <div id="yzToplam">${yzTbToplamHtml()}</div>
      </div>
    </div>

    ${satir.length&&!doldu?`<button class="btn-sm btn-dn btn-full" style="margin-top:11px"
      onclick="yzTbSonSatirSil()">Son satırı sil</button>`:''}

    ${doldu?`<div class="sep"></div><div class="center">
      <div class="serif" style="color:var(--gold);font-size:16px">${esc(liste((pKz||[]).map(ad)))} partiyi aldı</div>
      <div class="xs dim" style="margin-top:2px">sonuncu ${esc(ad(c.oyuncular.slice().sort((x,y)=>top[y]-top[x])[0]))}</div>
      ${c.partiHedef<=1||sonParti

function yzTbYaz(r,id,deger){
  const c=DB.aktif; if(!c) return;
  const parti=yzMac(c).aktif;
  const bos=String(deger).trim()==='';
  const v=bos?0:(parseInt(deger,10)||0);

  while(parti.eller.length<=r) parti.eller.push({ham:{}});
  const el=parti.eller[r];
  if(!el.ham) el.ham={};
  el.ham[id]=v;

  /* sondaki tamamen boş satırları at */
  while(parti.eller.length){
    const e=parti.eller[parti.eller.length-1];
    const bosMu = e.ham && c.oyuncular.every(x=>!e.ham[x]);
    if(bosMu) parti.eller.pop(); else break;
  }
  parti.kazanan=null;
  kaydet();

  const N=DB.ayar.yz.elSayisi||11;
  if(parti.eller.length>=N){ render(); return; }
  yzTbTazele();
}

}

/* --- hücreye yazma --- */
function tbYaz(r,i,deger){
  const c=DB.aktif; if(!c) return;
  const parti=tbAktifParti();
  const bos=String(deger).trim()==='';
  const v=bos?0:(parseInt(deger,10)||0);

  while(parti.eller.length<=r) parti.eller.push({ham:[0,0]});
  const el=parti.eller[r];
  if(!Array.isArray(el.ham)) el.ham=[0,0];
  el.ham[i]=v;

  /* sondaki tamamen boş satırları at — yanlışlıkla açılmış satır kalmasın */
  while(parti.eller.length){
    const e=parti.eller[parti.eller.length-1];
    if(Array.isArray(e.ham) && !e.ham[0] && !e.ham[1]) parti.eller.pop(); else break;
  }
  parti.kazanan=null;
  kaydet();                                  // buluta gecikmeli yazar

  if(batakPartiKazanan(parti)!==null){ render(); return; }   // parti bitti

//== sure
/* =========================================================
   OYUN SÜRESİ — parti parti sayaç

   İstek (kullanıcı, 03.09.2026): "Canlı izlerken oyuna süre de koyar
   mısın, sayaç olsun; ilk parti şu kadar, ikinci parti şu kadar,
   toplam süre gibi. Sadece istatistik bilgi açısından."

   VERİ — şema değişmedi, damgalar celse içinde:
     parti.basla  → o partinin İLK eli yazıldığı an
     parti.son    → o partiye en son yazma anı
     parti.bitis  → parti kapatıldığı an
   Damgayı kaydet() atıyor (tek yazma yolu), parti kapanışını
   partiKapat/celseKapat atıyor.

   ESKİ KAYITLAR: damgası yok. Uydurmuyoruz — "—" gösteriyoruz.
   Süre bir istatistik; puanı, sırayı, borcu etkilemiyor.
   ========================================================= */

const SURE_BICIM = ms => {
  if (!(ms > 0)) return '—';
  const dk = Math.round(ms / 60000);
  if (dk < 1) return 'yeni başladı';
  if (dk < 60) return dk + ' dk';
  const sa = Math.floor(dk / 60), kalan = dk % 60;
  return kalan ? `${sa} sa ${kalan} dk` : `${sa} sa`;
};
const _an = t => { const d = new Date(t || 0); return isNaN(d) ? 0 : d.getTime(); };

/* Bir partinin süresi. Açık partide "şu ana kadar". */
function partiSuresi(p) {
  const b = _an(p?.basla);
  if (!b) return { ms: 0, suruyor: false };
  const s = _an(p?.bitis) || _an(p?.son);
  const kapali = !!p?.bitis;
  return { ms: Math.max(0, (kapali ? s : Date.now()) - b), suruyor: !kapali };
}
/* Maçın toplam süresi = PARTİ SÜRELERİNİN TOPLAMI.
   İlk baştan sona duvar saati DEĞİL: celse talik edilip gece
   beklerse "toplam 24 sa" gibi anlamsız bir sayı çıkıyordu.
   Aradaki molalar sayılmıyor, masada oynanan süre sayılıyor.
   kapaliMs: bitmiş partilerin toplamı (sayaç bunun üstüne ekliyor). */
function macSuresi(c) {
  let kapaliMs = 0, acikBas = 0;
  (c?.partiler || []).forEach(p => {
    if (!_an(p.basla)) return;
    if (p.bitis) kapaliMs += Math.max(0, _an(p.bitis) - _an(p.basla));
    else acikBas = _an(p.basla);
  });
  if (!kapaliMs && !acikBas) return { ms: 0, suruyor: false, kapaliMs: 0, acikBas: 0 };
  const ms = kapaliMs + (acikBas ? Math.max(0, Date.now() - acikBas) : 0);
  return { ms, suruyor: !!acikBas, kapaliMs, acikBas };
}

/* --------------------------------------------------------------
   Süre kartı — canlı izlemede ve tabelacının ekranında
   -------------------------------------------------------------- */
function sureKarti(c, baslikGoster) {
  const ps = c?.partiler || [];
  if (!ps.some(p => p.basla)) return '';          // eski kayıt: damga yok
  const t = macSuresi(c);
  return `<div class="card tight">
    ${baslikGoster === false ? '' : '<div class="xs dim" style="margin-bottom:7px">⏱️ SÜRE</div>'}
    ${ps.map((p, i) => {
      const s = partiSuresi(p);
      if (!s.ms && !s.suruyor) return '';
      return `<div class="row" style="justify-content:space-between;padding:3px 0">
        <span class="sm ${s.suruyor ? '' : 'dim'}">${partiAd(c, i)}${s.suruyor ? ' <span class="canli"></span>' : ''}</span>
        <span class="sm" style="font-weight:600">${
          s.suruyor ? `<span class="sureSayac" data-bas="${esc(p.basla)}">${SURE_BICIM(s.ms)}</span>` : SURE_BICIM(s.ms)}</span>
      </div>`;
    }).join('')}
    ${ps.filter(p => p.basla).length > 1 ? `<div class="row" style="justify-content:space-between;
        padding:6px 0 0;margin-top:4px;border-top:1px solid var(--line)">
      <span class="sm" style="font-weight:700">Toplam</span>
      <span class="sm" style="font-weight:700;color:var(--gold)">${
        t.suruyor ? `<span class="sureSayac" data-taban="${t.kapaliMs}" data-bas="${new Date(t.acikBas).toISOString()}">${
          SURE_BICIM(t.ms)}</span>` : SURE_BICIM(t.ms)}</span>
    </div>` : ''}
    <div class="xs dim" style="margin-top:7px">Her partide ilk sayının yazıldığı andan itibaren. Partiler arası molalar sayılmaz.</div>
  </div>`;
}

/* Saniyede bir yalnız sayaç metnini tazeler — tam çizim yapmaz,
   yoksa yazarken odak kaçar. */
let _sureTik = null;
function sureTikBasla() {
  clearInterval(_sureTik);
  _sureTik = setInterval(() => {
    const n = document.querySelectorAll('.sureSayac');
    if (!n.length) { clearInterval(_sureTik); _sureTik = null; return; }
    n.forEach(x => {
      const taban = Number(x.dataset.taban) || 0;
      x.textContent = SURE_BICIM(taban + (Date.now() - _an(x.dataset.bas)));
    });
  }, 1000);
}

/* --------------------------------------------------------------
   Damgalama — kaydet() ve parti kapanışından çağrılıyor
   -------------------------------------------------------------- */
function sureDamgala(c) {
  if (!c) return;
  const p = (c.partiler || [])[(c.partiler || []).length - 1];
  if (!p || !(p.eller || []).length) return;
  const simdi = new Date().toISOString();
  if (!p.basla) p.basla = simdi;
  p.son = simdi;
}
function sureKapat(p) {
  if (!p) return;
  if (p.basla && !p.bitis) p.bitis = new Date().toISOString();
}

/* Zabıta düşen satır */
function sureZabitNotu(c) {
  const ps = (c?.partiler || []).filter(p => p.basla);
  if (!ps.length) return '';
  const t = macSuresi(c);
  if (ps.length === 1) return `SÜRE: Celse ${SURE_BICIM(t.ms)} sürmüştür.`;
  /* Toplam = parti sürelerinin toplamı; aradaki molalar sayılmaz. */
  const dokum = (c.partiler || []).map((p, i) => {
    const s = partiSuresi(p);
    return s.ms ? `${partiAd(c, i)} ${SURE_BICIM(s.ms)}` : null;
  }).filter(Boolean).join(', ');
  return `SÜRE: Celse toplam ${SURE_BICIM(t.ms)} sürmüştür (${dokum}).`;
}

/* =========================================================
   SEZON — yıllık
   Sicil sonsuza kadar toplanırsa bir süre sonra tepedeki değişmez ve
   heyecan biter. Sezon takvim yılıdır; yıl her maçın tarihinde zaten
   yazılı olduğu için ne yeni tablo ne göç gerekti.

   SEZONA BAĞLI : Sicil, unvanlar, kürsü, oyuncu kartı
   HER ZAMAN TOPLAM : Rekorlar Kitabı, Aramızda, Borç Hesabı, İddia,
                      Arşiv — rekor, husumet ve borç yıl başında sıfırlanmaz.

   Şampiyonlar masalar.ayar.sampiyonlar'da tutulur; kalıcı unvandır.
   ========================================================= */

let SEZON=null;                      // null → içinde bulunduğumuz yıl
const buYil=()=>String(new Date().getFullYear());
const aktifSezon=()=>SEZON||buYil();

/* kayıtlı yıllar, yeniden eskiye */
function sezonYillari(){
  const y=[...new Set(grupCelseleri().map(c=>String(c.tarih||'').slice(0,4)).filter(x=>/^\d{4}$/.test(x)))];
  if(!y.includes(buYil())) y.push(buYil());
  return y.sort().reverse();
}
/* sicil/unvan bu listeden beslenir */
function sezonCelseleri(){
  const s=aktifSezon();
  if(s==='hepsi') return grupCelseleri();
  return grupCelseleri().filter(c=>String(c.tarih||'').startsWith(s));
}

function sezonSecici(){
  const y=sezonYillari();
  if(y.length<2 && aktifSezon()===buYil()) return '';    // tek yıl varsa gösterme
  const s=aktifSezon();
  return `<div class="row wrap" style="gap:6px;margin-bottom:10px">
    ${y.map(x=>`<div class="chip ${x===s?'on':''}" onclick="SEZON='${x}';render()">${x}</div>`).join('')}
    <div class="chip ${s==='hepsi'?'on':''}" onclick="SEZON='hepsi';render()">Tüm zamanlar</div>
  </div>`;
}

/* --------------------------- şampiyonlar --------------------------- */
const sampiyonlar=()=>((DB.ayar&&DB.ayar.sampiyonlar)||[]);
const sezonSampiyonu=(yil,oyun)=>sampiyonlar().find(s=>String(s.yil)===String(yil)&&s.oyun===oyun)||null;
function kisininUnvanlari(oyuncuId){
  return sampiyonlar().filter(s=>(s.kimler||[]).includes(oyuncuId));
}

/* Bir yılın şampiyonu: o yılın sicilinde birinci olan(lar) */
function sezonBirincileri(yil,oyun){
  const eski=SEZON; SEZON=String(yil);
  const v=Object.values(istatistik(oyun)).filter(p=>p.celse>0);
  SEZON=eski;
  if(!v.length) return null;
  const sirali = oyun==='batak'
    ? v.slice().sort((a,b)=>b.oran-a.oran||b.gal-a.gal||b.toplamPuan-a.toplamPuan)
    : v.slice().sort((a,b)=>a.ortSira-b.ortSira||a.ortPuan-b.ortPuan);
  const en=sirali[0];
  const esit = oyun==='batak'
    ? sirali.filter(p=>p.oran===en.oran&&p.gal===en.gal)
    : sirali.filter(p=>p.ortSira===en.ortSira);
  return {kimler:esit.map(p=>p.id), mac:en.celse, gal:en.gal,
          oran:Math.round(en.oran*100), tumSira:sirali};
}

function sezonPanosu(){
  const yil=aktifSezon();
  if(yil==='hepsi') return '';
  const k=kurucuMu(), gecmis=yil<buYil();

    ${k&&!kapali&&sezonCelseleri().length

async function sezonKapat(yil){
  if(!kurucuMu()) return toast('Yetkin yok',true);
  const btn=$('#szBtn'); if(btn){btn.disabled=true;btn.innerHTML='<span class="yukleniyor"></span>';}
  try{
    const yeni=sampiyonlar().filter(s=>String(s.yil)!==String(yil));
    ['batak','101'].forEach(oyun=>{
      const s=sezonBirincileri(yil,oyun);
      if(s) yeni.push({yil:String(yil),oyun,kimler:s.kimler,mac:s.mac,gal:s.gal,oran:s.oran,
                       kapanis:new Date().toISOString()});
    });
    DB.ayar.sampiyonlar=yeni;
    await ayarYaz(true);
    await akisEkle('zabit',sezonZabtiUret(yil),{sezon:String(yil)});
    kapatModal(); await yenile(true);
    toast(`${yil} sezonu kapandı, unvanlar yazıldı.`,true);
  }catch(e){ toast(hataMetni(e),true); if(btn){btn.disabled=false;btn.textContent='Kapat ve Zabıt Tut';} }
}
async function sezonAc(yil){
  if(!kurucuMu()) return toast('Yetkin yok',true);
  if(!confirm(`${yil} sezonu yeniden açılsın mı? Şampiyonluk unvanı kaldırılır.`)) return;
  DB.ayar.sampiyonlar=sampiyonlar().filter(s=>String(s.yil)!==String(yil));
  await ayarYaz(true); await yenile(true); toast('Sezon yeniden açıldı');
}

function sezonZabtiUret(yil){
  const g=aktifGrup()||{ad:'Masa',emoji:''};
  const L=[`${g.emoji||''} ${String(g.ad).toLocaleUpperCase('tr-TR')} — ${yil} SEZONU KAPANIŞ ZABTI`,''];
  let varMi=false;
  ['batak','101'].forEach(oyun=>{
    const s=sezonBirincileri(yil,oyun);
    if(!s) return;
    varMi=true;
    const ad2=oyun==='batak'?'BATAK':'101';
    L.push(`${ad2}:`);
    s.tumSira.forEach((p,i)=>L.push(`  ${i+1}. ${ad(p.id)} — ${p.celse} maç, ${p.gal} birincilik, %${Math.round(p.oran*100)}`));
    L.push('');
    L.push(`${yil} ${ad2} ŞAMPİYONU: ${liste(s.kimler.map(ad))}.`+
      (s.kimler.length>1?' Beraberlik hâlinde unvan ortak taşınır.':''));
    const son=s.tumSira[s.tumSira.length-1];
    if(s.tumSira.length>1)
      L.push(`Sezonu ${ad(son.id)} kapatmıştır; kendisine bir sonraki yıl için sabır tavsiye edilir.`);
    L.push('');
  });
  if(!varMi) return L.concat('Bu sezonda kapanmış maç bulunmamaktadır.').join('\n');
  L.push('Unvan kalıcıdır, geri alınamaz. Yeni sezon sıfırdan başlar.');
  L.push('Zabıt okundu, imza altına alındı.');
  return L.join('\n');
}

/* =========================================================
   MASA ÇAĞRISI
   "Perşembe 21:00 Parkverde — kim var?" Akışa düşer, WhatsApp'a
   yapıştırılacak metin ve link üretilir. Cevaplar uygulamada toplanır.

   NEDEN AKIŞ TEPKİSİ: akış kaydını yalnız yazan güncelleyebiliyor
   (kural böyle, doğrusu da bu). Katılım cevabını herkesin kendi adına
   yazması gerekiyor — akis_tepkileri tam bunu yapıyor: (kayıt, kişi,
   işaret) ve kişi yalnız kendi satırını yazabiliyor. Yeni tablo ya da
   yama gerekmedi.

   WhatsApp'ın kendi anketi de bunu yapar; uygulamada olmasının tek
   gerekçesi katılanların doğrudan kuraya girmesi ve kayda geçmesi.
   ========================================================= */

/* Tepki tablosunun anahtarı (kayıt, kişi, işaret) olduğu için bir kişi
   birden çok işaret taşıyabiliyor: biri katılım cevabı, biri eş oyu.
   Silme işlemleri bu yüzden yalnız kendi grubunu temizliyor — yoksa
   katılım cevabı verince eş oyu da uçuyordu. */
const CAGRI_VAR='✋', CAGRI_YOK='✖️', ES_KURA='🎲', ES_BELLI='🤝';
const RSVP_ISARET=[CAGRI_VAR,CAGRI_YOK];
const ESOY_ISARET=[ES_KURA,ES_BELLI];

const cagrilar = ()=>(DB.akis||[]).filter(a=>a.tip==='cagri'&&a.grupId===DB.aktifGrup);
function acikCagri(){
  /* Vakti geçmemiş en yeni çağrı */
  return cagrilar().filter(a=>{
    const t=a.veri&&a.veri.cagri&&a.veri.cagri.zaman;
    return t && new Date(t).getTime() > Date.now()-6*3600e3;   // 6 saat sonrasına kadar yaşasın
  }).sort((x,y)=>String(x.veri.cagri.zaman).localeCompare(String(y.veri.cagri.zaman)))[0]||null;
}
const cagriCevap = (a,isaret)=>(a.tepkiler||[]).filter(t=>t.emoji===isaret).map(t=>t.profilId);
const cagriBenim = a=>{
  const t=(a.tepkiler||[]).find(x=>x.profilId===OTURUM.id&&RSVP_ISARET.includes(x.emoji));
  return t?t.emoji:null;
};
const cagriEsBenim = a=>{
  const t=(a.tepkiler||[]).find(x=>x.profilId===OTURUM.id&&ESOY_ISARET.includes(x.emoji));
  return t?t.emoji:null;
};
/* Eş oylaması: yalnız GELECEĞİNİ söyleyenlerin oyu sayılır — masaya
   oturmayacak kişinin eş usulünü belirlemesi tuhaf olur. Eşitlikte
   sonuç yok, masada konuşulur. */
function cagriEsSonuc(a){
  const gelen=new Set(cagriCevap(a,CAGRI_VAR));
  const oy=e=>(a.tepkiler||[]).filter(t=>t.emoji===e&&gelen.has(t.profilId)).map(t=>t.profilId);
  const k=oy(ES_KURA), b=oy(ES_BELLI);
  return {kura:k, belli:b,
          sonuc: k.length===b.length ? null : (k.length>b.length?'kura':'belli')};
}
/* Çağrının fiilî eş usulü: kesin seçildiyse o, oylamaysa oyun sonucu */
function cagriEsUsul(a){
  const c=a.veri.cagri;
  if(c.es!=='oylama') return c.es;
  return cagriEsSonuc(a).sonuc;      // null → henüz belli değil
}
const profilOyuncuId = pid=>DB.oyuncular.find(o=>o.profilId===pid&&o.masaId===DB.aktifGrup)?.id||null;

async function cagriIsaret(akisId,isaret,grup2,sessiz,laf){

      .eq('akis_id',akisId).eq('profil_id',OTURUM.id).in('emoji',grup2);

}

//== push
/* =========================================================
   #1 PUSH BİLDİRİMİ — masa çağrısı telefonlara düşsün

   İki parça sunucuda (senin Supabase'inde kurulacak):
     · push_abonelikleri tablosu (yama 13)
     · bildirim-gonder Edge Function (VAPID ile şifreli push atar)
   Bu dosya İSTEMCİ tarafı:
     · pushDurum(): tarayıcı destekliyor mu, izin var mı, abone mi
     · pushAc(): izin ister, PushManager'a abone olur, aboneliği tabloya yazar
     · pushKapat(): aboneliği iptal eder
     · pushCagriGonder(): çağrı atılınca Edge Function'ı tetikler

   VAPID public key aşağıda (private key Edge Function'da secret). Sunucu
   yoksa Ayarlar'daki bildirim kartı "kurulum bekliyor" der; hiçbir şey
   bozulmaz.
   ========================================================= */

const VAPID_PUBLIC='BGmk0OslRwGU7rX2XANgiUlsnXCPI04kSvhxM5QLmWRk3jBMFf4c9M1mICVK9BF9FaeVQQr-7f5ajVGgEBLT0Ps';
const PUSH_FN='bildirim-gonder';          // Edge Function adı

function pushDestekli(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function b64uBuf(s){
  const pad='='.repeat((4-s.length%4)%4);
  const b=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...b].map(c=>c.charCodeAt(0)));
}

async function pushAbonelik(){
  if(!pushDestekli()) return null;
  const reg=await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}

async function pushDurum(){
  if(!pushDestekli()) return {destek:false};
  const ab=await pushAbonelik();
  return {destek:true, izin:Notification.permission, abone:!!ab};
}

async function pushAc(){
  if(!pushDestekli()) return toast('Bu tarayıcı bildirim desteklemiyor',true);
  try{

    if(izin!=='granted') return toast('Bildirim izni verilmedi',true);
    const reg=await navigator.serviceWorker.ready;
    let ab=await reg.pushManager.getSubscription();
    if(!ab){
      ab=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:b64uBuf(VAPID_PUBLIC)
      });
    }
    const j=ab.toJSON();
    const {error}=await sb.from('push_abonelikleri').upsert({
      profil_id:OTURUM.id, masa_id:DB.aktifGrup,
      endpoint:ab.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth
    },{onConflict:'endpoint'});

    toast('Bildirimler açıldı — masa çağrısı telefonuna düşecek',true);

      return toast('Bildirim tablosu yok — yama 13 çalıştırılmalı',true);

  }
}

/* =========================================================
   BİLDİRİM: "herkes ayrı ayrı açmasın, açık olsun"

   YAPILAMAYAN: bildirimi başkası adına açmak. Tarayıcı iznini yalnız
   o cihazın sahibi verebilir — ne sunucu, ne kurucu, ne kod. Böyle
   olması iyi: yoksa herkes izinsiz bildirim yağdırırdı.

   YAPILAN: kimsenin aramasına gerek kalmıyor.
     1. İzin ZATEN varsa → hiç sormadan sessizce abone olur.
     2. İzin yoksa → Masa ve Akış sekmesinin TEPESİNDE tek dokunuşluk
        şerit çıkar. Ayarlar'a girmek gerekmiyor.
     3. Reddedilmişse → şerit "tarayıcı ayarından aç" der ve susar
        (ısrar etmek yasak; tarayıcı da bir daha sormaz).
     4. iPhone'da bildirim ancak uygulama ANA EKRANA eklenirse çalışır;
        şerit bunu söyler, boşuna izin istemez.

   Neden kendiliğinden sormuyoruz: izin isteği kullanıcı dokunuşu
   olmadan iOS'ta reddedilir, Chrome'da da "spam" sayılıp kalıcı
   engellenebilir. Bir dokunuş, sonsuza kadar engellenmekten iyidir.
   ========================================================= */

let PUSH_DURUM=null;        // {destek,izin,abone} — render şeridi buna bakar
let PUSH_SERIT_KAPALI=false; // kullanıcı şeridi kapattıysa bu oturumda gösterme

const iosMu=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const anaEkrandaMi=()=>window.matchMedia('(display-mode: standalone)').matches
  || navigator.standalone===true;

/* Girişten sonra bir kez: izin varsa sessizce abone ol, durumu öğren. */
async function pushHazirla(){
  if(!pushDestekli()){ PUSH_DURUM={destek:false}; return; }
  try{
    PUSH_DURUM=await pushDurum();
    /* İzin verilmiş ama bu cihaz aboneliği yoksa (uygulama silinip
       yeniden kurulmuş, önbellek temizlenmiş) — sormadan tamamla. */
    if(PUSH_DURUM.izin==='granted' && !PUSH_DURUM.abone){
      await pushAboneOl(true);
      PUSH_DURUM=await pushDurum();
    }
  }catch(e){ PUSH_DURUM={destek:false}; }
}

/* pushAc()'ın izin istemeyen hâli: izin zaten varken abone eder. */
async function pushAboneOl(sessiz){
  const reg=await navigator.serviceWorker.ready;
  let ab=await reg.pushManager.getSubscription();
  if(!ab){
    ab=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:b64uBuf(VAPID_PUBLIC)
    });
  }
  const j=ab.toJSON();
  const {error}=await sb.from('push_abonelikleri').upsert({
    profil_id:OTURUM.id, masa_id:DB.aktifGrup,
    endpoint:ab.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth
  },{onConflict:'endpoint'});
  if(error&&!sessiz) toast(hataMetni(error),true);
  return !error;
}

/* Masa/Akış tepesindeki şerit — tek dokunuş. */
function pushSerit(){
  if(PUSH_SERIT_KAPALI) return '';
  const d=PUSH_DURUM;
  if(!d) return '';                                  // henüz ölçülmedi
  if(d.destek && d.izin==='granted' && d.abone) return '';   // her şey yolunda

  /* iPhone'da ana ekrana eklenmeden bildirim hiç çalışmıyor */
  if(iosMu() && !anaEkrandaMi())
    return `<div class="uyari" style="margin-bottom:12px">
      🔔 <b>Bildirim için uygulamayı ana ekrana ekle.</b>
      Safari'de <b>Paylaş → Ana Ekrana Ekle</b> deyip oradan aç; masa çağrısı
      o zaman telefonuna düşer. iPhone başka yolla bildirim vermiyor.
      <div style="margin-top:8px"><button class="btn-xs btn-gh" onclick="pushSeritKapat()">Şimdi değil</button></div>
    </div>`;

  if(!d.destek)
    return `<div class="card tight xs dim" style="margin-bottom:12px">
      🔔 Bu tarayıcı bildirim desteklemiyor. Masa çağrısını akıştan görürsün.
      <button class="btn-xs btn-gh" style="margin-left:6px" onclick="pushSeritKapat()">Tamam</button></div>`;

  if(d.izin==='denied')
    return `<div class="card tight" style="margin-bottom:12px">
      <div class="xs dim">🔔 Bildirim bu site için engellenmiş. Tarayıcı ayarlarından
        (adres çubuğundaki kilit → Bildirimler → İzin ver) açman gerekiyor; uygulama
        bir daha soramaz.</div>
      <button class="btn-xs btn-gh" style="margin-top:7px" onclick="pushSeritKapat()">Anladım</button></div>`;

  return `<div class="uyari" style="margin-bottom:12px">
    🔔 <b>Bildirimler kapalı.</b> Aç ki masa çağrısı, uygulama kapalıyken de telefonuna düşsün.
    <div class="row" style="margin-top:9px;gap:7px">
      <button class="btn-g btn-sm" onclick="pushSeritAc()">Bildirimleri Aç</button>
      <button class="btn-xs btn-gh" onclick="pushSeritKapat()">Şimdi değil</button>
    </div></div>`;
}
function pushSeritKapat(){ PUSH_SERIT_KAPALI=true; render(); }
async function pushSeritAc(){
  await pushAc();
  PUSH_DURUM=await pushDurum().catch(()=>PUSH_DURUM);
  render();
}

/* =========================================================
   #3 AYLIK OTOMATİK ÖZET + #2 SEZON KAPANIŞ TÖRENİ

   AYLIK ÖZET: her ayın sonunda "geçen ayın kısası" akışa kendiliğinden
   düşer — en çok kazanan, en çok borçlanan, ayın maç sayısı. Sıfır
   bakım: uygulama açılınca kurucu cihazında bir kez yazılır, tekrarı
   DB.ayar.sonAyOzeti damgasıyla engellenir (yalnız kurucu yazar).

   SEZON TÖRENİ: yıl kapanışını düz pencere yerine tam ekran bir
   törenle ilan eder — şampiyonlar + ünvanlar. Oradan resmen kapatılır
   ve PDF alınır.
   ========================================================= */

const AY_ADI=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz',
              'Ağustos','Eylül','Ekim','Kasım','Aralık'];
const ayAnahtar=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const oncekiAy=()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d; };

/* Bir aya (YYYY-MM) ait maçlardan hafif döküm */
function ayOzetiVeri(ym){
  const aylik=grupCelseleri().filter(c=>String(c.tarih||'').slice(0,7)===ym);
  if(!aylik.length) return null;
  const kaz={};                                  // id -> galibiyet
  const say=id=>kaz[id]=kaz[id]||{id,gal:0,mac:0};
  let batak=0, yz=0;
  aylik.forEach(c=>{
    if(c.oyun==='batak'){ batak++;
      const m=batakMac(c), kz=c.kazanan??m.macKazanan; if(kz==null) return;
      c.takimlar.forEach((tk,ti)=>tk.oyuncular.forEach(id=>{const p=say(id);p.mac++;if(ti===kz)p.gal++;}));
    }else{ yz++;
      const sr=yzMac(c).sira; if(!sr.length) return;
      sr.forEach((r,i)=>{const p=say(r.id);p.mac++;if(i===0)p.gal++;});
    }
  });
  const sirali=Object.values(kaz).sort((a,b)=>b.gal-a.gal||b.mac-a.mac);
  /* O ay doğan borçlar (akıştaki borcKaydi kayıtları) */
  const borc={};
  (DB.akis||[]).forEach(a=>{ const k=a.veri&&a.veri.borcKaydi;
    if(!k||String(a.olusturma||'').slice(0,7)!==ym) return;
    (k.borclular||[]).forEach(id=>{ borc[id]=(borc[id]||0)+(Number(k.adet)||1); });
  });
  const enBorc=Object.entries(borc).sort((a,b)=>b[1]-a[1])[0];
  return {ym, batak, yz, toplam:aylik.length, lider:sirali[0]||null, sirali,
          enBorclu:enBorc?{id:enBorc[0],adet:enBorc[1]}:null};
}

function ayOzetiMetni(ym){
  const v=ayOzetiVeri(ym); if(!v) return null;
  const g=aktifGrup()||{ad:'Masa',emoji:''};
  const [yil,ay]=ym.split('-');
  const L=[`${g.emoji||'📅'} ${AY_ADI[+ay-1]} ${yil} — AYIN KISASI`,''];
  L.push(`Bu ay ${v.toplam} maç görülmüştür (${v.batak} Batak, ${v.yz} adet 101).`);
  if(v.lider&&v.lider.gal>0)
    L.push(`Ayın galibi ${ad(v.lider.id)}: ${v.lider.mac} maçta ${v.lider.gal} birincilik.`);
  if(v.enBorclu)
    L.push(`Ayın kesesi ${ad(v.enBorclu.id)}: ${v.enBorclu.adet} kalem yeni borç. Kahve ocağı ısınmıştır.`);
  L.push('');
  L.push('İtirazlar bir sonraki ayın ilk çayında dinlenir.');
  return L.join('\n');
}

/* Uygulama açılınca: geçen ayın özeti yazıldı mı? Yalnız kurucu yazar. */
async function ayOzetiKontrol(){
  try{
    if(!kurucuMu()) return;
    const ym=ayAnahtar(oncekiAy());
    if((DB.ayar&&DB.ayar.sonAyOzeti)===ym) return;   // zaten yazılmış
    const metin=ayOzetiMetni(ym);
    /* Damgayı her hâlükârda ilerlet: maç yoksa da bir daha bakmayalım. */
    DB.ayar.sonAyOzeti=ym;
    if(metin){ await akisEkle('mesaj',metin,{ayOzeti:ym}); }
    await ayarYaz(true);
  }catch(e){ /* özet kritik değil; sessiz geç */ }
}
